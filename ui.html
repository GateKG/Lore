function editKeeps(){
  /* the CUT layer decides what survives, never the silence layer - and with
     nothing cut, "keep it all" is the honest answer, so a silence-only edit
     works on the whole recording */
  if(!edCuts().length)return [{a:0,b:edDur()}];
  const dur=edDur(),marked=edMerge(edCuts());
  if(V.ed.mode==='keep')return marked;
  const keeps=[]; let cur=0;                                  /* remove mode: keep the gaps */
  for(const s of marked){ if(s.a-cur>=0.2)keeps.push({a:cur,b:s.a}); cur=Math.max(cur,s.b); }
  if(dur-cur>=0.2)keeps.push({a:cur,b:dur});
  return keeps;
}
function edUI(on){
  V.ed.on=!!on;
  $('#vtrim').classList.toggle('on',!!on);
  $('#vsegs').classList.toggle('on',!!on);
  $('#vedrow').classList.toggle('on',!!on && !V.ed.busy && !V.ed.confirm);
  if(!on){ if(V.ed.busy){try{api.edit_cancel();}catch(_){}} clearTimeout(V.ed._pt);V.ed._pt=null;
    V.ed.busy=false;V.ed.confirm=false;V.ed.preview=false;
    $('#vedprog').classList.remove('on');$('#vedconfirm').classList.remove('on'); }
  if(on)layEd();
}
function layEd(){
  const box=$('#vsegs'); if(!box)return; box.innerHTML='';
  if(!edDur())return;
  /* the layer you are NOT marking, shown so you can aim against it */
  (V.ed.other||[]).forEach(o=>{
    const g=el('div','edseg ghost'+(V.ed.layer==='silence'?' keep':' mutey'));
    const x=edPx(o.a); g.style.left=x+'px';
    g.style.width=Math.max(2,edPx(o.b)-x)+'px';
    g.title=(V.ed.layer==='silence'?'kept piece: ':'silenced: ')
      +fmtT(o.a)+' \u2192 '+fmtT(o.b);
    box.append(g);
  });
  V.ed.segs.forEach((s,i)=>{
    const b=el('div','edseg '+(V.ed.layer==='silence'?'mutey'
                 :(V.ed.mode==='keep'?'keep':'cut'))+(i===V.ed.sel?' sel':''));
    const x=edPx(s.a),y=edPx(s.b);
    b.style.left=x+'px'; b.style.width=Math.max(2,y-x)+'px';
    b.title=fmtT(s.a)+' \u2192 '+fmtT(s.b)+'  \u00b7  '+fmtT(s.b-s.a)
      +' long\ndrag to move \u00b7 drag an end to trim';
    b.addEventListener('pointerdown',ev=>{
      if(ev.target.classList.contains('edh'))return;
      /* select WITHOUT rebuilding: layEd() wipes #vsegs, which would delete
         the very node this drag is attached to (and kill pointer capture) */
      V.ed.sel=i;
      box.querySelectorAll('.edseg').forEach((q,j)=>q.classList.toggle('sel',j===i));
      edLabel();
      /* DRAG THE WHOLE PIECE. Trimming both ends one at a time just to shift a
         clip two minutes later is nobody's idea of an editor. */
      const seg=V.ed.segs[i], x0=ev.clientX, a0=seg.a, len=seg.b-seg.a;
      const wrapW=Math.max(1,$('#vseekwrap').getBoundingClientRect().width-14);
      const bb=b;                       /* the node that got the pointerdown */
      /* CLICK and DRAG are different gestures and must stay different: a
         press-and-release inside a piece means "show me this bit", a
         press-hold-move means "move the piece". Nothing shifts until the
         pointer has actually travelled, so a click never nudges an edge. */
      let moved=false;
      const move=e2=>{
        if(!moved&&Math.abs(e2.clientX-x0)<4)return;
        moved=true;
        const dt=((e2.clientX-x0)/wrapW)*tlWin().len;
        seg.a=clamp(a0+dt,0,Math.max(0,edDur()-len)); seg.b=seg.a+len;
        edRepos();
        if(bb)bb.title=fmtT(seg.a)+' \u2192 '+fmtT(seg.b)+'  \u00b7  '+fmtT(len)+' long';
        edLabel();};
      const up=e3=>{ try{bb.releasePointerCapture(ev.pointerId);}catch(_){}
        bb.removeEventListener('pointermove',move);bb.removeEventListener('pointerup',up);
        if(!moved){
          const vdd=$('#vvideo');
          try{vdd.currentTime=tlTimeAt((e3&&e3.clientX!=null)?e3.clientX:x0);}catch(_){}
          V.ed.preview=false;          /* looking, not replaying the piece */
          tlFollow(); tlPaint();
        }
        layEd(); };
      try{bb.setPointerCapture(ev.pointerId);}catch(_){}
      bb.addEventListener('pointermove',move); bb.addEventListener('pointerup',up);
      ev.preventDefault();});
    box.append(b);
  });
  const sg=V.ed.segs[V.ed.sel];
  if(sg){ ['a','b'].forEach(k=>{ const h=el('div','edh'); h.dataset.k=k;
    h.style.left=edPx(sg[k])+'px';
    h.title=(k==='a'?'start ':'end ')+fmtT(sg[k])+' - drag to trim';
    box.append(h); }); }
  edLabel();
  $('#vedkeep').classList.toggle('on',V.ed.mode==='keep');
  $('#vedcut').classList.toggle('on',V.ed.mode==='remove');
  const lc=$('#vedlcut'), lm=$('#vedlmute');
  if(lc)lc.classList.toggle('on',V.ed.layer!=='silence');
  if(lm)lm.classList.toggle('on',V.ed.layer==='silence');
}
/* reposition the EXISTING band + handle nodes during a drag - must NOT rebuild
   #vsegs (innerHTML wipe would delete the handle mid-drag and kill pointermove) */
function edRepos(){
  const box=$('#vsegs'); if(!box)return;
  const bands=box.querySelectorAll('.edseg');
  V.ed.segs.forEach((s,i)=>{ const b=bands[i]; if(b){ const x=edPx(s.a); b.style.left=x+'px'; b.style.width=Math.max(2,edPx(s.b)-x)+'px'; } });
  const hs=box.querySelectorAll('.edh'), sg=V.ed.segs[V.ed.sel];
  if(sg&&hs.length>=2){ hs[0].style.left=edPx(sg.a)+'px'; hs[1].style.left=edPx(sg.b)+'px'; }
  edLabel();
}
/* MB the saved clip will take: the cap when there is one, otherwise the
   recording's own bitrate. Discord's webhook only carries small files, so the
   button for it appears only when the result would actually fit. */
function edSizeMB(seconds){
  const cap=+(($('#vedqual')||{}).value||0);
  if(cap>0)return cap;
  const mbps=+((S.settings&&S.settings.settings&&S.settings.settings.bitrate_mbps)||15);
  return seconds*mbps/8;
}
const DISCORD_MB=25;      /* a webhook will not take more than this */
function edSyncOut(seconds){
  const mb=edSizeMB(seconds), cap=+(($('#vedqual')||{}).value||0);
  const sz=$('#vedsize');
  if(sz)sz.textContent=seconds>0
    ?(cap>0?'≈ '+cap+' MB cap':'≈ '+(mb<1024?mb.toFixed(0)+' MB':(mb/1024).toFixed(1)+' GB'))
    :'—';
  const d=$('#veddisc');
  if(d){
    const fits=S.hasWebhook&&seconds>0&&mb<=DISCORD_MB;
    d.style.display=fits?'':'none';
    d.title=fits?'Save it and post it to your Discord'
                :'Too large for a Discord webhook - choose "Fit 25 MB"';
  }
}
function edLabel(){
  const sg=V.ed.segs[V.ed.sel], n=V.ed.segs.length;
  const keeps=editKeeps(), tot=keeps.reduce((q,x)=>q+(x.b-x.a),0);
  edSyncOut(tot);
  const out=$('#vedsurv'); if(!out)return;
  if(!n||!sg){ out.textContent='nothing marked yet - press start, then end'; return; }
  const silent=edMutes().reduce((q,x)=>q+(x.b-x.a),0);
  out.textContent=fmtT(sg.a)+' \u2192 '+fmtT(sg.b)+' \u00b7 '+fmtT(sg.b-sg.a)
    +(n>1?'  (piece '+(V.ed.sel+1)+'/'+n+')':'')
    +'   \u00b7   result '+fmtT(tot)
    +(silent>0?'  ('+fmtT(silent)+' silenced)':'');
}
function edPreviewSeg(){ const vd=$('#vvideo'),s=V.ed.segs[V.ed.sel]; if(!s)return; V.ed.preview=true;
  try{vd.currentTime=s.a;vd.play().catch(()=>{});}catch(e){} }
function edValid(keeps){
  if(!edCuts().length&&!edMutes().length){
    whisper('mark something first — a piece to keep, or a stretch to silence');
    return false; }
  if(!keeps||!keeps.length){ whisper('nothing would be kept — adjust your pieces'); return false; }
  if(keeps.reduce((n,s)=>n+(s.b-s.a),0)<0.25){ whisper('the result would be empty'); return false; }
  return true;
}
function edConfirmReplace(){
  const keeps=editKeeps(); if(!edValid(keeps))return;
  V.ed.confirm=true; $('#vedrow').classList.remove('on');
  const dur=edDur(),tot=keeps.reduce((n,s)=>n+(s.b-s.a),0);
  $('#vedconfirm').querySelector('.msg').innerHTML=
    `This <b>replaces the original</b> with your edit —<br>${keeps.length} piece${keeps.length>1?'s':''}, ${fmtT(tot)} of ${fmtT(dur)}. The rest is gone for good.`;
  $('#vedconfirm').classList.add('on');
}
function edStart(replace,toDiscord){
  const c=V.cur; if(!c)return;
  const keeps=editKeeps(); if(!edValid(keeps))return;
  const segs=keeps.map(s=>[+s.a.toFixed(3),+s.b.toFixed(3)]);
  V.ed.busy=true; V.ed.wasReplace=!!replace;
  $('#vedrow').classList.remove('on'); $('#vedconfirm').classList.remove('on');
  $('#vedphase').textContent='preparing…'; $('#vedbar').firstElementChild.style.width='0%';
  $('#vedprog').classList.add('on');
  if(replace){ try{const vd=$('#vvideo');vd.pause();vd.removeAttribute('src');vd.load();}catch(e){} }
  const ed=V.ed;   /* same generation trick as edPoll: a close-then-reopen while
                      edit_video is in flight must not pop the editor open on the
                      NEXT viewing session */
  const capMB=+(($('#vedqual')||{}).value||0);
  const muted=edMerge(edMutes()).map(x=>[+x.a.toFixed(3),+x.b.toFixed(3)]);
  Promise.resolve(api.edit_video(c.path,segs,!!replace,!!toDiscord,capMB,muted)).then(r=>{
    if(ed!==V.ed)return;
    if(!(r&&r.ok)){ edFail((r&&r.why)||'could not start'); return; }
    edPoll();
  }).catch(()=>{ if(ed===V.ed)edFail('could not start'); });
}
function edFail(why){ V.ed.busy=false; $('#vedprog').classList.remove('on'); whisper('edit: '+why);
  if(V.ed.wasReplace){const c=V.cur;if(c)openViewer(c);}else{edUI(true);} }
function edPoll(){
  clearTimeout(V.ed._pt);
  const ed=V.ed;   /* generation token: edReset swaps V.ed, and a stale in-flight
                      edit_status continuation must never close/hijack the NEXT
                      viewer session (backend returns the terminal record forever) */
  Promise.resolve(api.edit_status()).then(st=>{
    if(ed!==V.ed)return;
    if(!st){ V.ed._pt=setTimeout(edPoll,500); return; }
    $('#vedbar').firstElementChild.style.width=(st.pct||0)+'%';
    $('#vedphase').textContent=(st.phase||'working')+' · '+(st.pct||0)+'%';
    if(st.done){
      V.ed.busy=false; $('#vedprog').classList.remove('on');
      if(st.ok){ whisper('saved ✓ — '+(st.name||'your edit'));
        if(V.ed.wasReplace&&V.cur){const p=V.cur.path;delete S.meta[p];idbSetDur(p,null);}   /* the replaced file is SHORTER now - a cached length would wear the old duration forever (idb re-persists it, too) */
        edReset(); closeViewer(); refreshLibrary(true); }
      else{ whisper(st.why==='cancelled'?'edit cancelled — original untouched':'edit failed: '+(st.why||'see lore.log'));
        if(V.ed.wasReplace){const c=V.cur;if(c)openViewer(c);}else{edUI(true);} }
      return;
    }
    V.ed._pt=setTimeout(edPoll,450);
  }).catch(()=>{ if(ed===V.ed)V.ed._pt=setTimeout(edPoll,600); });
}
/* fit the stage to what is REALLY below it. the old hard-coded
   calc(100vh - 150px) guessed at the bottom group's height; open the editor
   and the guess ran short, so flex overflow shoved the video over the gold
   ring, the details line, even toward the ✕. measure, don't guess. */
function sizeViewer(){
  /* the gold marks are placed in MEASURED pixels, so every relayout has to
     re-place them. A ResizeObserver alone is not enough: its callbacks ride
     the paint cycle, and this runs inside a frameless WebView2 that can go
     long stretches without painting. sizeViewer is the app's own "geometry
     changed" signal - window resize, theater in/out, the transcript column
     opening - so hang the re-place off that too. */
  if(typeof _hlPlace==='function'&&_hlPlace)_hlPlace();
  const vw=$('#viewer');
  if(!vw||document.body.classList.contains('vfull'))return;   /* theater has its own fixed geometry */
  const H=s=>{const n=$(s);return n?n.offsetHeight:0;};        /* display:none measures 0, conveniently */
  const rows=H('#vedrow')+H('#vedprog')+H('#vedconfirm');
  const below=H('#vtitle')+H('#vbar')+rows+(rows?8:0);         /* +8: the open row's margin-top - offsetHeight doesn't count margins */
  /* 48 up top for ✕ + the drag pill · 30 under the video (the corner marks
     hang 18px past the frame and there must be air under them) · 8 for the
     details→toolbar gap (vtitle's margin) · 16 bottom padding */
  vw.style.setProperty('--vmaxh',Math.max(140,innerHeight-48-30-8-16-below)+'px');
  vw.style.setProperty('--vmaxw',Math.max(220,innerWidth-90)+'px');   /* ring + corners stay clear of the ✕ */
}
function wireViewer(){

  $('#vclose').addEventListener('click',closeViewer);

     start there is you moving the window, not asking to leave. Only a click
     that stayed put counts. The top strip is also a drag handle for the OS
     move loop, and double-clicking it goes fullscreen (matching the book,
     where a double-click on the cover maximises the app). */
  let _vdn=null;
  $('#viewer').addEventListener('pointerdown',e=>{
    if(e.target.id!=='viewer'){_vdn=null;return;}
    _vdn={x:e.clientX,y:e.clientY,top:e.clientY<Math.max(64,innerHeight*0.13)};
    if(_vdn.top&&e.button===0&&api&&api.begin_drag){
      try{api.begin_drag();}catch(err){}     /* hand the window to the OS */

     half-marked clip to a stray click beside the video is indefensible - the
     way out is the ✕ or Esc, both of which are deliberate. The surround is

  addEventListener('keydown',e=>{

    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      e.preventDefault();e.stopImmediatePropagation();
      const step=String((S.settings&&S.settings.settings&&S.settings.settings.seek_step)||'5');
      let jump;

  $('#vedkeep').addEventListener('click',()=>{V.ed.mode='keep';layEd();});

  $('#vedlcut').addEventListener('click',()=>edLayer('cut'));
  $('#vedlmute').addEventListener('click',()=>edLayer('silence'));
  $('#vedadd').addEventListener('click',()=>{
    const t=vd.currentTime||0, d=vd.duration||0;

    const span=Math.max(2,tlWin().len*0.06);
    V.ed.segs.push({a:clamp(t,0,Math.max(0,d-0.5)),b:clamp(t+span,0.5,d)});

  $('#veddel').addEventListener('click',()=>{

    V.ed.segs.splice(V.ed.sel,1); V.ed.sel=Math.max(0,V.ed.sel-1); layEd();});
  /* Marking an edge NEVER collapses the piece. Putting the start after the
     end simply swaps them, so the piece spans the two points you actually
     chose instead of shrinking to a second stranded behind the playhead. */
  const edEdge=(which)=>{

      if(k==='a')s.a=Math.min(t,s.b-0.3); else s.b=Math.max(t,s.a+0.3); edRepos(); };
    const up=()=>{h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);layEd();edPreviewSeg();};
    h.addEventListener('pointermove',move); h.addEventListener('pointerup',up);

  addEventListener('resize',()=>{if(V.ed.on)setTimeout(layEd,100);});
  /* no-overlap watch: refit whenever the window, the video, or the bottom group
     changes. the ResizeObserver sees every .on toggle on the editor rows

  vd.addEventListener('loadedmetadata',sizeViewer);

  if(window.ResizeObserver){
    const ro=new ResizeObserver(()=>{if($('#viewer').classList.contains('on'))sizeViewer();});
    ['#vtitle','#vbar','#vedrow','#vedprog','#vedconfirm'].forEach(s=>{const n=$(s);if(n)ro.observe(n);});
    /* the seek bar can change width WITHOUT a window resize (the armed 🗑 widens
       the toolbar at capped widths) - refit the seg bands from the fresh rect.
       edRepos, not layEd: a rebuild mid-drag would kill pointermove */
    const rs=new ResizeObserver(()=>{if(V.ed&&V.ed.on)edRepos();});
    const sw=$('#vseekwrap');if(sw)rs.observe(sw);
  }
}

/* ---------------------------------------------------------------- input */
function wireInput(){
  $('#cornerR').addEventListener('click',()=>stepTurn(1));
  $('#cornerL').addEventListener('click',()=>stepTurn(-1));
  $('#navNext').addEventListener('click',()=>stepTurn(1));
  $('#navPrev').addEventListener('click',()=>stepTurn(-1));
  /* scroll to riffle through the book (the ONE wheel listener - scrollable
     panels keep their scroll, the closed cover keeps its peace) */
  addEventListener('wheel',e=>{
    if(document.body.classList.contains('intro'))return;
    if($('#viewer').classList.contains('on')||$('#modal').classList.contains('on'))return;
    if(e.target&&e.target.closest&&e.target.closest('select,input,textarea'))return;
    /* walk EVERY scroll container above the target, not just the innermost: a
       non-scrollable .lrows nested in a scrollable .set-rows used to scroll the
       panel AND turn the page on the same notch */
    for(let sc=e.target&&e.target.closest&&e.target.closest('.rowlist,.set-rows,.lrows'); sc;
        sc=sc.parentElement&&sc.parentElement.closest('.rowlist,.set-rows,.lrows')){
      const scrollable=sc.scrollHeight>sc.clientHeight+1;
      const atTop=sc.scrollTop<=0, atBot=sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1;
      /* let the inner panel scroll UNTIL its edge, THEN chain the wheel to a page turn */
      if(scrollable && !((e.deltaY<0&&atTop)||(e.deltaY>0&&atBot)))return;
    }
    onWheelNotches(e);
  },{passive:true});
  [['#pageL',-1],['#pageR',1]].forEach(([sel,dir])=>{
    $(sel).addEventListener('click',e=>{
      if(e.target.closest('.proj,.vrow,.grow,.srow,.ledit,button,input,select,.tgl,.seg,.kcap'))return;
      const r=$(sel).getBoundingClientRect();
      const frac=(e.clientX-r.left)/r.width;
      if(dir<0&&frac<0.09)stepTurn(-1);
      if(dir>0&&frac>0.91)stepTurn(1);
    });});
  addEventListener('keydown',e=>{
    if(document.body.classList.contains('intro'))return;
    if($('#modal').classList.contains('on')){
      /* esc dismisses the rename / burn cards - same teardown as their cancel
         buttons. the sigil capture eats its own esc in the capture phase, so
         it can never land here */
      if(e.key==='Escape'){const m=$('#modal');m.classList.remove('on');m.innerHTML='';}
      return;}
    if($('#viewer').classList.contains('on'))return;
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
    if(e.key==='ArrowRight'||e.key==='PageDown')stepTurn(1);
    if(e.key==='ArrowLeft'||e.key==='PageUp')stepTurn(-1);
    if(e.key==='Home'||e.key==='Escape')requestTurn(0);
    if(e.key==='End')requestTurn(S.spreads.length-1);});   /* the back cover, one keypress - mirrors Home */
  /* Every place that REPORTS work is now a door to the page that lists it:
     the saving card top-left, the status line under the seal (the one that
     says "reading big walk..."), and the wordmark goes home. */
  const brand=$('#brand');
  if(brand)brand.addEventListener('click',()=>requestTurn(0));
  const ssub=$('#statesub');
  if(ssub){ ssub.style.cursor='pointer';
    ssub.addEventListener('click',e=>{e.stopPropagation();openWork();}); }
  document.addEventListener('click',e=>{
    const c=e.target&&e.target.closest&&e.target.closest('#bindcard');
    if(c)openWork();
  });
  $('#seal').addEventListener('click',()=>{api.record_toggle();});
  $('#btn-close').addEventListener('click',()=>api.hide());
  $('#btn-min').addEventListener('click',()=>api.minimize());
  $('#btn-max').addEventListener('click',async()=>{
    const z=await api.toggle_maximize();
    $('#btn-max').textContent=z?'❐':'▢';});
  document.addEventListener('contextmenu',e=>e.preventDefault());

  /* native window drag on the leather (real OS move loop = Aero Snap works:
     drag to the top edge to maximize, to a side to half-snap).
     Double-press is detected HERE, on pointerdown, because begin_drag hands
     the mouse to the OS move loop — the browser never sees the button-up, so
     a real 'dblclick' event only fires when it wins a race it usually loses. */
  const dragFrom=(elx,dblMax)=>{
    let lastDn=0,lastX=0,lastY=0;
    elx.addEventListener('pointerdown',async e=>{
      if(e.button!==0)return;
      /* #brand is a link home, not a place to grab the window: begin_drag
         hands the mouse to the OS move loop, so the browser never sees the
         button-up and the click never fires */
      if(e.target.closest('button,.itab,#brand'))return;
      const now=performance.now();
      /* double-press needs the cursor to have STAYED PUT: a drag-drop-regrab
         within 400ms is two drags, not a maximize (the OS move loop eats the
         button-up, so distance is the only signal a drag happened) */
      if(dblMax&&now-lastDn<400&&Math.hypot(e.screenX-lastX,e.screenY-lastY)<8){
        lastDn=0;
        const z=await api.toggle_maximize();
        $('#btn-max').textContent=z?'❐':'▢';
        return;
      }
      lastDn=now;lastX=e.screenX;lastY=e.screenY;
      api.begin_drag&&api.begin_drag();
    });};
  dragFrom($('#toprim'),true);dragFrom($('#cover'),false);
  dragFrom($('#dragpill'),true);   /* the player pill moves the window EXACTLY like the rim - same native move loop, same double-press-to-maximize */

  const grip=$('#grip');
  let rs=null, rsPending=false;
  grip.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;   /* right/middle press must not arm a live resize (context menu is suppressed app-wide, so nothing would even hint why the window is warping) */
    rs={sx:e.screenX,sy:e.screenY,w:innerWidth,h:innerHeight};
    grip.setPointerCapture(e.pointerId);e.preventDefault();});
  grip.addEventListener('pointermove',e=>{
    if(!rs||rsPending)return;
    const w=Math.max(860,rs.w+(e.screenX-rs.sx));
    const h=Math.max(645,rs.h+(e.screenY-rs.sy));
    rsPending=true;
    Promise.resolve(api.resize_to(w,h)).finally(()=>{setTimeout(()=>{rsPending=false;},50);});});
  grip.addEventListener('pointerup',e=>{
    if(rs){const w=Math.max(860,rs.w+(e.screenX-rs.sx));
      const h=Math.max(645,rs.h+(e.screenY-rs.sy));
      api.resize_to(w,h);
      setTimeout(()=>dispatchEvent(new Event('resize')),160);}
    rs=null;});

  let rzT=null,lastPP=perPage();
  window._relayout=()=>relayout();   /* openTome needs a handle: resizes that settle during the intro are dropped, so the cover-open must reconcile geometry itself */
  function relayout(){
    const np=perPage();
    if(np!==lastPP){
      if(S.turning){setTimeout(relayout,400);return;}
      lastPP=np;
      const curKey=S.chapterOf[S.idx];
      const cs=S.chapterOf.indexOf(curKey);
      const off=cs===-1?0:S.idx-cs;
      buildSpreads();
      let idx=S.chapterOf.indexOf(curKey);
      if(idx!==-1){const n=S.chapterOf.filter(k=>k===curKey).length;
        idx+=Math.min(off,n-1);}
      else idx=clamp(S.idx,0,S.spreads.length-1);
      renderSpread(idx);
    }else{
      paintTabs();          /* re-measure + re-report the silhouette */
    }
  }
  let _reszEnd=null,_resizeWasActive=false;
  addEventListener('resize',()=>{clearTimeout(rzT);clearTimeout(_reszEnd);clearTimeout(_warmTimer);
    _pgRect=null;
    if(flight.length)settleFlightNow();
    document.body.classList.add('resizing');
    _resizeWasActive=true;
    _reszEnd=setTimeout(()=>{
      document.body.classList.remove('resizing');
      if(document.body.classList.contains('intro'))return;  /* settle after open */
      if(_resizeWasActive){
        _resizeWasActive=false;
        _turnWarmed=false;_turnWarmPromise=null;
        relayout();warmCache();prewarmTurn();startDust();   /* re-scatter the motes over the NEW pages rect - they were pinned to the boot-size window */
        /* the window just settled at a new size (grip drag, Aero snap-to-top,
           half-snap) - re-sync the maximise button glyph so it can't lie */
        try{Promise.resolve(api.window_state()).then(ws=>{$('#btn-max').textContent=(ws&&ws.maximized)?'❐':'▢';});}catch(e){}
      }
    },180);});
}

/* ----------------------------------------------------------------- intro */
function preIntro(){
  /* Reveal the closed LORE cover only after EVERYTHING on it can actually
     paint: the embedded leather + walnut JPEGs decoded, the fonts settled,
     and two frames rendered with them in place. first_paint() is what shows
     the native window, so the first visible frame IS the textured cover -
     never the flat-brown pre-paint colour. */
  try{
    const iv=$('#intro');if(iv)iv.style.display='';
    document.body.classList.add('intro');
    sendShape();
    let fired=false;
    const reveal=()=>{ if(fired)return; fired=true;
      /* the window is HIDDEN here - that is the whole point of this gate - and
         rAF NEVER TICKS in a hidden window. Waiting on a double-rAF stranded
         every cold boot in the tray until the 20s watchdog. Timers still run
         hidden, so the timer is the real path; the rAF pair stays for the
         (irrelevant) visible case and whichever lands first wins. */
      let called=false;
      const go=()=>{ if(called)return; called=true;
        /* whatever the initial focus walk landed on, nothing may wear a
           focus highlight on the first frame the user ever sees */
        try{document.activeElement&&document.activeElement.blur&&document.activeElement.blur();}catch(e){}
        try{api.first_paint&&api.first_paint();}catch(e){} };
      requestAnimationFrame(()=>requestAnimationFrame(go));
      setTimeout(go,60); };
    /* wait for the intro's real pixels, but NEVER hang hidden: every branch
       resolves on failure, fonts get 1.5s at most, and a 4s hard ceiling
       reveals no matter what (the backend's 20s watchdog stays a pure net) */
    const wait=ms=>new Promise(r=>setTimeout(r,ms));
    const css=getComputedStyle(document.documentElement);
    const decoded=name=>{        /* pre-decode an embedded texture data-URI */
      try{
        const m=(css.getPropertyValue(name)||'').match(/url\(\s*["']?([^"')]+)["']?\s*\)/);
        if(!m)return Promise.resolve();
        const img=new Image();img.src=m[1];
        return img.decode?img.decode().catch(()=>{}):Promise.resolve();
      }catch(e){return Promise.resolve();}
    };
    Promise.race([
      Promise.all([
        decoded('--leathertex'),                       /* the cover's hide */
        Promise.race([(document.fonts&&document.fonts.ready)||Promise.resolve(),wait(1500)])
      ]),
      wait(4000)
    ]).then(reveal,reveal);
  }catch(e){try{api.first_paint&&api.first_paint();}catch(_){}}
}
let _tomeOpening=false, _openTimer=null, _bookReady=false;
function openTome(){
  /* wait until the real pages exist beneath the cover so opening reveals them
     (not empty brown leather) even if the reader clicks the instant it shows */
  if(!_bookReady){setTimeout(openTome,80);return;}
  /* swing the front cover open - it VANISHES past vertical, revealing the
     real book (already rendered underneath). The table wood fades out with
     it. Nothing is cloned, so nothing can flicker. */
  const iv=$('#intro');
  if(!iv||!document.body.classList.contains('intro')||_tomeOpening)return;
  _tomeOpening=true;
  try{
    iv.style.display='';                        /* make sure the overlay is live */
    document.body.classList.remove('intro');   /* top chrome fades in, book revealed beneath */
    iv.classList.add('fading');                 /* the leather LORE card crossfades away */
    /* the resize settle DROPS resizes that land while body.intro is armed (tray
       rest is exactly when games switch resolutions) - so reconcile geometry the
       moment the cover opens, or the book paints with the OLD monitor's --wing/--vcols */
    try{window._relayout&&window._relayout();}catch(e){}
    const pr=$('#pages').getBoundingClientRect();
    requestAnimationFrame(()=>requestAnimationFrame(()=>prewarmTurn()));
    setTimeout(()=>spawnSparks(pr.left+pr.width*0.5,pr.top+pr.height*0.42,10),240);
    clearTimeout(_openTimer);
    _openTimer=setTimeout(()=>{iv.style.display='none';iv.classList.remove('fading');_tomeOpening=false;},980);
  }catch(e){
    /* the opening must NEVER be able to strand the book closed */
    try{iv.style.display='none';}catch(_){}
    document.body.classList.remove('intro');
    _tomeOpening=false;
  }
}
/* Called from Python just before the window hides (rest in tray). The intro is
   a ONE-TIME ceremony - it plays when the exe cold-starts and NEVER again, so
   resting only tidies up: settle sheets, close the player, land on contents.
   The book stays open exactly as the reader will find it. */
window.tomeRest=function(){
  try{
    clearTimeout(_openTimer);          /* don't let a pending open hide the overlay */
    settleFlightNow();                 /* abandon any leaf mid-air first */
    closeViewer();
    const iv=$('#intro');
    if(iv){iv.classList.remove('fading');iv.style.display='none';}
    document.body.classList.remove('intro');
    _tomeOpening=false;
    renderSpread(0);                   /* wake to the first page, current data */
  }catch(e){}
};
/* Called from Python JUST BEFORE the window shows again: arm a leather veil at
   full opacity (synchronous - no rAF, the window is still hidden), so the
   first visible frame is calm leather; once frames tick, it fades out fast.
   That is the tray-open "soft fade in" instead of the content popping. */
window.tomeWake=function(){
  try{
    /* geometry may have changed while we slept (game resolution switches) and
       the resize settle drops events during rest - reconcile now */
    try{window._relayout&&window._relayout();}catch(e){}
    if(document.body.classList.contains('reduced'))return;
    /* the veil is a hidden->shown courtesy ONLY: over a book already on screen
       (tray double-click while open, the late wake retry after show) it reads
       as a leather blink, and the cold-boot intro must never wear it */
    if(document.visibilityState==='visible'||document.body.classList.contains('intro'))return;
    let v=document.getElementById('wakeveil');
    if(!v){
      v=document.createElement('div');v.id='wakeveil';
      v.style.cssText='position:fixed;inset:0;z-index:200;pointer-events:none;'+
        'background:linear-gradient(180deg,var(--leather) 0%,var(--leather) 46%,var(--leather-lo) 100%);'+
        'opacity:1';
      document.body.appendChild(v);
    }else{v.style.transition='';v.style.opacity='1';}
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      v.style.transition='opacity .22s ease';
      v.style.opacity='0';
      setTimeout(()=>{try{v.remove();}catch(e){}},420);
    }));
    setTimeout(()=>{try{v.remove();}catch(e){}},1200);   /* safety: the veil must never be able to linger */
  }catch(e){}
};
function playIntro(){
  const iv=$('#intro');
  if(document.body.classList.contains('reduced')){
    document.body.classList.remove('intro');iv.style.display='none';sendShape();
    api.first_paint&&api.first_paint();return;}
  iv.addEventListener('click',openTome);   /* a click still opens it early */
  setTimeout(prewarmTurn,120);             /* raster-warm a leaf */
  setTimeout(warmTurnPath,560);            /* JIT-warm the real turn path, hidden under the cover */
  if(!location.hash.includes('introhold'))setTimeout(openTome,1600);   /* otherwise auto-open after ~1.5s; #introhold keeps the closed cover up for screenshots/harnesses */
}

/* ---- textures: rasterise the paper grain ONCE ----
   The paper grain ships as an SVG feTurbulence+feDiffuseLighting filter. As a
   live CSS background it must be re-rasterised whenever its layer repaints -
   cheap for one static page, but a real cost on every 3D-rotating sheet (and
   notably slow in WebView2). We bake it to a flat PNG tile at boot and use it
   everywhere, so pages and flying sheets share one identical, cheap texture. */
function rasterizeTexture(svgUrl,w,h){
  return new Promise(res=>{
    try{
      const img=new Image();
      img.onload=()=>{try{const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/png'));}catch(e){res(null);}};
      img.onerror=()=>res(null);
      img.src=svgUrl;
    }catch(e){res(null);}
  });
}
async function bakeTextures(){
  try{
    const probe=document.querySelector('.paper');if(!probe)return;
    const bg=getComputedStyle(probe,'::before').backgroundImage||'';
    const m=bg.match(/url\(\s*"([^"]+)"\s*\)/)||bg.match(/url\(\s*'([^']+)'\s*\)/)||bg.match(/url\(\s*([^)]+?)\s*\)/);
    const url=m&&m[1];
    if(!url||url.indexOf('data:image/svg')!==0)return;
    const png=await rasterizeTexture(url,240,240);
    if(png){const s=document.createElement('style');
      s.textContent='.paper::before{background-image:url("'+png+'")}';document.head.appendChild(s);}
  }catch(e){}
}

/* ----------------------------------------------------------------- boot */
(async function(){
  await connect();
  if(!MOCK)preIntro();               /* the painted closed cover on screen IMMEDIATELY */
  /* Load the portfolio and render the real book. The cover will NOT open until
     the pages exist beneath it (openTome's _bookReady gate), so opening always
     reveals the real spread - never brown leather, never a pop-in. */
  try{
    S.settings=await api.get_settings();applyMood();
    S.sig=await api.signature();S.lib=await api.library();   /* sig FIRST, like refreshLibrary: a change landing between the two awaits then differs on the next poll instead of being silently skipped */
  }catch(e){S.lib={games:[]};S.sig='';}   /* a sig without its blob would tell every poll there is nothing to fetch */
  const st0=await api.state().catch(()=>null);if(st0){S.hasWebhook=st0.webhook;}
  await idbHydrate();                       /* load the persisted thumbnails so the first render shows them instantly (no black) */
  initMediaToggle();                       /* restore the videos/clips filter before the first build */
  buildSpreads();renderSpread(0);
  _bookReady=true;                   /* the real pages now exist under the cover */
  setTimeout(prewarmTurn,120);       /* warm while the LORE cover is showing, before the first page turn */
  {const m=location.hash.match(/(?:[#&,])s(\d+)/);if(m)renderSpread(+m[1]);}  /* deep-link to a spread (dev/testing) */
  startDust();fpsMeter();wireInput();wireViewer();
  bakeTextures();                    /* upgrade the paper grain to a cheap raster tile */
  pollState();pollLibrary();
  try{const ws=await api.window_state();$('#btn-max').textContent=(ws&&ws.maximized)?'❐':'▢';}catch(e){}
  try{playIntro();}catch(e){
    document.body.classList.remove('intro');
    const iv=$('#intro');if(iv)try{iv.remove();}catch(_){}
    sendShape();try{api.first_paint&&api.first_paint();}catch(_){}
  }
  if(MOCK&&!location.hash.includes('introhold')){
    document.body.classList.remove('intro');const iv=$('#intro');if(iv)iv.remove();
    sendShape();whisper('mock library — the recorder is not attached');}
})();
</script>
