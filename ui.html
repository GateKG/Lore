/* the cover: real leather, dead flat. the domed macro-light + edge vignette
   pooled brightness exactly around the capped book - the halo he ripped out
   twice - so the hide is texture only, even across every row */
#cover{ background:var(--leathertex); background-size:360px 360px; background-color:#2a1c11; }
#cover::after{ content:none; }
/* pages (and the flying leaves): real cream paper fibre over the paper gradient */
.paper::before{ background-image:var(--paper-tex),var(--paper-tex);
  background-size:300px 300px, 141px 141px; background-repeat:repeat;
  background-blend-mode:multiply; opacity:.8; }   /* same tile twice - macro + micro fibre, no new bytes */
/* the recessed bookmark plates wear the same hide, darkened into the dip */
.itab{ background:linear-gradient(180deg, rgba(6,3,1,.44), rgba(12,8,5,.22) 55%, rgba(6,3,1,.36)), var(--leathertex);
  background-size:auto, 210px; background-blend-mode:multiply,normal; }
.itab:hover{ background:linear-gradient(180deg, rgba(4,2,1,.40), rgba(12,8,5,.22) 55%, rgba(4,2,1,.34)), var(--leathertex);
  background-size:auto, 210px; background-blend-mode:multiply,normal; }
.itab.active{ background:linear-gradient(180deg, rgba(2,1,0,.52), rgba(10,6,4,.32) 55%, rgba(2,1,0,.42)), var(--leathertex);
  background-size:auto, 210px; background-blend-mode:multiply,normal; }
/* the desk is gone (the intro card is full leather) - no walnut left to dress */
/* the intro closed-cover face: EXACTLY the app cover's leather (texture only,
   no private lighting) - any extra layer shifts the hide during the crossfade */
.icoverface{ background:var(--leathertex); background-size:360px 360px; background-color:#2a1c11; }
.icoverface::after{ content:none; }
</style>
</head>
<body data-mood="midnight" class="intro">

<div id="cover"></div>
<div class="filig tl"></div><div class="filig tr"></div>
<div class="filig bl"></div><div class="filig br"></div>

<div id="gametabs" class="tabcol"></div>
<div id="apptabs" class="tabcol"></div>

<div id="toprim">
  <div id="brand"><span>LORE</span></div>
</div>
<div id="winbtns">
  <!-- tabindex=-1: these are the FIRST focusable elements in the page, and
       WebView2 hands them the initial focus on boot - the minimize button
       wore a phantom "Minimize" highlight on every start. Mouse-only. -->
  <button id="btn-min" tabindex="-1" title="Minimize">–</button>
  <button id="btn-max" tabindex="-1" title="Maximize / restore">▢</button>
  <button id="btn-close" tabindex="-1" title="Rest in the tray">✕</button>
</div>

<div id="pages">
  <div class="stack left"></div><div class="stack right"></div>
  <div class="seamfill"></div>
  <div id="pageL" class="page left paper side-l"><div class="page-inner" id="contentL"></div></div>
  <div id="pageR" class="page right paper side-r"><div class="page-inner" id="contentR"></div></div>
  <div id="spine"></div>
  <div id="leafshadow"></div>
  <div id="leaf">
    <div class="leaf-face front paper side-r"><div class="page-inner" id="leafF"></div><div class="leaf-curl"></div></div>
    <div class="leaf-face back paper side-l"><div class="page-inner" id="leafB"></div><div class="leaf-curl"></div></div>
    <div class="leaf-shade"></div><div class="leaf-glow"></div>
  </div>
  <!-- no title= on these: they sit over the closed cover too, and the native
       tooltip popped a white "Previous page" bubble on the intro screen -->
  <div class="corner l" id="cornerL"></div>
  <div class="corner r" id="cornerR"></div>
</div>
<canvas id="dust"></canvas>

<!-- no title= here either: these sit over the closed cover, and the native
     tooltip is what put a white "Previous page" bubble on the intro -->
<button class="pagenav" id="navPrev">‹</button>
<button class="pagenav" id="navNext">›</button>

<div id="apron">
  <div id="mediatoggle"></div>
  <div id="seal" data-state="watching" title="Begin recording"></div>
  <div id="sealinfo">
    <div id="stateword">WATCHING</div>
    <div id="timer">·</div>
    <div id="statesub" title="See everything the tome is doing">the tome lies open</div>
  </div>
  <div id="apronspacer"></div>
  <div id="sealbtns"></div>
</div>

<div id="inkmark">✒ <span>inscribed</span></div>
<div id="whisper"></div>
<div id="modal"></div>

<!-- resize grip: a TOP-LEVEL element (NOT inside #apron) so its z-index actually
     ranks against #viewer. Nested in #apron (z-index:35) it was trapped in that
     stacking context and painted UNDER the z-index:90 player backdrop. -->
<div id="grip" title="Resize the tome"><svg viewBox="0 0 24 24" fill="none">
  <path d="M20 10 L10 20 M20 15 L15 20 M20 20 L19.5 20" stroke="#c9a05e" stroke-width="1.8" stroke-linecap="round"/>
</svg></div>

<!-- player window-mover: shown only in cinema (CSS). a body-level sibling of
     #viewer like #grip, so its z-index truly ranks against the z:90 backdrop -->
<div id="dragpill" title="Move the window"></div>

<div id="viewer">
  <div id="vtitle"></div>
  <!-- what was said: the transcript as a readable column beside the video.
       Click any line and the video goes there. -->
  <div id="vsaid">
    <div class="vsaidhead"><span>What was said</span><button id="vsaidx" title="Close">✕</button></div>
    <div class="vsaidbody"></div>
  </div>
  <div id="vstage">
    <video id="vvideo" preload="metadata"></video>
    <div class="vring"></div>
    <div class="vcorner vc-tl"></div><div class="vcorner vc-tr"></div>
    <div class="vcorner vc-bl"></div><div class="vcorner vc-br"></div>
  </div>
  <!-- the scrub preview. A SECOND video seeking alongside, not a frame
       pulled from disk: grabbing one frame of this footage costs ~1.8s
       (measured), which is useless under a moving pointer, while a seek to
       one of the 4-second keyframes these recordings carry is quick. -->
  <div id="vpeek"><video id="vpeekv" muted preload="metadata"></video><div id="vpeekt">0:00</div></div>
  <div id="vbar">
    <button class="vbtn" id="vplay" title="Play / pause">▮▮</button>
    <div id="vseekcol">
      <div id="vover" title="The whole recording - click to jump, drag the lit box"><div id="voverwin"></div><div id="voverhead"></div></div>
      <canvas id="vlvl" height="34"></canvas>
      <div id="vseekwrap">
        <input type="range" id="vseek" min="0" max="1000" value="0">
        <div id="vsegs"></div>
      </div>
    </div>
    <div id="vtime" title="Click to type an exact time">0:00 / 0:00</div>
    <select id="vzoom" title="How much of the recording the bar shows">
      <option value="0">whole</option>
      <option value="1800">30 min</option>
      <option value="600">10 min</option>
      <option value="120">2 min</option>
      <option value="30">30 sec</option>
    </select>
    <button class="vbtn" id="vhere" title="Anchor the timeline here - the window starts at the frame you are on">&#8676;</button>
    <input type="range" id="vvol" min="0" max="100" value="80" title="Volume">
    <button class="vbtn" id="vfs" title="Fullscreen (whole screen)">⛶</button>
    <button class="vbtn" id="vmore" title="Everything else">⋯</button>
    <!-- the rest live in the bubble: a player wants a picture and a
         timeline, not a row of eight glyphs competing with them -->
    <div id="vmenu">
      <button class="vbtn" id="vtrim" title="Edit — keep, cut out or silence pieces">✂<span>Edit</span></button>
      <button class="vbtn" id="vsound" title="Show the sound levels along the timeline">◠<span>Sound</span></button>
      <button class="vbtn" id="vsay" title="What was said — click any line to jump there">❝<span>Words</span></button>
      <button class="vbtn" id="vnow" title="Read and listen to THIS one next, ahead of the queue">⚡<span>Do this one now</span></button>
      <button class="vbtn" id="vnext" title="Next video">⏭<span>Next</span></button>
      <button class="vbtn" id="vfolder" title="Open this game's folder">📁<span>Folder</span></button>
      <button class="vbtn" id="vdel" title="Delete this video">🗑<span>Delete</span></button>
      <button class="vbtn" id="vext" title="Open with your video player">⧉<span>Open in player</span></button>
    </div>
  </div>
  <div id="vedrow">
    <div class="edmode">
      <button id="vedkeep" class="on" title="The pieces you mark are what you KEEP; everything else is dropped">✓ Keep marked</button>
      <button id="vedcut" title="The pieces you mark are CUT OUT; the rest is kept and stitched">✂ Remove marked</button>
    </div>
    <div class="edmode" id="vedlayers">
      <button id="vedlcut" class="on" title="Mark what to keep or cut">✂ Cutting</button>
      <button id="vedlmute" title="Mark stretches to SILENCE — they stay in the video, they just lose their sound">🔇 Silencing</button>
    </div>
    <div class="sep"></div>

<script>

/* ---------------------------------------------------------------- utils */
function fmtWhen(ts){const d=new Date(ts*1000);
  const mo=['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()];
  let h=d.getHours()%12||12;const ap=d.getHours()<12?'AM':'PM';
  const m=String(d.getMinutes()).padStart(2,'0');
  return `${String(d.getDate()).padStart(2,'0')} ${mo} ${d.getFullYear()} · ${h}:${m} ${ap}`;}
function fmtDur(s){if(s==null)return null;s=Math.round(s);
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`:`${m}:${String(ss).padStart(2,'0')}`;}
function fmtSize(b){return b>=1e9?(b/1e9).toFixed(1)+' GB':Math.max(1,Math.round(b/1e6))+' MB';}
function fmtClock(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`
          :`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;}
function roman(n){const T=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],
  [50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let out='';
  for(const[v,s]of T){while(n>=v){out+=s;n-=v;}}return out||'I';}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function sigilSVG(key,hue,big){
  const rnd=mulberry(hashStr(key));
  const C=hue.c, cx=60,cy=60;
  let s=`<svg viewBox="0 0 120 120" fill="none">`;
  s+=`<circle cx="60" cy="60" r="52" stroke="${C}" stroke-width="1.6" opacity=".8"/>`;
  const g1=[];const ticks=8+Math.floor(rnd()*8);
  for(let i=0;i<ticks;i++){const a=i/ticks*Math.PI*2;
    g1.push(`<line x1="${cx+Math.cos(a)*49}" y1="${cy+Math.sin(a)*49}" x2="${cx+Math.cos(a)*44}" y2="${cy+Math.sin(a)*44}" stroke="${C}" stroke-width="1.7" opacity=".85"/>`);}
  const dots=3+Math.floor(rnd()*4);
  for(let i=0;i<dots;i++){const a=rnd()*Math.PI*2;
    g1.push(`<circle cx="${cx+Math.cos(a)*52}" cy="${cy+Math.sin(a)*52}" r="2" fill="${C}" opacity=".85"/>`);}
  s+=`<g class="sg-outer">${g1.join('')}</g>`;
  const sides=3+Math.floor(rnd()*4);const off=rnd()*Math.PI*2;const r2=34;
  const pts=[];for(let i=0;i<sides;i++){const a=off+i/sides*Math.PI*2;
    pts.push(`${(cx+Math.cos(a)*r2).toFixed(1)},${(cy+Math.sin(a)*r2).toFixed(1)}`);}
  s+=`<polygon points="${pts.join(' ')}" stroke="${C}" stroke-width="1.5" opacity=".8"/>`;
  if(rnd()>.45){const pts2=[];for(let i=0;i<sides;i++){const a=off+(i+.5)/sides*Math.PI*2;
    pts2.push(`${(cx+Math.cos(a)*r2).toFixed(1)},${(cy+Math.sin(a)*r2).toFixed(1)}`);}
    s+=`<polygon points="${pts2.join(' ')}" stroke="${C}" stroke-width=".8" opacity=".4"/>`;}
  s+=`<circle cx="60" cy="60" r="${10+rnd()*7}" stroke="${C}" stroke-width="1.6" opacity=".95"/>`;
  const strokes=2+Math.floor(rnd()*3);
  for(let i=0;i<strokes;i++){const a=rnd()*Math.PI*2,l=5+rnd()*8;
    s+=`<line x1="${cx+Math.cos(a)*3}" y1="${cy+Math.sin(a)*3}" x2="${cx+Math.cos(a)*l}" y2="${cy+Math.sin(a)*l}" stroke="${C}" stroke-width="1.4" opacity=".9" stroke-linecap="round"/>`;}
  s+=`<circle cx="60" cy="60" r="2.2" fill="${C}"/>`;
  if(big)s+=`<circle cx="60" cy="60" r="56" stroke="${C}" stroke-width=".5" opacity=".25"/>`;
  s+=`</svg>`;return s;}
$('#introsigil').innerHTML=sigilSVG('lore-itself',{c:'#c9a05e',g:''},true);

function sealSVG(){

    rn+=`<g transform="translate(${x} ${y}) rotate(${a*180/Math.PI+90})">
      <path d="M-3 3 L0 -4 L3 3 M-2 .5 H2" stroke="var(--sc)" stroke-width="1.1" fill="none" opacity=".8"/></g>`;}

function spawnSparks(x,y,n,color){

/* v1.2.4: the book fills the whole window - no more window silhouette.
   wing() still measures the leather margin the pages/ribbons live in;
   sendShape() remains as a one-time "clear any old region" nudge. */
function wing(){
  /* base leather margin - but a book has a shape. past spreadMax() the open
     spread stops growing and the wings drink the excess, so a 32:9 monitor
     gets more leather, not paper the size of a door. */
  const base=Math.min(210,Math.max(120,innerWidth*0.085));   /* MIRROR of the CSS --wing clamp(120px,8.5vw,210px) - the old 104..132 clamp disagreed with what CSS painted, so perPage counted a page 156px wider than the paper on screen */
  return Math.max(base,(innerWidth-spreadMax())/2-24);
}
/* the widest the open spread may ever be. 1.95x the page-area height is the
   narrowest cap that still seats three ~340px card columns on a 1440-tall
   screen; 2560x1440 lands under it, so nothing changes there. */
function spreadMax(){return (innerHeight-58-60)*1.95;}   /* 58+60 = the REAL --rimT/--rimB the pages hang off; the old 44+64 counted a page 10px taller than CSS paints */
/* ONE answer to "how many card columns": three only once each of the three
   would still get a ~340px card, else the classic two. perPage() counts with
   this and pushes it into --vcols for the .vgrid template, so the promised
   count always matches the painted one. */
function gridCols(innerW){return innerW>=3*320+2*16?3:2;}   /* 320 not 340: at MAXIMIZED ultrawide (taskbar showing, ~1400px tall) the capped page lands a hair under the old 1052px threshold and wrongly stayed 2-col */
/* hand the capped geometry to the CSS the book is drawn with. pages, deckle
   stacks, tab columns, corners and folios all hang off --wing, so they move
   as one book instead of detaching at silly aspect ratios. uncapped windows
   get the inline override REMOVED so the stylesheet clamp tracks live. */
function fitBook(){
  const cssBase=Math.min(210,Math.max(120,innerWidth*0.085));   /* mirror of the --wing clamp */
  const need=(innerWidth-spreadMax())/2-24;
  const rs=document.documentElement.style;
  if(need>cssBase)rs.setProperty('--wing',need.toFixed(1)+'px');
  else rs.removeProperty('--wing');
}

}

/* ================================================================ bridge */

    const poll=setInterval(()=>{if(!done&&window.pywebview&&window.pywebview.api){
      done=true;clearInterval(poll);api=window.pywebview.api;res();}},150);
  }else{
    setTimeout(()=>{if(!done&&window.pywebview&&window.pywebview.api){done=true;api=window.pywebview.api;res();}
      else if(!done){done=true;MOCK=true;api=makeMock();res();}},1100);
  }});}

function makeMock(){
  const now=Date.now()/1000;
  function mkThumb(seed){const c=document.createElement('canvas');c.width=320;c.height=180;
    const x=c.getContext('2d');const r=mulberry(seed);
    const g=x.createLinearGradient(0,0,320,180);
    const h1=Math.floor(r()*360),h2=(h1+40+r()*80)|0;
    g.addColorStop(0,`hsl(${h1} 45% ${18+r()*20}%)`);g.addColorStop(1,`hsl(${h2} 55% ${10+r()*14}%)`);
    x.fillStyle=g;x.fillRect(0,0,320,180);
    for(let i=0;i<26;i++){x.fillStyle=`hsla(${(h1+r()*120)|0} 70% ${40+r()*40}% / ${.05+r()*.2})`;
      const w=10+r()*90,h=4+r()*40;x.fillRect(r()*320,r()*180,w,h);}
    return c.toDataURL('image/jpeg',.7);}
  let games=[['Elden Ring',9,4],['Rocket League',7,5],['Hades II',5,2],
    ['Trackmania',4,1],['The Witcher 3',2,1],['Stardew Valley',1,0]];
  if(location.hash.includes('many30')){
    games=[];const NAMES=['Elden Ring','Rocket League','Hades II','Trackmania','The Witcher 3',
      'Stardew Valley','Hearthstone','Baldur\\u2019s Gate 3','Cyberpunk 2077','Doom Eternal',
      'Celeste','Hollow Knight','Silksong','Balatro','Vampire Survivors','Deep Rock Galactic',
      'Helldivers 2','Palworld','Valheim','Terraria','Factorio','Satisfactory','Dyson Sphere Program',
      'Slay the Spire','Dead Cells','Risk of Rain 2','Monster Hunter Wilds','Sekiro','Armored Core VI','Nioh 2'];
    NAMES.forEach((n,i)=>games.push([n,Math.max(1,12-Math.floor(i/2)),i%4]));
  }
  const lib={games:games.map(([n,ns,nc],gi)=>{
    const key=n.toLowerCase();const mk=(k,i)=>({path:`C:/mock/${n}_${k}_${i}.mp4`,
      mtime:now-(gi*3+i)*86400-i*4000,size:(k==='session'?2.6e9:2.4e8)*(1+i*.2),kind:k,
      badge:(gi===0&&i===0&&k==='session')?{text:'Restoring true colour — 43%',phase:'conv'}:null});
    return {key,name:n,display:n,
      sessions:Array.from({length:ns},(_,i)=>mk('session',i)),
      clips:Array.from({length:nc},(_,i)=>mk('clip',i)),
      count:ns+nc,latest:now-gi*86400};}),out_dir:'C:/mock'};
  let st={status:'watching',t0:0};
  return {
    state:async()=>{
      /* converting/binding are null MOST of the time, like the real app - a mock
         that is always 'busy' hides the idle compositing path from every preview
         session. open with #conv to force the busy badge, #bind to force a live
         bind card (pct cycles so the bar, the eta and the MB/s lines all render). */
      const bind=location.hash.includes('bind')
        ?{name:'Elden Ring_session_3.mp4',pct:Math.floor(Date.now()/400)%100,
          eta:34,mbps:184}:null;
      return {status:bind?'saving':st.status,game:st.status==='recording'?'Elden Ring':'',
      elapsed:st.status==='recording'?Math.floor(Date.now()/1000-st.t0):0,
      saving:!!bind,
      binding:bind,
      converting:location.hash.includes('conv')?{name:`Elden Ring_session_0.mp4`,pct:43}:null,
      queued:location.hash.includes('conv')?1:0,
      encoder:'AV1',fps:60,hdr:true,free_gb:412,size_mb:st.status==='recording'?880:null,
      webhook:true,version:'2.24'};},
    signature:async()=>'mock',
    library:async()=>lib,
    thumb:async(p)=>mkThumb(hashStr(p)),
    thumbs:async(ps)=>Object.fromEntries((ps||[]).map(p=>[p,mkThumb(hashStr(p))])),
    meta:async(ps)=>Object.fromEntries(ps.map(p=>[p,p.includes('clip')?58:1930])),
    record_toggle:async()=>{if(st.status==='recording')st.status='watching';
      else{st.status='recording';st.t0=Date.now()/1000;}return true;},
    pause_toggle:async()=>{st.status=st.status==='paused'?'recording':'paused';return true;},
    clip:async()=>true, clip_discord:async()=>true,
    open_video:async()=>true,reveal:async()=>true,open_game_folder:async()=>true,
    prioritise:async()=>({ok:true,stt:true,hl:true}),
    levels:async()=>({dur:600,floor:-48,peak:-6,
      db:Array.from({length:1800},(_,i)=>-46+22*Math.abs(Math.sin(i/37))+(i%211<6?16:0))}),
    search_words:async()=>[],highlights:async()=>[],

/* ---- PERSISTENT thumbnail cache (IndexedDB) so thumbnails survive an app close ----
   In-memory S.thumbs was lost on quit, so every launch re-read + re-decoded every
   thumbnail from disk = the "black then it loads" flash. We mirror thumbs into
   IndexedDB (large, unlike localStorage) and hydrate it at boot, so a thumbnail you've
   already seen shows INSTANTLY on the next launch. Keyed by path; the source mtime
   rides along so a re-encoded/edited file's stale thumb is refreshed. Degrades to the
   old on-demand path if IndexedDB is unavailable. */
const _tmeta=new Map();          /* path -> mtime of the cached thumb's source */
let _idb=null,_idbReady=null;
function idbOpen(){
  if(_idbReady)return _idbReady;
  _idbReady=new Promise(res=>{
    try{
      if(!window.indexedDB){res(null);return;}
      const rq=indexedDB.open('lore-thumbs',1);
      rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('t');}catch(e){}};
      rq.onsuccess=()=>{_idb=rq.result;res(_idb);};
      rq.onerror=()=>res(null); rq.onblocked=()=>res(null);
    }catch(e){res(null);}
  });
  return _idbReady;
}
/* a thumb is only a thumb if it can actually paint: a real data-URI with a
   plausible payload behind the comma. a wounded backend once returned
   'data:image/jpeg;base64,' with NOTHING after it - truthy, so it was shown,
   cached, persisted, and every launch since wore the torn-page glyph. */
function thumbOK(u){return typeof u==='string'&&u.startsWith('data:image/')&&u.length>256;}
async function idbHydrate(){
  try{
    const db=await idbOpen(); if(!db)return 0;
    const bad=[];
    const n=await new Promise(res=>{
      let k=0;
      const tx=db.transaction('t','readonly'),cur=tx.objectStore('t').openCursor();
      cur.onsuccess=e=>{const c=e.target.result;
        if(c){const v=c.value;
          if(k>=3000){bad.push(c.key);}    /* the in-memory cap is 3000 - a bloated store must not smuggle its whole corpus past it at boot; trim the excess rows too */
          else if(v&&thumbOK(v.u)){S.thumbs.set(c.key,v.u);_tmeta.set(c.key,v.m||0);k++;
            if(v.d!=null&&S.meta[c.key]==null)S.meta[c.key]=v.d;}   /* durations ride along: the '…'->2:00 swap after a landing was the "text shifts" he kept seeing */
          else bad.push(c.key);            /* poisoned entry -> purge, so it re-requests */
          c.continue();}
        else res(k);};
      cur.onerror=()=>res(k);
    });
    if(bad.length){try{const st=db.transaction('t','readwrite').objectStore('t');bad.forEach(k=>st.delete(k));}catch(e){}}
    return n;
  }catch(e){return 0;}
}
function idbPut(path,url,mtime){
  if(!thumbOK(url))return;                 /* never persist a glyph-maker */
  try{ idbOpen().then(db=>{ if(!db)return;
    db.transaction('t','readwrite').objectStore('t')
      .put({u:url,m:mtime||0,d:(S.meta&&S.meta[path]!=null)?S.meta[path]:null},path);
  }); }catch(e){}
}
/* stamp a late-arriving duration onto the persisted thumb record, so the NEXT
   session renders 2:00 immediately instead of '…' that swaps a beat later */
function idbSetDur(path,d){
  try{ idbOpen().then(db=>{ if(!db)return;
    const st=db.transaction('t','readwrite').objectStore('t');
    const rq=st.get(path);
    rq.onsuccess=()=>{const v=rq.result;if(v&&v.d!==d){v.d=d;try{st.put(v,path);}catch(e){}}};
  }); }catch(e){}
}
function idbDel(path){
  try{ idbOpen().then(db=>{ if(!db)return;
    db.transaction('t','readwrite').objectStore('t').delete(path);
  }); }catch(e){}
}

function perPage(){
  fitBook();   /* geometry first: the drawn book must wear the same cap we count with */
  const pagesW=innerWidth-2*(wing()+24), pagesH=innerHeight-58-60;   /* wing() already ate the ultrawide excess; 58+60 mirrors --rimT/--rimB exactly */
  const pageW=pagesW*0.492;
  const innerW=pageW*0.83;
  const cols=gridCols(innerW);
  document.documentElement.style.setProperty('--vcols',cols);   /* .vgrid reads THIS - promised count = painted count */
  const colW=(innerW-16*(cols-1))/cols;
  const rowH=colW*9/16+40+14;   /* +40 = the TWO-row meta (date row + duration/size row), not the old 26 - undercounting this clipped the bottom row */
  const bodyH=pagesH*0.83-100;   /* MEASURED real page-body height; the old 0.90-88 overshot ~70px so the last row clipped */
  const rows=Math.max(1,Math.min(5,Math.floor((bodyH+14)/rowH)));   /* size-aware: up to 5 rows on a tall window, not hard-capped at 3 */
  return rows*cols;
}

/* which media a game contributes under the current filter, and in what order.
   'all' = clips FIRST then sessions (so a chapter opens on its highlights and
   the full videos follow); 'videos'/'clips' = just that kind. */
function mediaItems(g){
  const f=S.media||'all';
  if(f==='videos')return g.sessions;
  if(f==='clips')return g.clips;
  return g.clips.concat(g.sessions);
}
/* the order of chapters in the book + the contents list: by how many recordings
   each game holds (default) or alphabetically. Persisted. */
function sortedGames(){
  const mode=S.gameSort||'count';
  const arr=((S.lib&&S.lib.games)||[]).slice();
  if(mode==='az')arr.sort((a,b)=>(a.display||'').localeCompare(b.display||'',undefined,{sensitivity:'base'}));
  else if(mode==='za')arr.sort((a,b)=>(b.display||'').localeCompare(a.display||'',undefined,{sensitivity:'base'}));
  else if(mode==='fewest')arr.sort((a,b)=>(a.count-b.count)||(b.latest-a.latest));
  else if(mode==='newest')arr.sort((a,b)=>(b.latest-a.latest));   /* most recently played first */
  else if(mode==='oldest')arr.sort((a,b)=>(a.latest-b.latest));
  else arr.sort((a,b)=>(b.count-a.count)||(b.latest-a.latest));   /* 'count' = most first */
  return arr;
}
function setGameSort(mode){
  if(S.gameSort===mode)return;
  S.gameSort=mode; try{localStorage.setItem('lore.gamesort',mode);}catch(e){}
  if(S.turning||flight.length)settleFlightNow();   /* a sheet landing into a REBUILT spread array paints stale content - settle first, like the resize path */
  const curKey=(S.chapterOf&&S.chapterOf[S.idx])||'';
  buildSpreads();
  let idx=curKey?S.chapterOf.indexOf(curKey):-1;
  if(idx<0)idx=0;                                 /* order changed - jump to contents/first */
  renderSpread(clamp(idx,0,Math.max(0,S.spreads.length-1)));
}

function buildSpreads(){
  const PER_PAGE=perPage();
  const spreads=[];const chapterOf=[];
  if(!S.gameSort){try{S.gameSort=localStorage.getItem('lore.gamesort')||'count';}catch(e){S.gameSort='count';}}
  const games=sortedGames();
  if(!games.length){
    spreads.push({type:'front'});chapterOf.push('contents');
  }else{
    spreads.push({type:'contents'});chapterOf.push('contents');
    games.forEach((g,gi)=>{
      const hue=hueOf(g.key);
      const items=mediaItems(g);
      if(!items.length)return;                 /* nothing in this view -> skip the game */
      const perSpread=PER_PAGE*2;              /* a spread is two pages; items flow L then R */
      const pagesN=Math.max(1,Math.ceil(items.length/perSpread));
      for(let k=0;k<pagesN;k++){
        const chunk=items.slice(k*perSpread,(k+1)*perSpread);
        spreads.push({type:'chapter',game:g,hue,gi,k,pagesN,
          lItems:chunk.slice(0,PER_PAGE),
          rItems:chunk.slice(PER_PAGE)});
        chapterOf.push(g.key);
      }
    });
  }
  APPENDIX.forEach((a,ai)=>{spreads.push({type:'set',app:a,ai});chapterOf.push('set:'+a.key);});
  S.spreads=spreads;S.chapterOf=chapterOf;
  if(typeof invalidateSpreadCache==='function')invalidateSpreadCache();  /* indices changed */
}

async function loadThumb(path,img,mtime){
  /* cached -> show INSTANTLY (no fade). The .6s opacity fade re-ran on every page
     LANDING (renderSpread rebuilds the cards), so a thumbnail we already had would
     flash black then fade back in on each turn. 'instant' kills that fade; only a
     first-ever load still fades in. Cache is large so browsing many clips doesn't
     keep evicting + re-fetching (that was the endless spinner). */
  img.onerror=()=>{
    /* the browser refused to decode what we fed it -> never wear the torn-page
       glyph. purge the liar from every cache, fall back to 'no preview', and
       ask the backend to regenerate exactly once (not a retry storm). */
    img.removeAttribute('src');img.classList.remove('on','instant');
    S.thumbs.delete(path);_tmeta.delete(path);idbDel(path);
    const fr=img.parentElement;if(fr)fr.classList.add('noimg');
    if(!img.dataset.reforged){img.dataset.reforged='1';loadThumb(path,img,mtime);}
  };
  let cached=S.thumbs.get(path);
  if(cached&&!thumbOK(cached)){            /* poisoned survivor from an old build */
    cached=null;S.thumbs.delete(path);_tmeta.delete(path);idbDel(path);
  }
  if(cached){
    /* cheap LRU touch: re-insert so a thumb the reader is LOOKING at is never
       the insertion-oldest entry the evictor pops next */
    S.thumbs.delete(path);S.thumbs.set(path,cached);
    img.src=cached;img.classList.add('on','instant');
    if(!mtime || _tmeta.get(path)===mtime)return;   /* fresh cache hit */
    /* stale cache: keep showing it while the backend refreshes the JPG, so fast
       scrolling never flashes black just because the source mtime changed. */
  }
  try{const d=await api.thumb(path);
    if(thumbOK(d)){if(S.thumbs.size>3000){const k=S.thumbs.keys().next().value;S.thumbs.delete(k);_tmeta.delete(k);}
      S.thumbs.set(path,d);_tmeta.set(path,mtime||0);
      if(img.isConnected){const fr=img.parentElement;if(fr)fr.classList.remove('noimg');
        img.src=d;img.classList.add('on');if(cached)img.classList.add('instant');}
      idbPut(path,d,mtime);}
    else if(!cached){const fr=img.parentElement;if(fr)fr.classList.add('noimg');}}
  catch(e){if(!cached){const fr=img.parentElement;if(fr)fr.classList.add('noimg');}}
}
/* the video paths a spread will show - used to PRELOAD its thumbnails in one RPC
   before it lands, so a game doesn't 'pop' its cards a second after you open it */
function spreadPaths(idx){
  const sp=S.spreads&&S.spreads[idx]; if(!sp)return [];
  if(sp.type==='chapter')return [...(sp.lItems||[]),...(sp.rItems||[])].map(v=>v.path).filter(Boolean);
  return [];
}
const _preloadInFlight=new Set();
async function preloadThumbs(idx){
  if(!api.thumbs)return;
  const sp=S.spreads&&S.spreads[idx];
  const items=(sp&&sp.type==='chapter')?[...(sp.lItems||[]),...(sp.rItems||[])]:[];
  const mt={}; items.forEach(v=>{if(v&&v.path)mt[v.path]=v.mtime;});
  const paths=Object.keys(mt).filter(p=>{const c=S.thumbs.get(p);return !(c&&_tmeta.get(p)===mt[p]);});
  if(!paths.length||_preloadInFlight.has(idx))return;
  _preloadInFlight.add(idx);
  try{
    const m=await api.thumbs(paths);
    if(m){
      for(const p in m){ if(!thumbOK(m[p]))continue;   /* an empty data-URI is not a thumb; don't cache the glyph */
        if(S.thumbs.size>3000){const k=S.thumbs.keys().next().value;S.thumbs.delete(k);_tmeta.delete(k);}
        S.thumbs.set(p,m[p]); _tmeta.set(p,mt[p]||0); idbPut(p,m[p],mt[p]);
        try{const im=new Image();im.src=m[p];im.decode().catch(()=>{});_decoded.add(p);}catch(e){}   /* warm the decode NOW, off the main thread */
        if(S.turning||flight.length)continue;   /* airborne: cache only - live img.src writes decode-paint under a flying leaf */
        document.querySelectorAll('.proj[data-path]').forEach(card=>{
          if(card.dataset.path===p){const img=card.querySelector('.proj-frame img');
            if(img&&!img.classList.contains('on')){img.src=m[p];img.classList.add('on','instant');
              const fr=img.parentElement;if(fr)fr.classList.remove('noimg');   /* a card that once failed must not wear 'no preview' OVER its recovered thumb */ }}
        });
      }
    }
  }catch(e){}finally{_preloadInFlight.delete(idx);}
}
/* decode-settle a spread's thumbnails BEFORE any sheet carries them: the flight
   faces paint these exact data-URIs, and a JPEG that first decodes while a leaf
   is mid-arc is precisely the "page in five positions" stutter. img.decode()
   does the work off the main thread and fills the decoded-image cache. */
const _decoded=new Set();
async function decodeSpread(idx){
  const jobs=[];
  for(const p of spreadPaths(idx)){
    if(_decoded.has(p))continue;
    const d=S.thumbs&&S.thumbs.get(p);if(!d)continue;
    if(_decoded.size>3000)_decoded.clear();
    _decoded.add(p);
    const im=new Image();im.src=d;
    jobs.push(im.decode().catch(()=>{}));
  }
  if(jobs.length)await Promise.all(jobs);
}

  const dur=(v.dur!=null)?v.dur:S.meta[v.path];if(dur!=null)S.meta[v.path]=dur;
  meta2.append(el('span','p-len',dur!=null?esc(fmtDur(dur)):'…'),
    el('span','p-dot','·'),el('span','p-size',esc(fmtSize(v.size))));
  p.append(meta,meta2);

  if(SEL.has(v.path)){p.classList.add('selected');const sb=p.querySelector('.selbtn');if(sb){sb.textContent='✓';sb.setAttribute('aria-pressed','true');}}
  loadThumb(v.path,img,v.mtime);

}

/* ---- multi-select: pick several clips, then batch send / burn together ---- */
const SEL=new Map();
function toggleSel(v,cardEl){
  const on=!SEL.has(v.path);
  if(on)SEL.set(v.path,v);else SEL.delete(v.path);
  if(cardEl){cardEl.classList.toggle('selected',on);
    const b=cardEl.querySelector('.selbtn');if(b){b.textContent=on?'✓':'▢';b.setAttribute('aria-pressed',on?'true':'false');}}
  renderSelBar();
}
function selClear(){SEL.clear();
  document.querySelectorAll('.proj.selected').forEach(p=>{
    p.classList.remove('selected');
    const b=p.querySelector('.selbtn');if(b){b.textContent='▢';b.setAttribute('aria-pressed','false');}
  });
  renderSelBar();}
function renderSelBar(){
  let bar=$('#selbar');
  if(!SEL.size){if(bar)bar.remove();return;}
  if(!bar){bar=el('div');bar.id='selbar';document.body.appendChild(bar);}
  bar.innerHTML='';const n=SEL.size;
  bar.append(el('span','selcount',n+' selected'));
  /* "Send all" was the same promise multiplied - dropped for the same reason */
  const d=el('button','selact danger','🕮 Burn all');let armed=false,armT=null;
  d.addEventListener('click',()=>{
    if(!armed){armed=true;d.textContent='Burn '+n+' — tap again';
      /* the confirmation DECAYS, like #vdel's: a button left armed for minutes
         must not one-tap mass-delete when the reader wanders back */
      armT=setTimeout(()=>{armed=false;d.textContent='🕮 Burn all';},2600);return;}
    clearTimeout(armT);
    const items=[...SEL.values()];
    const cards=[...document.querySelectorAll('.proj.selected')];
    selClear();
    (async()=>{let ok=0;const fails={};const tot=items.length;delProg(true,'burning 0 of '+tot+'…',0);
      for(let i=0;i<items.length;i++){
        const card=cards.find(c=>c.dataset.path===items[i].path);if(card)card.classList.add('deleting');
        delProg(true,'burning '+(i+1)+' of '+tot+'…',Math.round(i/tot*100));
        try{const r=await api.delete_video(items[i].path);
          if(r&&r.ok){ok++;
            try{S.thumbs.delete(items[i].path);_tmeta.delete(items[i].path);idbDel(items[i].path);}catch(e){}
          }else{fails[(r&&r.why)||'locked']=(fails[(r&&r.why)||'locked']||0)+1;}
        }catch(e){fails.locked=(fails.locked||0)+1;}
        if(card)card.classList.remove('deleting');
      }
      delProg(true,'cleaning the shelf…',100);setTimeout(()=>delProg(false),650);
      const parts=[ok+' page'+(ok===1?'':'s')+' let go…'];
      const WHY={converting:'still converting',playing:'still playing',locked:'still in use'};
      for(const w in fails)parts.push(fails[w]+' '+(WHY[w]||w));   /* which survived, and why - a silent survivor reads as a bug */
      whisper(parts.join(' · '));refreshLibrary(true);})();});
  bar.append(d);
  const c=el('button','selact','Cancel');c.addEventListener('click',selClear);bar.append(c);
}

function fillMeta(scope,vids){
  vids.forEach(v=>{if(v.dur!=null&&S.meta[v.path]==null)S.meta[v.path]=v.dur;});
  const need=vids.filter(v=>S.meta[v.path]==null).map(v=>v.path);
  if(!need.length)return;
  api.meta(need).then(m=>{Object.assign(S.meta,m||{});
    for(const p in (m||{}))if(m[p]!=null)idbSetDur(p,m[p]);   /* persist: the swap happens once EVER per video, not once per session */
    scope.querySelectorAll('.proj').forEach(p=>{const d=S.meta[p.dataset.path];
      if(d!=null){const le=p.querySelector('.p-len');if(le)le.textContent=fmtDur(d);}});});
}

/* ---------------- the contents spread ---------------- */
function recentVids(n){
  const out=[];
  for(const g of (S.lib.games||[]))
    for(const v of mediaItems(g))
      out.push({...v,gkey:g.key,gname:g.display});
  out.sort((a,b)=>b.mtime-a.mtime);
  return out.slice(0,n);
}

  return n?`${n} memor${n===1?'y':'ies'} · ${esc(fmtSize(b))} on the shelf`:null;

function renderContents(cL,cR,spreadIdx){
  ptitle(cL,'the tome remembers','Recently Written',{c:'#8a6f42'});

     replace the recent list while a query is live; a click opens the video
     AT that second. */
  const sw=el('input');sw.id='tsearch';sw.type='text';
  sw.placeholder='search everything ever said…';
  sw.value=S.searchQ||'';
  bl.append(sw);
  const sres=el('div','rowlist');sres.style.display='none';bl.append(sres);
  let list=null;   /* the recent-rows list; null while the library is empty */
  let _st=null;
  const runSearch=async q=>{
    S.searchQ=q;
    sres.innerHTML='';
    if(!q||q.length<2){sres.style.display='none';if(list)list.style.display='';return;}
    let hits=[];try{hits=await api.search_words(q)||[];}catch(e){}
    if(S.searchQ!==q)return;              /* stale response */
    if(list)list.style.display='none';sres.style.display='';
    if(!hits.length){sres.append(el('div','vwhen','the tome finds no such words'));return;}
    const byBase={};

      const b=String(v.path).replace(/\\/g,'/').split('/').pop().replace(/\.mp4$/i,'');
      byBase[b]={...v,gkey:g.key,gname:g.display};}));
    hits.forEach(h=>{
      const v=byBase[h.file];if(!v)return;
      const r=el('div','sresrow');
      const t=Math.max(0,h.t_ms/1000);

      const qq=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const qrow=el('div','sresq');
      qrow.innerHTML='“'+String(h.text).split(new RegExp('('+qq+')','ig'))
        .map((seg,i)=>i%2?'<b>'+esc(seg)+'</b>':esc(seg)).join('')+'”';
      r.append(qrow);

  sw.addEventListener('keydown',e=>e.stopPropagation());   /* typing must not turn pages */
  /* fill the page: one .vrow is ~47px + 7px gap, the page body is the same
     measured height perPage() trusts - so fullscreen shows 12 memories, a
     small window shows what fully fits, and nothing ever clips */
  const rowsFit=Math.floor((((innerHeight-118)*0.83-100)+7)/54);
  const rec=recentVids(Math.max(6,Math.min(12,rowsFit)));

  else{
    list=el('div','rowlist');

      const r=el('div','vrow');

      const m=el('div','vmeta');
      m.append(el('div','vname',esc(v.gname)));
      m.append(el('div','vwhen',esc(fmtWhen(v.mtime))+' · '+esc(fmtSize(v.size))));
      r.append(m);
      r.append(el('span','vtag '+(v.kind==='session'?'session':'clip'),
                  v.kind==='edit'?'EDIT':(v.kind==='clip'?'CLIP':'SESSION')));
      r.addEventListener('click',()=>openViewer(v));
      r.title='Watch in the tome';
      list.append(r);loadThumb(v.path,img,v.mtime);
    });
    bl.append(list);
    if(S.searchQ&&S.searchQ.length>=2){runSearch(S.searchQ);}
  }
  folio(cL,spreadIdx,'l','contents');

  ptitle(cR,'chapters','The Games',{c:'#8a6f42'},libTotalsSub());
  const br=pbody(cR);

    const b=el('button','gsortb'+((S.gameSort||'count')===m?' on':''),lbl);
    b.addEventListener('click',()=>setGameSort(m));

/* ---------------- a game chapter: sessions | clips ---------------- */
function renderChapter(cL,cR,sp,spreadIdx){
  const g=sp.game,hue=sp.hue;
  glyphmark(cL,g.key,hue,1+sp.k*2);glyphmark(cR,g.key,hue,2+sp.k*2);
  const suffix=sp.pagesN>1?` · ${roman(sp.k+1)}`:'';
  const lbl=items=>{const c=items.filter(v=>v.kind==='clip').length,s=items.length-c;
    return c&&s?'clips & sessions':c?'clips':'sessions';};
  /* ---- LEFT page (chapter head on k===0) ---- */
  if(sp.k===0){
    const stats=[];
    if(g.sessions.length)stats.push(`<b>${g.sessions.length}</b> session${g.sessions.length>1?'s':''}`);
    if(g.clips.length)stats.push(`<b>${g.clips.length}</b> clip${g.clips.length>1?'s':''}`);
    const total=(g.sessions.concat(g.clips)).reduce((a,v)=>a+v.size,0);
    stats.push(`<b>${esc(fmtSize(total))}</b>`);
    addRenameBtn(ptitle(cL,`chapter ${roman(sp.gi+1)} — ${lbl(sp.lItems)}`,g.display,hue,
           stats.join(' &nbsp;·&nbsp; '),g.key),g.display);
  }else{
    ptitle(cL,`chapter ${roman(sp.gi+1)} — ${lbl(sp.lItems)}${suffix}`,g.display,hue,null,null);
  }
  const bl=pbody(cL);
  if(sp.lItems.length){const grid=el('div','vgrid');
    sp.lItems.forEach((v,i)=>grid.append(renderVid(v,hue,i)));
    bl.append(grid);fillMeta(grid,sp.lItems);}
  else bl.append(emptyNote(S.media==='clips'?'clips':'sessions'));
  folio(cL,spreadIdx,'l',g.display);

  /* ---- RIGHT page: the same flow continues; empty only at a chapter's end ---- */
  if(sp.rItems.length){
    ptitle(cR,`${lbl(sp.rItems)}${suffix}`,g.display,hue);
    const brr=pbody(cR);const grid=el('div','vgrid');
    sp.rItems.forEach((v,i)=>grid.append(renderVid(v,hue,i)));
    brr.append(grid);fillMeta(grid,sp.rItems);
  }else{
    pbody(cR);   /* blank end-leaf: paper + decorative glyph + folio only */
  }
  folio(cR,spreadIdx,'r',g.display);
}

function queueSave(patch){

  clearTimeout(S.saveTimer);

    const p=S.pendingPatch;S.pendingPatch=null;
    try{const res=await api.set_settings(p);if(res)S.settings=res;inscribed();
      applyMood();}catch(e){}

}

/* EVERY labour in one place: the reader, a cut being exported, a recording
   being saved, colour being restored. Polls only while it is on screen. */
function workPlate(){
  const box=el('div','set-rows');
  box.style.cssText='display:flex;flex-direction:column;gap:2px;overflow:visible';
  const mk=()=>{
    const r=el('div','lab idle');
    const d=el('span','ldot'); const mid=el('div','lmid');
    const what=el('div','lwhat'); const name=el('div','lname');
    const bar=el('div','lbar'); const fill=el('i'); bar.append(fill);
    mid.append(what,name,bar);
    const pct=el('div','lpct'); const stop=el('button','wbtn danger','Stop');
    stop.style.display='none';
    r.append(d,mid,pct,stop);
    return {r:r,dot:d,what:what,name:name,bar:bar,fill:fill,pct:pct,stop:stop};
  };
  const rows={read:mk(),cut:mk(),save:mk(),colour:mk()};
  ['read','cut','save','colour'].forEach(k=>box.append(rows[k].r));
  const set=(o,live,what,name,pct,onStop)=>{
    o.r.classList.toggle('idle',!live);
    o.dot.classList.toggle('on',!!live);
    o.what.textContent=what; o.name.textContent=name||'';
    const has=(pct!=null&&isFinite(pct));
    o.bar.style.display=has?'':'none';
    if(has)o.fill.style.width=Math.max(0,Math.min(100,pct))+'%';
    o.pct.textContent=has?Math.round(pct)+'%':'';
    o.stop.style.display=onStop?'':'none';
    o.stop.onclick=onStop||null;
  };
  let iv=null;
  const ask=async()=>{
    let st=null,ai=null,ed=null;
    try{st=await api.state();}catch(e){}
    try{ if(api.ai_status)ai=await api.ai_status(); }catch(e){}
    try{ if(api.edit_status)ed=await api.edit_status(); }catch(e){}
    /* the reader */
    if(ai&&ai.busy)
      set(rows.read,true,(ai.busy.kind==='hl'?'Listening for loud moments':'Reading a recording')
            +(ai.forced?'  (asked for first)':''),
          String(ai.busy.name||'').replace(/\.mp4$/i,''),null,null);
    else if(ai&&ai.forced)
      set(rows.read,true,'Next up, asked for first',
          String(ai.forced).replace(/\.mp4$/i,''),null,null);
    else if(ai&&!ai.whisper)
      set(rows.read,false,'The reader is not installed','',null,null);
    else
      set(rows.read,false,'The reader rests',
          ai?((ai.why||'nothing left to read')+(ai.total?'  ·  '+(ai.stt_done||0)+' of '+ai.total+' read':'')):'',
          null,null);
    /* a cut being exported */
    if(ed&&!ed.done&&(ed.pct!=null))
      set(rows.cut,true,'Cutting your clip',(ed.name||'')+(ed.phase?'  ·  '+ed.phase:''),ed.pct,
          ()=>{ try{api.edit_cancel();}catch(e){} whisper('stopping the cut - the original is untouched'); });
    else set(rows.cut,false,'No clip being cut','',null,null);
    /* a recording being saved */
    if(st&&st.binding)
      set(rows.save,true,'Saving a recording',
          (st.binding.name||'')+(st.binding.mbps?'  ·  '+st.binding.mbps.toFixed(0)+' MB/s':'')
          +(st.binding.eta?'  ·  '+fmtT(st.binding.eta)+' left':''),
          st.binding.pct,null);
    else set(rows.save,false,'Nothing being saved','',null,null);
    /* colour restoration */
    if(st&&st.converting)
      set(rows.colour,true,'Restoring true colour',st.converting.name||'',st.converting.pct,null);
    else set(rows.colour,false,'No colour to restore',
        (st&&st.queued)?st.queued+' waiting for a quiet moment':'',null,null);
  };
  iv=setInterval(()=>{ if(!document.body.contains(box)){clearInterval(iv);return;} ask(); },1500);
  ask();
  return box;
}

/* The reader's status plate. The AI is deliberately silent - it only ever
   works while you are away - so this is the one place that says what it is
   doing, how far through the library it has read, and when it is resting,
   WHY. It polls only while it is on screen: the count behind it is a walk
   over every recording. */
function aiStatusPlate(){
  const box=el('div','aistat');
  const now=el('div','now');const dot=el('span','dot');const txt=el('span');
  txt.textContent='…';now.append(dot,txt);
  const bar=el('div','bar');const fill=el('i');bar.append(fill);
  const sub=el('div','sub','asking the tome…');
  box.append(now,bar,sub);
  const num=n=>Number(n||0).toLocaleString();
  const paint=a=>{
    if(!a)return;
    if(!a.whisper){
      dot.className='dot';bar.style.display='none';
      txt.textContent='The reader is not installed';
      sub.textContent='LORE cannot find its whisper folder, so nothing can be '
        +'transcribed or searched. Reinstalling LORE puts it back.';
      return;
    }
    if(a.busy){
      dot.className='dot work';
      txt.textContent=(a.busy.kind==='hl'?'Listening to ':'Reading ')
        +String(a.busy.name||'').replace(/\.mp4$/i,'');
    }else{
      dot.className='dot';
      const allRead=a.total&&(!a.stt_on||a.stt_done>=a.total)
                            &&(!a.hl_on||a.hl_done>=a.total);
      txt.textContent=a.why==='off'?'Both readers are off'
        :a.why?a.why.charAt(0).toUpperCase()+a.why.slice(1)
        :(allRead?'Every recording has been read':'Waiting for a quiet moment');
    }
    const tot=a.total||0;
    bar.style.display=(tot&&(a.stt_on||a.hl_on))?'':'none';   /* no empty rail when both are off */
    if(tot){const d=a.stt_on?(a.stt_done||0):(a.hl_done||0);
      fill.style.width=Math.round(Math.min(d,tot)/tot*100)+'%';}
    const parts=[];
    if(a.stt_on)parts.push(`${num(a.stt_done)} of ${num(tot)} recordings read`);
    if(a.hl_on)parts.push(`${num(a.hl_done)} listened to for loud moments`);
    sub.textContent=parts.join(' · ')
      ||'Turn one on and the tome reads whenever you are away from a game.';
  };
  let iv=null;
  const ask=()=>{
    if(!(api&&api.ai_status)){                 /* an older Lore.exe */
      txt.textContent='This copy of LORE cannot report on the reader';
      sub.textContent='';bar.style.display='none';
      if(iv)clearInterval(iv);return;
    }
    try{api.ai_status().then(paint).catch(()=>{});}catch(e){}
  };
  iv=setInterval(()=>{
    if(!document.body.contains(box)){clearInterval(iv);return;}   /* left the page */
    ask();
  },2500);
  ask();
  return box;
}

function listEditor(getList,save,placeholder,forceExe){
  const wrap=el('div','ledit');
  const rows=el('div','lrows');wrap.append(rows);
  let items=[...getList()];
  function paint(){rows.innerHTML='';
    if(!items.length)rows.append(el('div','shint','— nothing here yet —'));
    items.forEach((it,i)=>{const r=el('div','lrow');r.append(el('span','',esc(it)));
      const x=el('button','','✕');x.title='Remove';
      x.addEventListener('click',()=>{items.splice(i,1);paint();save(items);inscribed();});
      r.append(x);rows.append(r);});}
  paint();
  const add=el('div','laddrow');
  const inp=document.createElement('input');inp.className='tin';inp.style.flex='1';
  inp.placeholder=placeholder;
  const b=el('button','wbtn','Add');
  const doAdd=()=>{let v=inp.value.trim();if(!v)return;
    if(forceExe&&!v.toLowerCase().endsWith('.exe'))v+='.exe';
    items.push(v);inp.value='';paint();save(items);inscribed();};
  b.addEventListener('click',doAdd);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')doAdd();});
  add.append(inp,b);wrap.append(add);
  return wrap;}

  const btn=el('button','wbtn mini','Set');
  btn.addEventListener('click',()=>captureHotkey(spec=>{

      const others=['hotkey_record','hotkey_replay','hotkey_clip_discord','hotkey_pause'].filter(k=>k!==key);
      if(others.some(k=>S.settings.settings[k]===spec)){whisper('that sigil already commands something else — choose another');return;}

function captureHotkey(done){
  const m=$('#modal');m.classList.add('on');
  m.innerHTML='';const card=el('div','mcard');
  card.append(el('h3','','Inscribe a sigil'));
  card.append(el('p','','Press the key combination now.<br>Esc cancels · Backspace unbinds.'));
  const k=el('div','kbig','…');card.append(k);
  m.append(card);
  function specFrom(e){
    const mods=[];if(e.ctrlKey)mods.push('ctrl');if(e.altKey)mods.push('alt');
    if(e.shiftKey)mods.push('shift');if(e.metaKey)mods.push('win');
    let key=e.key.toLowerCase();
    if(['control','alt','shift','meta','os'].includes(key))return null;
    if(e.code&&e.code.startsWith('Numpad'))return null;   /* numpad digits carry a different VK than the top row - a 'ctrl+alt+1' bound from Numpad1 would look bound and never fire; make the reader pick a bindable key */
    const map={' ':'space','escape':'esc','arrowup':'up','arrowdown':'down',
      'arrowleft':'left','arrowright':'right','pageup':'pageup','pagedown':'pagedown',
      'enter':'enter','delete':'delete','insert':'insert','home':'home','end':'end',
      'printscreen':'printscreen','tab':'tab'};
    if(map[key])key=map[key];
    if(key.length===1&&!/[a-z0-9]/.test(key)){
      /* shift turns 1 into ! on the keycap but not in RegisterHotKey - read the
         physical key from e.code so ctrl+shift+1 is actually bindable */
      const pc=/^(?:Key([A-Z])|Digit(\d))$/.exec(e.code||'');
      if(!pc)return null;
      key=(pc[1]||pc[2]).toLowerCase();
    }
    if(!/^f\d{1,2}$/.test(key)&&key.length>1&&!Object.values(map).includes(key))return null;
    return mods.concat([key]).join('+');}
  function onKey(e){
    e.preventDefault();e.stopPropagation();
    if(e.key==='Escape'){cleanup();done(null);return;}
    if(e.key==='Backspace'){cleanup();done('');return;}
    const spec=specFrom(e);
    if(spec===null){k.textContent=[e.ctrlKey&&'ctrl',e.altKey&&'alt',e.shiftKey&&'shift']
      .filter(Boolean).join(' + ')+' + …';return;}
    k.textContent=spec;
    setTimeout(()=>{cleanup();done(spec);},240);}
  function cleanup(){window.removeEventListener('keydown',onKey,true);m.classList.remove('on');m.innerHTML='';}
  window.addEventListener('keydown',onKey,true);
}

function confirmBurn(v,projEl){
  const m=$('#modal');m.classList.add('on');m.innerHTML='';
  const card=el('div','mcard');
  card.append(el('h3','','Burn this memory?'));
  card.append(el('p','',esc(fmtWhen(v.mtime))+' · '+esc(fmtSize(v.size))+
    '<br>Once burned, it cannot be rewritten.'));
  const btns=el('div','mbtns');
  const keep=el('button','wbtn','Keep it');
  const burn=el('button','wbtn danger','Burn');
  keep.addEventListener('click',()=>{m.classList.remove('on');m.innerHTML='';});
  burn.addEventListener('click',async()=>{
    m.classList.remove('on');m.innerHTML='';
    projEl.classList.add('deleting');delProg(true,'burning memory…',18);
    let res=null;try{res=await api.delete_video(v.path);delProg(true,'cleaning the shelf…',82);}catch(e){}
    projEl.classList.remove('deleting');
    setTimeout(()=>delProg(false),500);
    if(res&&res.ok){projEl.classList.add('burning');whisper('the page lets it go…');
      try{S.thumbs.delete(v.path);_tmeta.delete(v.path);idbDel(v.path);}catch(e){}   /* purge like the other two burn paths, or the idb row is orphaned forever */
      const rc=projEl.getBoundingClientRect();
      spawnSparks(rc.left+rc.width/2,rc.top+rc.height/2,9,'#ffb27a');
      setTimeout(()=>refreshLibrary(true),800);}
    else if(res&&res.why==='converting')whisper('it is being restored — wait for the ink to dry');
    else if(res&&res.why==='playing')whisper('close the in-tome player first, then burn it');
    else if(res&&res.why==='locked')whisper('something is still using it — close what is open and try again');
    else whisper('the tome would not let go of it');});
  btns.append(keep,burn);card.append(btns);m.append(card);
}

  if(to===from)return;
  S.turning=true;
  document.body.classList.add('turning');
  syncTabActive(S.chapterOf[to]);
  const tpl=$('#leaf');
  const leaf=tpl.cloneNode(true);
  leaf.removeAttribute('id');
  leaf.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
  leaf.className='leafclone';
  tpl.parentNode.appendChild(leaf);
  const F=leaf.querySelector('.leaf-face.front .page-inner'),
        B=leaf.querySelector('.leaf-face.back .page-inner');
  const glow=leaf.querySelector('.leaf-glow');
  F.innerHTML='';B.innerHTML='';
  let anim;
  if(dir>0){
    /* the RIGHT leaf lifts: up-face = the page being turned (from-right); its
       back = destination-left; the right page beneath reveals to dest-right */
    placeFace(F,from,'R',true);
    placeFace(B,to,'L',true);
    underRight(to);
    leaf.style.display='block';
    /* Do not force layout here: the old getBoundingClientRect() paused every
       already-airborne sheet on ultrawide. Prewarm handles cold raster. */
    anim=leaf.animate([{transform:'rotateY(0deg)'},{transform:'rotateY(-180deg)'}],
      {duration:TURN_DUR,easing:SHEET_EASE,fill:'both'});
  }else{
    placeFace(F,to,'R',true);
    placeFace(B,from,'L',true);
    underLeft(to);
    leaf.style.display='block';
    anim=leaf.animate([{transform:'rotateY(-180deg)'},{transform:'rotateY(0deg)'}],
      {duration:TURN_DUR,easing:SHEET_EASE,fill:'both'});
  }
  /* hold the sheet FLAT for two frames: its fresh layer (paper tile + thumb
     posters) must be decoded, painted and composited before any rotation -
     otherwise raster eats the arc's first frames and the sheet pops in mid-air */
  try{anim.pause();}catch(e){}
  const curls=leaf.querySelectorAll('.leaf-curl');
  const rec={el:leaf,anim,dir,to,dead:false,lifted:false};
  rec.lift=()=>{
    if(rec.dead||rec.lifted)return;
    rec.lifted=true;
    try{anim.play();}catch(e){}
    /* depth rides the same clock as the flip - no per-frame JS (see Z_FRAMES) */
    try{leaf.animate(Z_FRAMES,{duration:TURN_DUR,easing:'linear',fill:'forwards'});}catch(e){}
    if(glow)glow.animate([{opacity:0},{opacity:.8,offset:.45},{opacity:0}],{duration:TURN_DUR});
    curls.forEach(cu=>cu.animate([{opacity:0},{opacity:.85,offset:.5},{opacity:0}],{duration:TURN_DUR,easing:'linear'}));
    clearTimeout(rec.timer);
    rec.timer=setTimeout(landAfterFinalPaint,TURN_DUR+34);   /* backstop, clocked from the REAL lift */
  };
  flight.push(rec);
  restack();
  requestAnimationFrame(()=>requestAnimationFrame(rec.lift));
  const pr=pagesRect();
  if(flight.length<=1&&innerWidth*innerHeight<=5500000)spawnSparks(pr.left+pr.width/2,pr.top+pr.height*(0.25+Math.random()*0.5),2);
  const finishLand=()=>{
    if(rec.dead)return;
    rec.dead=true;clearTimeout(rec.timer);
    /* the leaf's hidden face is now the settled page underneath */
    if(dir>0)underLeft(to);else underRight(to);
    const i=flight.indexOf(rec);if(i>=0)flight.splice(i,1);
    S.idx=cap(to);dressSigils(S.idx);   /* cap: the spreads may have been rebuilt smaller while this sheet was airborne */
    if(!flight.length){
      renderSpread(S.idx);          /* render full pages BEHIND the final leaf, then remove it: no landing pop */
      $('#leafshadow').style.display='none';
      S.turning=false;
      document.body.classList.remove('turning');
      frontier=S.idx;
    }
    try{anim.cancel();}catch(e){}
    try{leaf.remove();}catch(e){}
    restack();
  };
  const land=()=>finishLand();               /* MAXAIR cap: settle instantly */
  const landAfterFinalPaint=()=>{
    if(rec.dead||rec.landing)return;rec.landing=true;clearTimeout(rec.timer);
    /* land SYNCHRONOUSLY: the old pin-the-end-pose + double-rAF displayed one
       extra frame of the ROTATED raster, and a rotateY(-180) face never samples
       onto exactly the static page's pixels - his eye caught the ~1px card-edge
       shimmer on every settle. finishLand renders the real spread behind the
       leaf and removes it in this same task, so the next painted frame IS the
       page - no transformed frame in between. */
    finishLand();
  };
  rec.land=land;
  clearTimeout(rec.timer);
  /* hard fallback only: if the lift rAFs never fire (window hidden), lift late
     rather than never; once lifted, rec.lift re-arms the tight +34ms backstop */
  rec.timer=setTimeout(()=>{if(!rec.lifted)rec.lift();else landAfterFinalPaint();},TURN_DUR+400);
  anim.onfinish=landAfterFinalPaint;                        /* let the exact final frame paint once */
}

/* ----------------------------------------------------------------- tabs */
function paintTabs(){
  const cur=S.chapterOf[S.idx]||'';
  const gt=$('#gametabs');gt.innerHTML='';
  /* only games that actually appear under the current media filter get a bookmark */
  const games=sortedGames().filter(g=>mediaItems(g).length>0);   /* SAME order as the chapters - under A-Z/Fewest the ribbons used to keep count-order and even pick a different top-7 than the book showed */
  /* every tab is the SAME recessed leather; identity is its gem. SHORTER
     now (~2/3 the old length) and the gem sits on the INNER edge, next to
     the page. Left column: gem appended (right=inner). Right column: gem
     prepended (left=inner). */
  const GW=Math.min(150,Math.round(wing()))+23;   /* LOCKED plate length: the tabs are furniture, not upholstery - on an ultrawide the old wing()-stretch made them a metre long while only the PAGES were meant to grow */
  const GEMS=['#09eee6','#7F99E8','#c9b4ff','#96e8de','#a8aed1','#6a70f2','#b79ade'];
  const glowOf=hex=>{const n=parseInt(hex.slice(1),16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},.42)`;};
  const mkTab=(label,gem,active,fn,title,gemInnerRight,key)=>{
    const t=el('div','itab'+(active?' active':''));
    t.style.setProperty('--hue',gem);
    t.style.setProperty('--glow',glowOf(gem));
    const l=el('span','tlabel',esc(label));
    const gm=el('span','gem');
    if(gemInnerRight){t.append(l);t.append(gm);}   /* left column: page is to the right */
    else{t.append(gm);t.append(l);}                /* right column: page is to the left */
    t.style.setProperty('--tw',GW+'px');
    t.dataset.key=key||'';
    t.addEventListener('click',fn);
    t.title=title||label;
    return t;};
  const GOLD='#FFE186';
  /* NO 'All' tab - the right-side 'Library' ribbon is already home/overview,
     so 'All' was redundant. The freed slot shows one more game. The column is
     7 tabs: up to 7 games, or 6 games + a '+N more' that opens the contents. */
  const GMAX=games.length>7?6:7;
  /* the contents ribbon rides at the TOP of the column - it is the way home
     to every chapter, so it belongs above the chapters, not buried under them */
  if(games.length>GMAX)
    gt.append(mkTab(`+${games.length-GMAX} more`,'#b79ade',cur==='contents',   /* must agree with syncTabActive, or the ribbon it lit mid-turn snaps dark on landing */
      ()=>requestTurn(0),'Every chapter lives in the contents',true,'contents'));
  games.slice(0,GMAX).forEach((g,i)=>{
    gt.append(mkTab(g.display,GEMS[i%GEMS.length],cur===g.key,
      ()=>requestTurn(chapterStart(g.key)),g.display,true,g.key));
  });
  const at=$('#apptabs');at.innerHTML='';
  /* 'Library' is gone: the contents ribbon opposite already goes home, and the
     wordmark does too. Working sits at the END of the column, after the
     settings pages, where its page also sits. */
  APPENDIX.forEach((a,i)=>{
    if(a.key==='work')return;          /* appended last, below */
    at.append(mkTab(a.rlabel,GEMS[i%GEMS.length],cur==='set:'+a.key,
      ()=>requestTurn(S.spreads.findIndex(sp=>sp.type==='set'&&sp.app.key===a.key)),
      a.title,false,'set:'+a.key));
  });
  at.append(mkTab('Working',GOLD,cur==='set:work',openWork,
    'Everything the tome is doing right now',false,'set:work'));
}

/* ------------------------------------------------------------- the seal */
const STATE_TXT={
  watching:['WATCHING','the tome lies open','var(--gold)'],
  starting:['WAKING','the quill is warming…','var(--gold-hi)'],
  recording:['WRITING','','var(--ember-hi)'],
  paused:['HELD','the quill hovers — footage kept','var(--warn)'],
  saving:['BINDING','sealing your video into the book…','var(--violet)'],
  stopped:['ASLEEP','the tome rests','#777'],
};
function sealColor(state){
  return {watching:'var(--gold)',starting:'var(--gold-hi)',recording:'var(--ember)',
    paused:'var(--warn)',saving:'var(--violet)',stopped:'#666'}[state]||'var(--gold)';
}
/* the top-left saving card: filename, live bar, ETA and write speed while a
   session is being bound into the book. Honest numbers beat a mystery pill. */
function applyBindCard(b){
  let c=$('#bindcard');
  if(!b){if(c)c.classList.remove('on');return;}
  if(!c){
    c=el('div');c.id='bindcard';
    c.innerHTML='<div class="bc-title">sealing into the book</div>'+
      '<div class="bc-name"></div><div class="bc-bar"><div></div></div>'+
      '<div class="bc-sub"></div>';
    document.body.appendChild(c);
  }
  c.classList.add('on');
  c.querySelector('.bc-name').textContent=b.name||'';
  const pct=(b.pct!=null)?Math.max(0,Math.min(100,b.pct)):null;
  const bar=c.querySelector('.bc-bar>div');
  bar.style.width=(pct!=null?pct:8)+'%';
  bar.classList.toggle('pulse',pct==null);
  const bits=[];
  if(pct!=null)bits.push(pct+'%');
  if(b.eta!=null)bits.push('~'+(b.eta>=90?Math.round(b.eta/60)+' min':b.eta+'s')+' left');
  if(b.mbps!=null&&b.mbps>0.2)bits.push(Math.round(b.mbps)+' MB/s');
  c.querySelector('.bc-sub').textContent=bits.join(' · ')||'measuring…';
}
function applyState(st){
  /* the idle tick is the common case: same seal, same words, same nothing.
     every textContent write below swaps its text node even when the string
     is identical - a needless style/layout tick at 1.6Hz, all night - so
     leave early when none of the painted fields moved. */
  const fp=JSON.stringify([st.status,st.elapsed,st.game,st.size_mb,st.binding,
    st.converting,st.queued,st.hdr,st.webhook]);
  if(fp===S.stateFp)return;
  S.stateFp=fp;
  applyBindCard(st.binding||null);
  const seal=$('#seal');
  const s=st.status in STATE_TXT?st.status:'watching';
  if(s!==S.lastStatus&&(s==='recording'||s==='saving')){
    const rc=seal.getBoundingClientRect();
    spawnSparks(rc.left+rc.width/2,rc.top+rc.height/2,8,
      s==='recording'?'#ff9a6a':'#c9b4f0');
  }
  seal.dataset.state=s;
  /* PERF: freeze ambient compositing while the backend is doing heavy ffmpeg work */
  document.body.classList.toggle('busy', s==='saving'||s==='recording'||s==='starting'||!!st.converting);
  seal.querySelector('svg').style.setProperty('--sc',sealColor(s));
  seal.title=(s==='recording'||s==='paused')?'Stop & save':(s==='starting'?'Cancel':'Begin recording');
  const [word,subDefault,col]=STATE_TXT[s];
  const sw=$('#stateword');sw.textContent=word;sw.style.color=col;
  const t=$('#timer');
  if(s==='recording'||s==='paused'){t.textContent=fmtClock(st.elapsed);
    t.style.color=s==='recording'?'#ffb59a':'#f0d9a0';}
  else{t.textContent='';}   /* idle: no stray dot hovering over the sub-line */
  let sub=subDefault;
  if(s==='recording')sub=(st.game||'the screen')+(st.size_mb?` — ${st.size_mb>1000?(st.size_mb/1000).toFixed(1)+' GB':Math.round(st.size_mb)+' MB'} so far`:'');
  if(s==='watching'){
    const bits=[];
    if(st.converting)bits.push(`restoring ${st.converting.name.replace(/\.mp4$/,'')}${st.converting.pct?` — ${Math.round(st.converting.pct)}%`:''}`);
    else if(st.queued)bits.push(`${st.queued} restoration${st.queued>1?'s':''} awaiting idle`);
    /* the reader at work - the one place it is visible without opening
       Settings, so it says WHICH recording it has open */
    if(st.ai)bits.push(`${st.ai.kind==='hl'?'listening to':'reading'} ${String(st.ai.name||'').replace(/\.mp4$/i,'')}`);
    if(st.hdr)bits.push('HDR eyes open');
    if(bits.length)sub=bits.join(' · ');
  }
  $('#statesub').textContent=sub;
  const bb=$('#sealbtns');
  const want=(s==='recording'||s==='paused')?'rec':'idle';
  if(bb.dataset.mode!==want){
    bb.dataset.mode=want;bb.innerHTML='';
    if(want==='rec'){
      const p=el('button','sbtn',s==='paused'?'Continue':'Hold');
      p.addEventListener('click',()=>api.pause_toggle());
      bb.append(p);
      [15,30,60].forEach(sec=>{const b=el('button','sbtn',`${sec}s`);
        b.title=`Save the last ${sec} seconds`;
        b.addEventListener('click',()=>{api.clip(sec);whisper(`catching the last ${sec} seconds…`);});
        bb.append(b);});
      if(S.hasWebhook){const d=el('button','sbtn discord','➤ Discord');
        d.title='Save a clip and send it to Discord';
        d.addEventListener('click',()=>{api.clip_discord();whisper('catching a clip for the herald…');});
        bb.append(d);}
      bb.classList.add('on');
    }else{bb.classList.remove('on');}
  }else if(want==='rec'){
    const p=bb.querySelector('.sbtn');if(p)p.textContent=s==='paused'?'Continue':'Hold';
  }
  if(st.converting){
    document.querySelectorAll('.proj').forEach(pr=>{
      if(pr.dataset.path&&pr.dataset.path.endsWith(st.converting.name)){
        const bar=pr.querySelector('.proj-badge .bar');
        if(bar&&st.converting.pct!=null)bar.style.width=Math.round(st.converting.pct)+'%';
        const bt=pr.querySelector('.proj-badge .btxt');
        if(bt&&st.converting.pct!=null)bt.textContent=`Restoring true colour — ${Math.round(st.converting.pct)}%`;
      }});
  }
  $('#pages').classList.toggle('writing',s==='recording');
  S.lastStatus=s;
}

async function pollState(){

     main thread silent while the compositor carries sheets */
  if(S.turning||flight.length){setTimeout(pollState,250);return;}
  try{const st=await api.state();S.hasWebhook=st.webhook;applyState(st);}catch(e){}
  setTimeout(pollState,600);
}
async function refreshLibrary(force){
  try{
    const sig=await api.signature();
    if(!force&&sig===S.sig)return;
    const ae=document.activeElement;
    if(S.turning
       ||$('#modal').classList.contains('on')
       ||$('#viewer').classList.contains('on')
       ||(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)))return;
    const curKey=S.chapterOf[S.idx];
    const chapStartIdx=S.chapterOf.indexOf(curKey);
    const offset=chapStartIdx===-1?0:S.idx-chapStartIdx;
    S.lib=await api.library();
    S.sig=sig;   /* own the signature only after its blob actually landed - a failed load must retry next poll, not strand a stale book */
    for(const g of (S.lib.games||[])){
      [...(g.sessions||[]),...(g.clips||[])].forEach(v=>{if(v.dur!=null)S.meta[v.path]=v.dur;});
    }
    const ae2=document.activeElement;
    if(S.turning
       ||$('#modal').classList.contains('on')
       ||$('#viewer').classList.contains('on')
       ||(ae2&&/INPUT|SELECT|TEXTAREA/.test(ae2.tagName))){S.sig='';return;}
    buildSpreads();
    let idx=S.chapterOf.indexOf(curKey);
    if(idx!==-1){
      const count=S.chapterOf.filter(k=>k===curKey).length;
      idx=idx+Math.min(offset,count-1);
    }else idx=clamp(S.idx,0,S.spreads.length-1);
    S.idx=idx;
    if(curKey&&curKey.startsWith('set:')){frontier=S.idx;paintTabs();syncNav();}
    else renderSpread(idx);
  }catch(e){}
}
async function pollLibrary(){
  if(S.turning||flight.length){setTimeout(pollLibrary,400);return;}   /* not while leaves fly */
  await refreshLibrary(false);setTimeout(pollLibrary,2000);}

/* A live frame-rate / worst-frame readout so 60fps can be verified ON the real
   window (the throttled dev preview lies). Hidden by default; toggle with F8
   or open the app with #fps in the URL. */
function fpsMeter(){
  const box=el('div');box.id='fpsmeter';box.style.display='none';
  document.body.appendChild(box);
  let on=false,frames=0,acc=0,worst=0,plast=0,raf=0;
  function loop(t){if(!on)return;const dt=t-plast;plast=t;if(dt>worst)worst=dt;frames++;acc+=dt;
    if(acc>=400){box.textContent='FPS '+Math.round(frames/acc*1000)+'   worst '+worst.toFixed(0)+'ms';frames=0;acc=0;worst=0;}
    raf=requestAnimationFrame(loop);}
  function set(v){on=v;box.style.display=v?'block':'none';
    if(v){plast=performance.now();frames=0;acc=0;worst=0;raf=requestAnimationFrame(loop);}else cancelAnimationFrame(raf);}
  addEventListener('keydown',e=>{if(e.key==='F8')set(!on);});
  set(location.hash.includes('fps'));
}

/* ------------------------------------------------------------ the scrying */
const V={cur:null,seeking:false,trim:null};
let _viewerReq=0;
function fmtT(s){if(!isFinite(s))return'0:00';s=Math.max(0,Math.floor(s));
  const m=Math.floor(s/60),ss=s%60;return`${m}:${String(ss).padStart(2,'0')}`;}
/* the video that comes after (dir 1) or before (dir -1) the current one, within
   the same game - clips first, then sessions, matching how they're displayed.
   Past a chapter's edge it spills into the neighbouring game (in the book's
   display order), so ⏭ only goes dead at the very end of the whole library. */
function viewerSibling(dir){
  if(!V.cur)return null;
  const games=sortedGames();                  /* the chapters, in the order the book shows them */
  for(let gi=0;gi<games.length;gi++){
    const g=games[gi];
    let list=mediaItems(g);                   /* follow the same clips-first order the pages show */
    let i=list.findIndex(v=>v.path===V.cur.path);
    if(i<0){
      /* current item is outside the active filter -> walk this game's whole set instead */
      const all=[...(g.clips||[]),...(g.sessions||[])];
      const a=all.findIndex(v=>v.path===V.cur.path);
      if(a<0)continue;                        /* not this game - keep looking */
      list=all;i=a;
    }
    const j=i+dir;
    if(j>=0&&j<list.length)return list[j];
    /* off this chapter's edge: hop to the nearest neighbouring game that has
       anything visible under the current filter */
    for(let k=gi+dir;k>=0&&k<games.length;k+=dir){
      const nl=mediaItems(games[k])||[];
      if(nl.length)return dir>0?nl[0]:nl[nl.length-1];
    }
    return null;                              /* the library itself ends here */
  }
  return null;
}
let _vdelBusy=false;
async function viewerDelete(){
  const v=V.cur;if(!v||_vdelBusy)return;
  _vdelBusy=true;                                  /* delete_video can block ~7s on lock retries - a re-armed second press must not double-fire */
  const req=_viewerReq;                            /* staleness token: if the user closes/opens another video while we wait, do NOT yank the viewer around */
  const nxt=viewerSibling(1)||viewerSibling(-1);   /* after a delete, show whatever ⏭ would have gone to next - even the next game - else fall back to the previous */
  const vd=$('#vvideo');
  try{vd.pause();vd.removeAttribute('src');vd.load();}catch(e){}   /* release the localhost range handle before Windows delete */
  delProg(true,'burning memory…',18);
  let res=null;try{res=await api.delete_video(v.path);delProg(true,'cleaning the shelf…',82);}catch(e){}
  setTimeout(()=>delProg(false),500);
  _vdelBusy=false;
  if(res&&res.ok){whisper('the page lets it go…');
    /* prune the dead file from S.lib IN PLACE: refreshLibrary skips while the
       viewer is open, so without this the reopened viewer's ⏭ still "sees" the
       deleted file in the stale lib and can hand a missing path to the player */
    for(const g of (S.lib.games||[])){
      g.clips=(g.clips||[]).filter(x=>x.path!==v.path);
      g.sessions=(g.sessions||[]).filter(x=>x.path!==v.path);
      g.count=g.clips.length+g.sessions.length;
    }
    /* purge the dead file's thumbnail everywhere, or the idb store grows forever */
    try{S.thumbs.delete(v.path);}catch(e){}
    try{_tmeta&&_tmeta.delete&&_tmeta.delete(v.path);}catch(e){}
    try{idbDel(v.path);}catch(e){}
    if(req===_viewerReq){                          /* only steer the viewer if it is still OUR viewing session */
      if(nxt&&nxt.path!==v.path)openViewer(nxt);else closeViewer();
    }
    setTimeout(()=>refreshLibrary(true),400);}
  else{
    if(res&&res.why==='converting')whisper('it is being restored — wait for the ink to dry');
    else if(res&&res.why==='playing')whisper('the video is still open — try again in a moment');
    else if(res&&res.why==='locked')whisper('something is still using it — close what is open and try again');
    else whisper('the tome would not let go of it');
    /* the src was stripped before the attempt - restore playback or the reader
       stares at a dead black stage while being told to wait */
    if(req===_viewerReq&&V.cur&&V.cur.path===v.path)openViewer(v);

}
async function openViewer(vid,seekTo){

  document.body.classList.add('cinema');   /* ribbons rest; region = book only */

/* 2.0: the tome marks the moments worth rewatching - gold ticks above the
   seek bar, one per detected loud moment; click to jump there (2s early,
   so the lead-in is never missed). */
let _hlPlace=null;      /* the current bar's placer, re-run on any resize */
async function renderHlMarks(vid,req){
  document.querySelectorAll('.hlmark').forEach(m=>m.remove());
  _hlPlace=null;
  let evs=[];try{evs=await api.highlights(vid.path)||[];}catch(e){}
  if(req!==_viewerReq||!evs.length)return;
  const vd=$('#vvideo'),wrap=$('#vseekwrap');
  const place=()=>{
    if(req!==_viewerReq)return;
    document.querySelectorAll('.hlmark').forEach(m=>m.remove());
    const d=vd.duration;if(!d||!isFinite(d))return;
    /* NEVER a barcode. However many moments the sidecar holds (older ones
       hold hundreds), only the loudest survive, and no two land closer than
       2.5% of the bar - so every tick reads as its own mark, not a smear. */
    const sep=d*0.025,keep=[];
    [...evs].sort((a,b)=>(b.z||0)-(a.z||0)).forEach(ev=>{
      if(keep.length<30&&keep.every(k=>Math.abs(k.t-ev.t)>=sep))keep.push(ev);});
    /* WHOLE-PIXEL positions off the MEASURED bar. A percentage looked right
       but drew each tick at a fractional x, so the browser smeared them to
       different widths - and it ignored the 7px the range thumb is inset at
       each end, which pushed the late marks past the end of the track. */
    const W=wrap.getBoundingClientRect().width;
    if(W<20)return;
    const win=tlWin();
    keep.sort((a,b)=>a.t-b.t).forEach(ev=>{
      if(ev.t<win.a-0.5||ev.t>win.b+0.5)return;   /* outside the shown slice */
      const m=el('div','hlmark');
      m.style.left=Math.round(tlPx(ev.t)-1)+'px';
      m.title='a loud moment — jump there';
      m.addEventListener('click',()=>{try{vd.currentTime=Math.max(0,ev.t-2);}catch(e){}});
      wrap.append(m);
    });
  };
  _hlPlace=place;
  if(vd.duration&&isFinite(vd.duration))place();
  else vd.addEventListener('loadedmetadata',place,{once:true});
  if(!renderHlMarks._ro&&window.ResizeObserver){
    renderHlMarks._ro=new ResizeObserver(()=>{if(_hlPlace)_hlPlace();});
    renderHlMarks._ro.observe(wrap);
  }
}
/* ---- THE SOUND OF THE RECORDING ----
   The loudness curve the highlight pass already measured, drawn under the
   timeline in the SAME window the bar shows, so zooming in zooms the sound
   with it. Peaks are where the shouting is. */
let _lvl=null,_lvlPath=null;
async function loadLevels(v){
  if(_lvlPath===v.path)return _lvl;
  _lvlPath=v.path; _lvl=null;
  try{ if(api.levels)_lvl=await api.levels(v.path); }catch(e){ _lvl=null; }
  return _lvl;
}
function drawLevels(){
  const c=$('#vlvl'); if(!c||!c.classList.contains('on'))return;
  const d=tlDur(), L=_lvl;
  const w=c.clientWidth||1, h=c.clientHeight||34, dpr=devicePixelRatio||1;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
  }
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  if(!L||!L.db||!L.db.length||!d){
    g.fillStyle='rgba(214,199,172,.45)'; g.font='italic 10px Georgia,serif';
    g.fillText(L===null
      ? 'not listened to yet — "Do this one now" in the ⋯ menu jumps the queue'
      : 'no sound here',8,h/2+3);
    return;
  }
  const win=tlWin(), n=L.db.length, dur=L.dur||d;
  const lo=Math.min(-60,(L.floor||-50)-4), hi=Math.max(lo+6,(L.peak||0)+1);
  const yOf=db=>h-2-((clamp(db,lo,hi)-lo)/(hi-lo))*(h-4);
  g.beginPath(); g.moveTo(0,h);
  for(let x=0;x<=w;x++){
    const t=win.a+(x/w)*win.len;
    const i=clamp(Math.round(t/dur*(n-1)),0,n-1);
    g.lineTo(x,yOf(L.db[i]));
  }
  g.lineTo(w,h); g.closePath();
  const grad=g.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'rgba(232,181,99,.55)');
  grad.addColorStop(1,'rgba(232,181,99,.08)');
  g.fillStyle=grad; g.fill();
  g.strokeStyle='rgba(255,226,166,.85)'; g.lineWidth=1; g.stroke();
  /* the pieces you marked, over the sound they cover */
  if(V.ed&&V.ed.on&&V.ed.segs.length){
    /* silence is a LAYER now, not a mode - colour by what is being marked */
    g.fillStyle=V.ed.layer==='silence'?'rgba(120,180,255,.28)'
      :V.ed.mode==='remove'?'rgba(255,120,110,.25)':'rgba(150,255,170,.22)';
    (V.ed.segs||[]).concat(V.ed.other||[]).forEach(sg=>{
      const x0=(sg.a-win.a)/win.len*w, x1=(sg.b-win.a)/win.len*w;
      if(x1>0&&x0<w)g.fillRect(Math.max(0,x0),0,Math.min(w,x1)-Math.max(0,x0),h);
    });
  }
}

/* ---- THE SCRUB PREVIEW ----

   second <video> pointed at the same file, because pulling a still off this
   footage takes about 1.8 seconds - far too slow to follow a pointer -
   while seeking to one of the 4-second keyframes the recorder lays down is
   quick. Seeks are coalesced: only the latest position is ever asked for. */
let _peek={t:-1,want:-1,busy:false,src:''};
function peekShow(clientX, t, anchorTopY){
  const box=$('#vpeek'), pv=$('#vpeekv'), vd=$('#vvideo');
  if(!box||!pv||!vd)return;
  const src=vd.currentSrc||vd.getAttribute('src')||'';
  if(!src)return;
  if(_peek.src!==src){ _peek.src=src; try{pv.src=src;}catch(e){} }
  box.classList.add('on');
  $('#vpeekt').textContent=fmtT(Math.max(0,t));
  /* place it above the bar, kept fully on screen */
  const w=box.offsetWidth||236;
  const x=Math.max(8,Math.min(innerWidth-w-8,clientX-w/2));
  box.style.left=x+'px';
  box.style.top=Math.max(8,(anchorTopY-(box.offsetHeight||150)-12))+'px';

function peekPump(){
  const pv=$('#vpeekv');

  const target=_peek.want; _peek.want=-1; _peek.busy=true; _peek.t=target;
  const done=()=>{ _peek.busy=false; pv.removeEventListener('seeked',done);

}
function peekHide(){
  const box=$('#vpeek'); if(box)box.classList.remove('on');
  _peek.want=-1;
}

/* ---- WHAT WAS SAID: read the recording instead of scrubbing it ----
   The transcript sidecar the tome already wrote, laid out as a column.

/* follow the playhead - cheap: a linear walk from the last known line */
function saidFollow(now){

  if(i===_said.at)return;
  if(_said.at>=0&&_said.lines[_said.at])_said.lines[_said.at].el.classList.remove('now');
  _said.at=i;

/* our own "fullscreen" is a plain body class, not the HTML Fullscreen API - the

/* ---- the editing table: mark pieces, KEEP or REMOVE them, stitch, save ---- */

function edDur(){ const d=$('#vvideo').duration; return (d&&isFinite(d))?d:0; }

   marking a three-minute clip is hopeless. So the bar now shows a WINDOW of
   the recording (30s / 2m / 10m / 30m / whole) and the thin strip above it

  const d=tlDur(), z=+(V.zoom||0);

  let a=(V.winA==null)?((($('#vvideo')||{}).currentTime||0)-z/2):V.winA;

function tlFollow(force){
