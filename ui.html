  addEventListener('resize',()=>{if($('#viewer').classList.contains('on'))sizeViewer();});
  if(window.ResizeObserver){
    const ro=new ResizeObserver(()=>{if($('#viewer').classList.contains('on'))sizeViewer();});
    ['#vtitle','#vbar','#vedrow','#vedprog','#vedconfirm'].forEach(s=>{const n=$(s);if(n)ro.observe(n);});
  }
}

/* ---------------------------------------------------------------- input */
function wireInput(){
  $('#cornerR').addEventListener('click',()=>stepTurn(1));
  $('#cornerL').addEventListener('click',()=>stepTurn(-1));
  $('#navNext').addEventListener('click',()=>stepTurn(1));
  $('#navPrev').addEventListener('click',()=>stepTurn(-1));
  /* scroll to riffle through the book (the ONE wheel listener - scrollable
     panels keep their scroll, the closed cover keeps its peace) */
  addEventListener('wheel',e=>{
    if(document.body.classList.contains('intro'))return;
    if($('#viewer').classList.contains('on')||$('#modal').classList.contains('on'))return;
    if(e.target&&e.target.closest&&e.target.closest('select,input,textarea'))return;
    /* walk EVERY scroll container above the target, not just the innermost: a
       non-scrollable .lrows nested in a scrollable .set-rows used to scroll the
       panel AND turn the page on the same notch */
    for(let sc=e.target&&e.target.closest&&e.target.closest('.rowlist,.set-rows,.lrows'); sc;
        sc=sc.parentElement&&sc.parentElement.closest('.rowlist,.set-rows,.lrows')){
      const scrollable=sc.scrollHeight>sc.clientHeight+1;
      const atTop=sc.scrollTop<=0, atBot=sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1;
      /* let the inner panel scroll UNTIL its edge, THEN chain the wheel to a page turn */
      if(scrollable && !((e.deltaY<0&&atTop)||(e.deltaY>0&&atBot)))return;
    }
    onWheelNotches(e);
  },{passive:true});
  [['#pageL',-1],['#pageR',1]].forEach(([sel,dir])=>{
    $(sel).addEventListener('click',e=>{
      if(e.target.closest('.proj,.vrow,.grow,.srow,.ledit,button,input,select,.tgl,.seg,.kcap'))return;
      const r=$(sel).getBoundingClientRect();
      const frac=(e.clientX-r.left)/r.width;
      if(dir<0&&frac<0.09)stepTurn(-1);
      if(dir>0&&frac>0.91)stepTurn(1);
    });});
  addEventListener('keydown',e=>{
    if(document.body.classList.contains('intro'))return;
    if($('#modal').classList.contains('on')||$('#viewer').classList.contains('on'))return;
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
    if(e.key==='ArrowRight'||e.key==='PageDown')stepTurn(1);
    if(e.key==='ArrowLeft'||e.key==='PageUp')stepTurn(-1);
    if(e.key==='Home'||e.key==='Escape')requestTurn(0);});
  $('#seal').addEventListener('click',()=>{api.record_toggle();});
  $('#btn-close').addEventListener('click',()=>api.hide());
  $('#btn-min').addEventListener('click',()=>api.minimize());
  $('#btn-max').addEventListener('click',async()=>{
    const z=await api.toggle_maximize();
    $('#btn-max').textContent=z?'❐':'▢';});
  document.addEventListener('contextmenu',e=>e.preventDefault());

  /* native window drag on the leather (real OS move loop = Aero Snap works:
     drag to the top edge to maximize, to a side to half-snap).
     Double-press is detected HERE, on pointerdown, because begin_drag hands
     the mouse to the OS move loop — the browser never sees the button-up, so
     a real 'dblclick' event only fires when it wins a race it usually loses. */
  const dragFrom=(elx,dblMax)=>{
    let lastDn=0,lastX=0,lastY=0;
    elx.addEventListener('pointerdown',async e=>{
      if(e.button!==0)return;
      if(e.target.closest('button,.itab'))return;
      const now=performance.now();
      /* double-press needs the cursor to have STAYED PUT: a drag-drop-regrab
         within 400ms is two drags, not a maximize (the OS move loop eats the
         button-up, so distance is the only signal a drag happened) */
      if(dblMax&&now-lastDn<400&&Math.hypot(e.screenX-lastX,e.screenY-lastY)<8){
        lastDn=0;
        const z=await api.toggle_maximize();
        $('#btn-max').textContent=z?'❐':'▢';
        return;
      }
      lastDn=now;lastX=e.screenX;lastY=e.screenY;
      api.begin_drag&&api.begin_drag();
    });};
  dragFrom($('#toprim'),true);dragFrom($('#cover'),false);
  dragFrom($('#dragpill'),true);   /* the player pill moves the window EXACTLY like the rim - same native move loop, same double-press-to-maximize */

  const grip=$('#grip');
  let rs=null, rsPending=false;
  grip.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;   /* right/middle press must not arm a live resize (context menu is suppressed app-wide, so nothing would even hint why the window is warping) */
    rs={sx:e.screenX,sy:e.screenY,w:innerWidth,h:innerHeight};
    grip.setPointerCapture(e.pointerId);e.preventDefault();});
  grip.addEventListener('pointermove',e=>{
    if(!rs||rsPending)return;
    const w=Math.max(860,rs.w+(e.screenX-rs.sx));
    const h=Math.max(645,rs.h+(e.screenY-rs.sy));
    rsPending=true;
    Promise.resolve(api.resize_to(w,h)).finally(()=>{setTimeout(()=>{rsPending=false;},50);});});
  grip.addEventListener('pointerup',e=>{
    if(rs){const w=Math.max(860,rs.w+(e.screenX-rs.sx));
      const h=Math.max(645,rs.h+(e.screenY-rs.sy));
      api.resize_to(w,h);
      setTimeout(()=>dispatchEvent(new Event('resize')),160);}
    rs=null;});

  let rzT=null,lastPP=perPage();
  window._relayout=()=>relayout();   /* openTome needs a handle: resizes that settle during the intro are dropped, so the cover-open must reconcile geometry itself */
  function relayout(){
    const np=perPage();
    if(np!==lastPP){
      if(S.turning){setTimeout(relayout,400);return;}
      lastPP=np;
      const curKey=S.chapterOf[S.idx];
      const cs=S.chapterOf.indexOf(curKey);
      const off=cs===-1?0:S.idx-cs;
      buildSpreads();
      let idx=S.chapterOf.indexOf(curKey);
      if(idx!==-1){const n=S.chapterOf.filter(k=>k===curKey).length;
        idx+=Math.min(off,n-1);}
      else idx=clamp(S.idx,0,S.spreads.length-1);
      renderSpread(idx);
    }else{
      paintTabs();          /* re-measure + re-report the silhouette */
    }
  }
  let _reszEnd=null,_resizeWasActive=false;
  addEventListener('resize',()=>{clearTimeout(rzT);clearTimeout(_reszEnd);clearTimeout(_warmTimer);
    _pgRect=null;
    if(flight.length)settleFlightNow();
    document.body.classList.add('resizing');
    _resizeWasActive=true;
    _reszEnd=setTimeout(()=>{
      document.body.classList.remove('resizing');
      if(document.body.classList.contains('intro'))return;  /* settle after open */
      if(_resizeWasActive){
        _resizeWasActive=false;
        _turnWarmed=false;_turnWarmPromise=null;
        relayout();warmCache();prewarmTurn();startDust();   /* re-scatter the motes over the NEW pages rect - they were pinned to the boot-size window */
        /* the window just settled at a new size (grip drag, Aero snap-to-top,
           half-snap) - re-sync the maximise button glyph so it can't lie */
        try{Promise.resolve(api.window_state()).then(ws=>{$('#btn-max').textContent=(ws&&ws.maximized)?'❐':'▢';});}catch(e){}
      }
    },180);});
}

/* ----------------------------------------------------------------- intro */
function preIntro(){
  /* Reveal the closed LORE cover only after EVERYTHING on it can actually
     paint: the embedded leather + walnut JPEGs decoded, the fonts settled,
     and two frames rendered with them in place. first_paint() is what shows
     the native window, so the first visible frame IS the textured cover -
     never the flat-brown pre-paint colour. */
  try{
    const iv=$('#intro');if(iv)iv.style.display='';
    document.body.classList.add('intro');
    sendShape();
    let fired=false;
    const reveal=()=>{ if(fired)return; fired=true;
      /* the window is HIDDEN here - that is the whole point of this gate - and
         rAF NEVER TICKS in a hidden window. Waiting on a double-rAF stranded
         every cold boot in the tray until the 20s watchdog. Timers still run
         hidden, so the timer is the real path; the rAF pair stays for the
         (irrelevant) visible case and whichever lands first wins. */
      let called=false;
      const go=()=>{ if(called)return; called=true;
        try{api.first_paint&&api.first_paint();}catch(e){} };
      requestAnimationFrame(()=>requestAnimationFrame(go));
      setTimeout(go,60); };
    /* wait for the intro's real pixels, but NEVER hang hidden: every branch
       resolves on failure, fonts get 1.5s at most, and a 4s hard ceiling
       reveals no matter what (the backend's 20s watchdog stays a pure net) */
    const wait=ms=>new Promise(r=>setTimeout(r,ms));
    const css=getComputedStyle(document.documentElement);
    const decoded=name=>{        /* pre-decode an embedded texture data-URI */
      try{
        const m=(css.getPropertyValue(name)||'').match(/url\(\s*["']?([^"')]+)["']?\s*\)/);
        if(!m)return Promise.resolve();
        const img=new Image();img.src=m[1];
        return img.decode?img.decode().catch(()=>{}):Promise.resolve();
      }catch(e){return Promise.resolve();}
    };
    Promise.race([
      Promise.all([
        decoded('--leathertex'),                       /* the cover's hide */
        decoded('--wood-tex'),                         /* the desk beneath it */
        Promise.race([(document.fonts&&document.fonts.ready)||Promise.resolve(),wait(1500)])
      ]),
      wait(4000)
    ]).then(reveal,reveal);
  }catch(e){try{api.first_paint&&api.first_paint();}catch(_){}}
}
let _tomeOpening=false, _openTimer=null, _bookReady=false;
function openTome(){
  /* wait until the real pages exist beneath the cover so opening reveals them
     (not empty brown leather) even if the reader clicks the instant it shows */
  if(!_bookReady){setTimeout(openTome,80);return;}
  /* swing the front cover open - it VANISHES past vertical, revealing the
     real book (already rendered underneath). The table wood fades out with
     it. Nothing is cloned, so nothing can flicker. */
  const iv=$('#intro');
  if(!iv||!document.body.classList.contains('intro')||_tomeOpening)return;
  _tomeOpening=true;
  try{
    iv.style.display='';                        /* make sure the overlay is live */
    document.body.classList.remove('intro');   /* top chrome fades in, book revealed beneath */
    iv.classList.add('fading');                 /* the leather LORE card crossfades away */
    /* the resize settle DROPS resizes that land while body.intro is armed (tray
       rest is exactly when games switch resolutions) - so reconcile geometry the
       moment the cover opens, or the book paints with the OLD monitor's --wing/--vcols */
    try{window._relayout&&window._relayout();}catch(e){}
    const pr=$('#pages').getBoundingClientRect();
    requestAnimationFrame(()=>requestAnimationFrame(()=>prewarmTurn()));
    setTimeout(()=>spawnSparks(pr.left+pr.width*0.5,pr.top+pr.height*0.42,10),240);
    clearTimeout(_openTimer);
    _openTimer=setTimeout(()=>{iv.style.display='none';iv.classList.remove('fading');_tomeOpening=false;},980);
  }catch(e){
    /* the opening must NEVER be able to strand the book closed */
    try{iv.style.display='none';}catch(_){}
    document.body.classList.remove('intro');
    _tomeOpening=false;
  }
}
/* Called from Python just before the window hides (rest in tray): put the
   book back in its closed state so the NEXT show opens it again. */
window.tomeRest=function(){
  try{
    const iv=$('#intro');
    if(!iv)return;
    clearTimeout(_openTimer);          /* don't let a pending open hide the overlay */
    settleFlightNow();                 /* abandon any leaf mid-air first */
    closeViewer();
    iv.classList.remove('fading');     /* reset the card so the next show fades in again */
    _tomeOpening=false;
    renderSpread(0);                   /* wake to the first page, current data */
    if(document.body.classList.contains('reduced')){
      /* reduced-motion never plays the swing, so it must NOT close the book -
         it would trap the (hidden-during-intro) window buttons off-screen */
      iv.style.display='none';
      document.body.classList.remove('intro');
    }else{
      iv.style.display='';
      document.body.classList.add('intro');
    }
  }catch(e){}
};
/* Called from Python right after the window shows again. */
window.tomeWake=function(){
  try{
    if(document.body.classList.contains('reduced')){
      /* no ceremony - just make sure the book is open and the chrome is back */
      document.body.classList.remove('intro');
      const iv=$('#intro');if(iv)iv.style.display='none';
      return;
    }
    if(document.body.classList.contains('intro')){
      setTimeout(prewarmTurn,120);
      setTimeout(openTome,420);   /* the backend's show_tome contract: "the book was closed when it went to rest - open it again". this call was dropped in a rework and every tray-wake stranded a closed cover with hidden chrome */
    }
  }catch(e){}
};
function playIntro(){
  const iv=$('#intro');
  if(document.body.classList.contains('reduced')){
    document.body.classList.remove('intro');iv.style.display='none';sendShape();
    api.first_paint&&api.first_paint();return;}
  iv.addEventListener('click',openTome);   /* a click still opens it early */
  setTimeout(prewarmTurn,120);             /* raster-warm a leaf */
  setTimeout(warmTurnPath,560);            /* JIT-warm the real turn path, hidden under the cover */
  if(!location.hash.includes('introhold'))setTimeout(openTome,1600);   /* otherwise auto-open after ~1.5s; #introhold keeps the closed cover up for screenshots/harnesses */
}

/* ---- textures: rasterise the paper grain ONCE ----
   The paper grain ships as an SVG feTurbulence+feDiffuseLighting filter. As a
   live CSS background it must be re-rasterised whenever its layer repaints -
   cheap for one static page, but a real cost on every 3D-rotating sheet (and
   notably slow in WebView2). We bake it to a flat PNG tile at boot and use it
   everywhere, so pages and flying sheets share one identical, cheap texture. */
function rasterizeTexture(svgUrl,w,h){
  return new Promise(res=>{
    try{
      const img=new Image();
      img.onload=()=>{try{const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/png'));}catch(e){res(null);}};
      img.onerror=()=>res(null);
      img.src=svgUrl;
    }catch(e){res(null);}
  });
}
async function bakeTextures(){
  try{
    const probe=document.querySelector('.paper');if(!probe)return;
    const bg=getComputedStyle(probe,'::before').backgroundImage||'';
    const m=bg.match(/url\(\s*"([^"]+)"\s*\)/)||bg.match(/url\(\s*'([^']+)'\s*\)/)||bg.match(/url\(\s*([^)]+?)\s*\)/);
    const url=m&&m[1];
    if(!url||url.indexOf('data:image/svg')!==0)return;
    const png=await rasterizeTexture(url,240,240);
    if(png){const s=document.createElement('style');
      s.textContent='.paper::before{background-image:url("'+png+'")}';document.head.appendChild(s);}
  }catch(e){}
}

/* ----------------------------------------------------------------- boot */
(async function(){
  await connect();
  if(!MOCK)preIntro();               /* the painted closed cover on screen IMMEDIATELY */
  /* Load the portfolio and render the real book. The cover will NOT open until
     the pages exist beneath it (openTome's _bookReady gate), so opening always
     reveals the real spread - never brown leather, never a pop-in. */
  try{
    S.settings=await api.get_settings();applyMood();
    S.sig=await api.signature();S.lib=await api.library();   /* sig FIRST, like refreshLibrary: a change landing between the two awaits then differs on the next poll instead of being silently skipped */
  }catch(e){S.lib={games:[]};}
  const st0=await api.state().catch(()=>null);if(st0){S.hasWebhook=st0.webhook;}
  await idbHydrate();                       /* load the persisted thumbnails so the first render shows them instantly (no black) */
  initMediaToggle();                       /* restore the videos/clips filter before the first build */
  buildSpreads();renderSpread(0);
  _bookReady=true;                   /* the real pages now exist under the cover */
  setTimeout(prewarmTurn,120);       /* warm while the LORE cover is showing, before the first page turn */
  {const m=location.hash.match(/(?:[#&,])s(\d+)/);if(m)renderSpread(+m[1]);}  /* deep-link to a spread (dev/testing) */
  startDust();fpsMeter();wireInput();wireViewer();
  bakeTextures();                    /* upgrade the paper grain to a cheap raster tile */
  pollState();pollLibrary();
  try{const ws=await api.window_state();$('#btn-max').textContent=(ws&&ws.maximized)?'❐':'▢';}catch(e){}
  try{playIntro();}catch(e){
    document.body.classList.remove('intro');
    const iv=$('#intro');if(iv)try{iv.remove();}catch(_){}
    sendShape();try{api.first_paint&&api.first_paint();}catch(_){}
  }
  if(MOCK&&!location.hash.includes('introhold')){
    document.body.classList.remove('intro');const iv=$('#intro');if(iv)iv.remove();
    sendShape();whisper('mock library — the recorder is not attached');}
})();
</script>
