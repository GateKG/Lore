function perPage(){
  fitBook();   /* geometry first: the drawn book must wear the same cap we count with */
  const pagesW=innerWidth-2*(wing()+24), pagesH=innerHeight-58-60;   /* wing() already ate the ultrawide excess; 58+60 mirrors --rimT/--rimB exactly */
  const pageW=pagesW*0.492;
  const innerW=pageW*0.83;
  const cols=gridCols(innerW);
  document.documentElement.style.setProperty('--vcols',cols);   /* .vgrid reads THIS - promised count = painted count */
  const colW=(innerW-16*(cols-1))/cols;
  const rowH=colW*9/16+40+14;   /* +40 = the TWO-row meta (date row + duration/size row), not the old 26 - undercounting this clipped the bottom row */
  const bodyH=pagesH*0.83-100;   /* MEASURED real page-body height; the old 0.90-88 overshot ~70px so the last row clipped */
  const rows=Math.max(1,Math.min(5,Math.floor((bodyH+14)/rowH)));   /* size-aware: up to 5 rows on a tall window, not hard-capped at 3 */
  return rows*cols;
}

/* which media a game contributes under the current filter, and in what order.
   'all' = clips FIRST then sessions (so a chapter opens on its highlights and
   the full videos follow); 'videos'/'clips' = just that kind. */
function mediaItems(g){
  const f=S.media||'all';
  if(f==='videos')return g.sessions;
  if(f==='clips')return g.clips;
  return g.clips.concat(g.sessions);
}
/* the order of chapters in the book + the contents list: by how many recordings
   each game holds (default) or alphabetically. Persisted. */
function sortedGames(){
  const mode=S.gameSort||'count';
  const arr=((S.lib&&S.lib.games)||[]).slice();
  if(mode==='az')arr.sort((a,b)=>(a.display||'').localeCompare(b.display||'',undefined,{sensitivity:'base'}));
  else if(mode==='za')arr.sort((a,b)=>(b.display||'').localeCompare(a.display||'',undefined,{sensitivity:'base'}));
  else if(mode==='fewest')arr.sort((a,b)=>(a.count-b.count)||(b.latest-a.latest));
  else arr.sort((a,b)=>(b.count-a.count)||(b.latest-a.latest));   /* 'count' = most first */
  return arr;
}
function setGameSort(mode){
  if(S.gameSort===mode)return;
  S.gameSort=mode; try{localStorage.setItem('lore.gamesort',mode);}catch(e){}
  if(S.turning||flight.length)settleFlightNow();   /* a sheet landing into a REBUILT spread array paints stale content - settle first, like the resize path */
  const curKey=(S.chapterOf&&S.chapterOf[S.idx])||'';
  buildSpreads();
  let idx=curKey?S.chapterOf.indexOf(curKey):-1;
  if(idx<0)idx=0;                                 /* order changed - jump to contents/first */
  renderSpread(clamp(idx,0,Math.max(0,S.spreads.length-1)));
}

function buildSpreads(){
  const PER_PAGE=perPage();
  const spreads=[];const chapterOf=[];
  if(!S.gameSort){try{S.gameSort=localStorage.getItem('lore.gamesort')||'count';}catch(e){S.gameSort='count';}}
  const games=sortedGames();
  if(!games.length){
    spreads.push({type:'front'});chapterOf.push('contents');
  }else{
    spreads.push({type:'contents'});chapterOf.push('contents');
    games.forEach((g,gi)=>{
      const hue=hueOf(g.key);
      const items=mediaItems(g);
      if(!items.length)return;                 /* nothing in this view -> skip the game */
      const perSpread=PER_PAGE*2;              /* a spread is two pages; items flow L then R */
      const pagesN=Math.max(1,Math.ceil(items.length/perSpread));
      for(let k=0;k<pagesN;k++){
        const chunk=items.slice(k*perSpread,(k+1)*perSpread);
        spreads.push({type:'chapter',game:g,hue,gi,k,pagesN,
          lItems:chunk.slice(0,PER_PAGE),
          rItems:chunk.slice(PER_PAGE)});
        chapterOf.push(g.key);
      }
    });
  }
  APPENDIX.forEach((a,ai)=>{spreads.push({type:'set',app:a,ai});chapterOf.push('set:'+a.key);});
  S.spreads=spreads;S.chapterOf=chapterOf;
  if(typeof invalidateSpreadCache==='function')invalidateSpreadCache();  /* indices changed */
}
const chapterStart=key=>S.chapterOf.indexOf(key);

async function loadThumb(path,img,mtime){
  /* cached -> show INSTANTLY (no fade). The .6s opacity fade re-ran on every page
     LANDING (renderSpread rebuilds the cards), so a thumbnail we already had would
     flash black then fade back in on each turn. 'instant' kills that fade; only a
     first-ever load still fades in. Cache is large so browsing many clips doesn't
     keep evicting + re-fetching (that was the endless spinner). */
  img.onerror=()=>{
    /* the browser refused to decode what we fed it -> never wear the torn-page
       glyph. purge the liar from every cache, fall back to 'no preview', and
       ask the backend to regenerate exactly once (not a retry storm). */
    img.removeAttribute('src');img.classList.remove('on','instant');
    S.thumbs.delete(path);_tmeta.delete(path);idbDel(path);
    const fr=img.parentElement;if(fr)fr.classList.add('noimg');
    if(!img.dataset.reforged){img.dataset.reforged='1';loadThumb(path,img,mtime);}
  };
  let cached=S.thumbs.get(path);
  if(cached&&!thumbOK(cached)){            /* poisoned survivor from an old build */
    cached=null;S.thumbs.delete(path);_tmeta.delete(path);idbDel(path);
  }
  if(cached){
    /* cheap LRU touch: re-insert so a thumb the reader is LOOKING at is never
       the insertion-oldest entry the evictor pops next */
    S.thumbs.delete(path);S.thumbs.set(path,cached);
    img.src=cached;img.classList.add('on','instant');
    if(!mtime || _tmeta.get(path)===mtime)return;   /* fresh cache hit */
    /* stale cache: keep showing it while the backend refreshes the JPG, so fast
       scrolling never flashes black just because the source mtime changed. */
  }
  try{const d=await api.thumb(path);
    if(thumbOK(d)){if(S.thumbs.size>3000){const k=S.thumbs.keys().next().value;S.thumbs.delete(k);_tmeta.delete(k);}
      S.thumbs.set(path,d);_tmeta.set(path,mtime||0);
      if(img.isConnected){const fr=img.parentElement;if(fr)fr.classList.remove('noimg');
        img.src=d;img.classList.add('on');if(cached)img.classList.add('instant');}
      idbPut(path,d,mtime);}
    else if(!cached){const fr=img.parentElement;if(fr)fr.classList.add('noimg');}}
  catch(e){if(!cached){const fr=img.parentElement;if(fr)fr.classList.add('noimg');}}
}
/* the video paths a spread will show - used to PRELOAD its thumbnails in one RPC
   before it lands, so a game doesn't 'pop' its cards a second after you open it */
function spreadPaths(idx){
  const sp=S.spreads&&S.spreads[idx]; if(!sp)return [];
  if(sp.type==='chapter')return [...(sp.lItems||[]),...(sp.rItems||[])].map(v=>v.path).filter(Boolean);
  return [];
}
const _preloadInFlight=new Set();
async function preloadThumbs(idx){
  if(!api.thumbs)return;
  const sp=S.spreads&&S.spreads[idx];
  const items=(sp&&sp.type==='chapter')?[...(sp.lItems||[]),...(sp.rItems||[])]:[];
  const mt={}; items.forEach(v=>{if(v&&v.path)mt[v.path]=v.mtime;});
  const paths=Object.keys(mt).filter(p=>{const c=S.thumbs.get(p);return !(c&&_tmeta.get(p)===mt[p]);});
  if(!paths.length||_preloadInFlight.has(idx))return;
  _preloadInFlight.add(idx);
  try{
    const m=await api.thumbs(paths);
    if(m){
      for(const p in m){ if(!thumbOK(m[p]))continue;   /* an empty data-URI is not a thumb; don't cache the glyph */
        if(S.thumbs.size>3000){const k=S.thumbs.keys().next().value;S.thumbs.delete(k);_tmeta.delete(k);}
        S.thumbs.set(p,m[p]); _tmeta.set(p,mt[p]||0); idbPut(p,m[p],mt[p]);
        try{const im=new Image();im.src=m[p];im.decode().catch(()=>{});_decoded.add(p);}catch(e){}   /* warm the decode NOW, off the main thread */
        if(S.turning||flight.length)continue;   /* airborne: cache only - live img.src writes decode-paint under a flying leaf */
        document.querySelectorAll('.proj[data-path]').forEach(card=>{
          if(card.dataset.path===p){const img=card.querySelector('.proj-frame img');
            if(img&&!img.classList.contains('on')){img.src=m[p];img.classList.add('on','instant');
              const fr=img.parentElement;if(fr)fr.classList.remove('noimg');   /* a card that once failed must not wear 'no preview' OVER its recovered thumb */ }}
        });
      }
    }
  }catch(e){}finally{_preloadInFlight.delete(idx);}
}
/* decode-settle a spread's thumbnails BEFORE any sheet carries them: the flight
   faces paint these exact data-URIs, and a JPEG that first decodes while a leaf
   is mid-arc is precisely the "page in five positions" stutter. img.decode()
   does the work off the main thread and fills the decoded-image cache. */
const _decoded=new Set();
async function decodeSpread(idx){
  const jobs=[];
  for(const p of spreadPaths(idx)){
    if(_decoded.has(p))continue;
    const d=S.thumbs&&S.thumbs.get(p);if(!d)continue;
    if(_decoded.size>3000)_decoded.clear();
    _decoded.add(p);
    const im=new Image();im.src=d;
    jobs.push(im.decode().catch(()=>{}));
  }
  if(jobs.length)await Promise.all(jobs);
}

    b.addEventListener('click',()=>setGameSort(m));
    sortRow.append(b);
  });
  br.append(sortRow);
  const glist=el('div','rowlist');
  sortedGames().forEach((g,gi)=>{
    const hue=hueOf(g.key);
    const has=mediaItems(g).length>0;   /* greyed + inert when this view has nothing for it */
    const r=el('div','grow'+(has?'':' muted'));r.style.setProperty('--acc',hue.c);
    const sg=el('div','gsigil');sg.innerHTML=sigilSVG(g.key,hue,false);r.append(sg);

    const cparts=[];
    if(g.sessions.length)cparts.push(`${g.sessions.length} session${g.sessions.length>1?'s':''}`);
    if(g.clips.length)cparts.push(`${g.clips.length} clip${g.clips.length>1?'s':''}`);

    else r.title='nothing here in this view';
    glist.append(r);
  });
  br.append(glist);
  folio(cR,spreadIdx,'r','contents');
}

/* ---------------- a game chapter: sessions | clips ---------------- */
function renderChapter(cL,cR,sp,spreadIdx){
  const g=sp.game,hue=sp.hue;
  glyphmark(cL,g.key,hue,1+sp.k*2);glyphmark(cR,g.key,hue,2+sp.k*2);
  const suffix=sp.pagesN>1?` · ${roman(sp.k+1)}`:'';
  const lbl=items=>{const c=items.filter(v=>v.kind==='clip').length,s=items.length-c;
    return c&&s?'clips & sessions':c?'clips':'sessions';};
  /* ---- LEFT page (chapter head on k===0) ---- */
  if(sp.k===0){
    const stats=[];
    if(g.sessions.length)stats.push(`<b>${g.sessions.length}</b> session${g.sessions.length>1?'s':''}`);
    if(g.clips.length)stats.push(`<b>${g.clips.length}</b> clip${g.clips.length>1?'s':''}`);
    const total=(g.sessions.concat(g.clips)).reduce((a,v)=>a+v.size,0);
    stats.push(`<b>${esc(fmtSize(total))}</b>`);
    addRenameBtn(ptitle(cL,`chapter ${roman(sp.gi+1)} — ${lbl(sp.lItems)}`,g.display,hue,
           stats.join(' &nbsp;·&nbsp; '),g.key),g.display);
  }else{
    ptitle(cL,`chapter ${roman(sp.gi+1)} — ${lbl(sp.lItems)}${suffix}`,g.display,hue,null,null);
  }
  const bl=pbody(cL);
  if(sp.lItems.length){const grid=el('div','vgrid');
    sp.lItems.forEach((v,i)=>grid.append(renderVid(v,hue,i)));
    bl.append(grid);fillMeta(grid,sp.lItems);}
  else bl.append(emptyNote(S.media==='clips'?'clips':'sessions'));
  folio(cL,spreadIdx,'l',g.display);

  /* ---- RIGHT page: the same flow continues; empty only at a chapter's end ---- */
  if(sp.rItems.length){
    ptitle(cR,`${lbl(sp.rItems)}${suffix}`,g.display,hue);
    const brr=pbody(cR);const grid=el('div','vgrid');
    sp.rItems.forEach((v,i)=>grid.append(renderVid(v,hue,i)));
    brr.append(grid);fillMeta(grid,sp.rItems);
  }else{
    pbody(cR);   /* blank end-leaf: paper + decorative glyph + folio only */
  }
  folio(cR,spreadIdx,'r',g.display);
}

function queueSave(patch){
  if(S.settings){
    for(const k in patch){
      if(k==='autostart')S.settings.autostart=patch[k];
      else S.settings.settings[k]=patch[k];
    }
    applyMood();
  }
  Object.assign(S.pendingPatch=(S.pendingPatch||{}),patch);
  clearTimeout(S.saveTimer);
  S.saveTimer=setTimeout(async()=>{
    const p=S.pendingPatch;S.pendingPatch=null;
    try{const res=await api.set_settings(p);if(res)S.settings=res;inscribed();
      applyMood();}catch(e){}
  },420);
}

function captureHotkey(done){
  const m=$('#modal');m.classList.add('on');
  m.innerHTML='';const card=el('div','mcard');
  card.append(el('h3','','Inscribe a sigil'));
  card.append(el('p','','Press the key combination now.<br>Esc cancels · Backspace unbinds.'));
  const k=el('div','kbig','…');card.append(k);
  m.append(card);
  function specFrom(e){
    const mods=[];if(e.ctrlKey)mods.push('ctrl');if(e.altKey)mods.push('alt');
    if(e.shiftKey)mods.push('shift');if(e.metaKey)mods.push('win');
    let key=e.key.toLowerCase();
    if(['control','alt','shift','meta','os'].includes(key))return null;
    if(e.code&&e.code.startsWith('Numpad'))return null;   /* numpad digits carry a different VK than the top row - a 'ctrl+alt+1' bound from Numpad1 would look bound and never fire; make the reader pick a bindable key */
    const map={' ':'space','escape':'esc','arrowup':'up','arrowdown':'down',
      'arrowleft':'left','arrowright':'right','pageup':'pageup','pagedown':'pagedown',
      'enter':'enter','delete':'delete','insert':'insert','home':'home','end':'end',
      'printscreen':'printscreen','tab':'tab'};
    if(map[key])key=map[key];
    if(key.length===1&&!/[a-z0-9]/.test(key))return null;
    if(!/^f\d{1,2}$/.test(key)&&key.length>1&&!Object.values(map).includes(key))return null;
    return mods.concat([key]).join('+');}
  function onKey(e){
    e.preventDefault();e.stopPropagation();
    if(e.key==='Escape'){cleanup();done(null);return;}
    if(e.key==='Backspace'){cleanup();done('');return;}
    const spec=specFrom(e);
    if(spec===null){k.textContent=[e.ctrlKey&&'ctrl',e.altKey&&'alt',e.shiftKey&&'shift']
      .filter(Boolean).join(' + ')+' + …';return;}
    k.textContent=spec;
    setTimeout(()=>{cleanup();done(spec);},240);}
  function cleanup(){window.removeEventListener('keydown',onKey,true);m.classList.remove('on');m.innerHTML='';}
  window.addEventListener('keydown',onKey,true);
}

function confirmBurn(v,projEl){
  const m=$('#modal');m.classList.add('on');m.innerHTML='';
  const card=el('div','mcard');
  card.append(el('h3','','Burn this memory?'));
  card.append(el('p','',esc(fmtWhen(v.mtime))+' · '+esc(fmtSize(v.size))+
    '<br>Once burned, it cannot be rewritten.'));
  const btns=el('div','mbtns');
  const keep=el('button','wbtn','Keep it');
  const burn=el('button','wbtn danger','Burn');
  keep.addEventListener('click',()=>{m.classList.remove('on');m.innerHTML='';});
  burn.addEventListener('click',async()=>{
    m.classList.remove('on');m.innerHTML='';
    projEl.classList.add('deleting');delProg(true,'burning memory…',18);
    let res=null;try{res=await api.delete_video(v.path);delProg(true,'cleaning the shelf…',82);}catch(e){}
    projEl.classList.remove('deleting');
    setTimeout(()=>delProg(false),500);
    if(res&&res.ok){projEl.classList.add('burning');whisper('the page lets it go…');
      const rc=projEl.getBoundingClientRect();
      spawnSparks(rc.left+rc.width/2,rc.top+rc.height/2,9,'#ffb27a');
      setTimeout(()=>refreshLibrary(true),800);}
    else if(res&&res.why==='converting')whisper('it is being restored — wait for the ink to dry');
    else if(res&&res.why==='playing')whisper('close the in-tome player first, then burn it');
    else if(res&&res.why==='locked')whisper('something is still using it — close what is open and try again');
    else whisper('the tome would not let go of it');});
  btns.append(keep,burn);card.append(btns);m.append(card);
}

/* -------------------------------------------------------- spread render */
function renderInto(cL,cR,spread,spreadIdx){
  cL.innerHTML='';cR.innerHTML='';
  if(spread.type==='front'){renderFront(cL,cR,spreadIdx);return;}
  if(spread.type==='contents'){renderContents(cL,cR,spreadIdx);return;}
  if(spread.type==='chapter'){renderChapter(cL,cR,spread,spreadIdx);return;}
  if(spread.type==='set'){renderSet(cL,cR,spread.app,spreadIdx);return;}
}

function renderSpread(i){
  S.idx=clamp(i,0,S.spreads.length-1);
  frontier=S.idx;                       /* an authoritative render == we are here */
  renderInto($('#contentL'),$('#contentR'),S.spreads[S.idx],S.idx);
  dressSigils(S.idx);
  paintTabs();
  syncNav();
  warmCache();                          /* pre-build neighbours so riffle spawns are cheap clones */
}

function syncNav(){
  $('#cornerL').style.display=S.idx>0?'':'none';
  $('#cornerR').style.display=S.idx<S.spreads.length-1?'':'none';
  $('#navPrev').disabled=S.idx<=0;
  $('#navNext').disabled=S.idx>=S.spreads.length-1;

/* -------------------------------------------------------------- turning */
/* moveKids removed - the old spawnLeaf DOM-moving model is gone */
/* light the destination's ribbon the moment a turn BEGINS - waiting for the
   page to land made every tab press feel ignored */
function syncTabActive(ch){
  ch=ch||'contents';
  document.querySelectorAll('.itab').forEach(t=>{
    const k=t.dataset.key||'';
    let on;
    if(k==='library')on=!ch.startsWith('set:');
    else on=(k===ch);
    t.classList.toggle('active',on);

}
/* the turn's easing, solvable in plain math - the cast shadow used to read
   getComputedStyle(leaf) every frame, and that forced a style recalc that
   made big windows stutter mid-turn */
function cubicBezier(p1x,p1y,p2x,p2y){
  const cx=3*p1x,bx=3*(p2x-p1x)-cx,ax=1-cx-bx;
  const cy=3*p1y,by=3*(p2y-p1y)-cy,ay=1-cy-by;
  const sx=t=>((ax*t+bx)*t+cx)*t, sy=t=>((ay*t+by)*t+cy)*t,
        dx=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{let t=x;
    for(let i=0;i<5;i++){const e=sx(t)-x;if(Math.abs(e)<1e-4)break;
      const d=dx(t);if(Math.abs(d)<1e-6)break;t-=e/d;}
    return sy(Math.min(1,Math.max(0,t)));};
}
/* ONE curve, ONE tempo - every leaf in the book turns at the same pace,
   so riffling reads as rhythm, not randomness */
const TURN_EASE=cubicBezier(.34,.04,.24,1);
/* ---- turn state ----
   Every wheel notch spawns ONE sheet the instant it arrives, so the turns
   play at exactly the rhythm you scrolled - no queue, no fixed tempo, no
   landing-gated draining. Sheets fly independently and overlap in the air.
   `frontier` is the spread the last-launched sheet is headed to. */
let flight=[];             /* sheets currently airborne, oldest-first */
let frontier=0;            /* where the newest sheet is going */
const TURN_DUR=280;        /* one duration - snappy, so overlaps stay few */
const maxAir=()=>(innerWidth*innerHeight>5500000)?2:3; /* cap concurrent sheets - evaluated LIVE,
                             not at parse: the window always BOOTS small (1152x648) and
                             only later maximizes onto the 5120x1440, where 3 full leaf
                             layers blow the GPU layer budget while ffmpeg is active. */
const SHEET_EASE='cubic-bezier(.33,.02,.24,1)';
const cap=(t)=>clamp(t,0,S.spreads.length-1);
/* OLDEST airborne sheet sits ON TOP so the cascade reads right */
/* Depth-sort the airborne sheets by flip angle (cheap z-index, no preserve-3d).
   A sheet near vertical (mid-flip) sits on top; one that has crossed the spine
   (>90deg) gets a small bump so it passes in front - the crossover preserve-3d
   gave, with cached layers. This used to re-run as JS every frame; now the SAME
   curve is baked into a keyframe track that rides each sheet's own animation
   clock - zero per-frame script, and depth can never drift from the flip
   because both share one timeline. */
const Z_FRAMES=(()=>{const f=[];
  for(let i=0;i<=8;i++){const p=i/8,ang=TURN_EASE(p)*180;
    f.push({offset:p,zIndex:String(50+Math.round(Math.sin(ang*Math.PI/180)*40)+(ang>90?3:0))});}
  return f;})();
function restack(){}   /* kept for its call sites; the Z_FRAMES track replaced the rAF loop */
/* Warm the turn machinery once, off-screen, so the FIRST real scroll animates
   smoothly instead of a cold-JIT jerk straight to the next page. */
let _turnWarmed=false,_turnWarmPromise=null,_warmQueue=[],_warmFlush=false;
function prewarmTurn(){
  if(_turnWarmed)return Promise.resolve(true);
  if(_turnWarmPromise)return _turnWarmPromise;
  _turnWarmPromise=new Promise(resolve=>{
    try{
      const tpl=$('#leaf'),pages=$('#pages');
      if(!tpl||!pages||!S.spreads.length){_turnWarmed=true;resolve(true);return;}
      warmCache(); cachedSpread(S.idx);
      const jobs=[];
      if(S.idx<S.spreads.length-1)jobs.push([S.idx,S.idx+1,1]);
      if(S.idx>0)jobs.push([S.idx,S.idx-1,-1]);
      if(!jobs.length){_turnWarmed=true;resolve(true);return;}

      /* Warm above the intro cover, not underneath it. The old prewarm lived
         inside #pages, so #intro occlusion could stop Chromium from rastering
         the real full-size leaf until the first wheel event. */
      const pr=pages.getBoundingClientRect();
      const stage=document.createElement('div');
      stage.id='turnwarm';
      stage.style.cssText='position:fixed;left:'+pr.left+'px;top:'+pr.top+'px;width:'+pr.width+'px;height:'+pr.height+'px;'+
        'z-index:99;pointer-events:none;opacity:.02;overflow:hidden;perspective:2300px;perspective-origin:50% 50%;contain:layout paint style;';
      document.body.appendChild(stage);

      const leaves=[];
      for(const [from,to,dir] of jobs){
        cachedSpread(to);
        const leaf=tpl.cloneNode(true);
        leaf.removeAttribute('id');
        leaf.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
        leaf.className='leafclone warmclone';
        const F=leaf.querySelector('.leaf-face.front .page-inner'),
              B=leaf.querySelector('.leaf-face.back .page-inner');
        if(dir>0){placeFace(F,from,'R',true);placeFace(B,to,'L',true);}
        else{placeFace(F,to,'R',true);placeFace(B,from,'L',true);}
        leaf.style.cssText='display:block;pointer-events:none;z-index:1;transform:'+
          (dir>0?'rotateY(0deg)':'rotateY(-180deg)');
        stage.appendChild(leaf);
        leaves.push([leaf,dir]);
      }
      const done=()=>{
        _turnWarmed=true;
        try{stage.remove();}catch(e){}
        resolve(true);
      };
      const WARM_DUR=Math.min(140,TURN_DUR);
      /* the whole warm body used to be armed INSIDE the double-rAF - in a hidden
         window rAF never ticks, the promise never settles, and queued notches
         bank forever. this outer timer guarantees the promise always resolves */
      setTimeout(done,WARM_DUR+700);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        if(_turnWarmed)return;   /* the fallback already settled it */
        stage.getBoundingClientRect();
        leaves.forEach(([leaf])=>leaf.getBoundingClientRect());
        const anims=leaves.map(([leaf,dir])=>leaf.animate(
          dir>0?[{transform:'rotateY(0deg)'},{transform:'rotateY(-180deg)'}]
               :[{transform:'rotateY(-180deg)'},{transform:'rotateY(0deg)'}],
          {duration:WARM_DUR,easing:SHEET_EASE,fill:'forwards'}));
        Promise.race([
          Promise.all([...anims.map(a=>a.finished.catch(()=>{})),
            decodeSpread(S.idx),decodeSpread(S.idx+1),decodeSpread(S.idx-1)]),
          new Promise(r=>setTimeout(r,WARM_DUR+260))
        ]).then(done);
      }));
    }catch(e){_turnWarmed=true;resolve(false);}
  });
  return _turnWarmPromise;
}
function requireWarmTurn(d){
  if(_turnWarmed||document.body.classList.contains('reduced'))return true;
  if(_warmQueue.length<3)_warmQueue.push(d);   /* cap: a warm stall must never BANK a burst of notches to replay later */
  if(!_warmFlush){
    _warmFlush=true;
    prewarmTurn().then(()=>{
      const q=_warmQueue.splice(0);_warmFlush=false;
      q.forEach((x,i)=>setTimeout(()=>stepTurn(x),i*72));
    });
  }
  return false;
}
/* Bandaid for the cold FIRST turn: prewarmTurn() above rasters a leaf, but the
   real spawnSheet/restack/faceClone code path is still JIT-cold until the reader's
   first wheel. So while the OPAQUE intro cover still hides the book, quietly turn
   one page out and back through the REAL path - the compile cost is paid here,
   invisibly, and the reader's first turn is hot. Ends on the home spread. */
let _pathWarmed=false;
function warmTurnPath(){
  if(_pathWarmed||document.body.classList.contains('reduced'))return;
  _pathWarmed=true;
  try{
    if(!document.body.classList.contains('intro'))return;   /* only while the cover hides it */
    if(!S.spreads||S.spreads.length<2)return;
    const home=S.idx, to=(home<S.spreads.length-1)?home+1:home-1;
    requestTurn(to);
    setTimeout(()=>{
      /* re-check the cover at FIRE time: an early cover click lets the reader
         navigate before this return-leg lands - never yank them back home */
      if(!document.body.classList.contains('intro'))return;
      try{requestTurn(home);}catch(e){}
      setTimeout(()=>{ try{ if(document.body.classList.contains('intro')&&S.idx!==home)renderSpread(home); }catch(e){} }, TURN_DUR+150);
    }, TURN_DUR+150);
  }catch(e){}
}

/* ---- spread render cache: build the heavy content ONCE, fly cheap clones ----
   Rebuilding the whole spread DOM on every notch was the main jank source.
   Now each spread's DOM is built once and cached; sheets carry clones (cheap),
   and the interactive spread is rendered exactly once, when the book rests. */
const spreadCache=new Map();
window.__renderCount=0;                 /* instrumentation: heavy renders done */
function cachedSpread(idx){
  let c=spreadCache.get(idx);
  if(!c){ const L=el('div'),R=el('div');   /* PLAIN wrappers, not .page-inner - else content double-insets (centered/small) and 'pops' on landing */
    window.__renderCount++; renderInto(L,R,S.spreads[idx],idx); c={L,R}; spreadCache.set(idx,c);
    if(spreadCache.size>40){for(const k of spreadCache.keys()){if(k!==idx){spreadCache.delete(k);break;}}}
  }
  return c;
}
function faceClone(idx,side){const n=cachedSpread(idx)[side].cloneNode(true);
  n.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));return n;}
/* A flying sheet must NEVER trigger a synchronous build (that was the riffle's
   100ms hitch when scrolling past the warm zone). If the spread is warm we fly
   a full clone - content on the sheet; if cold we fly a LIGHT placeholder (paper
   + the chapter title) and the real content warms in behind for the next pass. */
function _flightLabel(items){items=items||[];const c=items.filter(v=>v.kind==='clip').length,s=items.length-c;
  return c&&s?'clips & sessions':c?'clips':'sessions';}
function _cssUrl(s){return String(s||'').replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\n\r]/g,'');}
function renderFlightVid(v,hue){
  const p=el('div','proj flyproj');p.dataset.path=v.path||'';
  const fr=el('div','proj-frame');fr.style.setProperty('--acc-glow','rgba(0,0,0,0)');
  fr.style.setProperty('--acc-glow2',(hue&&hue.g)||'rgba(0,0,0,0)');
  const src=S.thumbs&&S.thumbs.get(v.path);
  if(src)fr.style.backgroundImage=`linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.08)),url("${_cssUrl(src)}")`;
  else fr.classList.add('missing');
  p.append(fr);
  const meta=el('div','proj-meta');
  meta.append(el('span','p-when',esc(fmtWhen(v.mtime))));
  const meta2=el('div','proj-meta2');
  const dur=(v.dur!=null)?v.dur:(S.meta&&S.meta[v.path]);if(dur!=null)S.meta[v.path]=dur;
  meta2.append(el('span','p-len',dur!=null?esc(fmtDur(dur)):'…'),
    el('span','p-dot','·'),el('span','p-size',esc(fmtSize(v.size))));
  p.append(meta,meta2);return p;
}
function renderFlightItems(c,items,hue){
  const b=pbody(c);items=items||[];
  if(items.length){const grid=el('div','vgrid flygrid');items.forEach(v=>grid.append(renderFlightVid(v,hue)));b.append(grid);}
  else b.append(emptyNote(S.media==='clips'?'clips':'sessions'));
}
function simplifyFlightFace(n){
  n.querySelectorAll('.proj').forEach(card=>{
    card.classList.add('flyproj');
    const fr=card.querySelector('.proj-frame');if(!fr)return;
    const img=fr.querySelector('img');
    const src=(img&&(img.currentSrc||img.getAttribute('src')))||(S.thumbs&&S.thumbs.get(card.dataset.path));
    while(fr.firstChild)fr.removeChild(fr.firstChild);
    if(src)fr.style.backgroundImage=`linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.08)),url("${_cssUrl(src)}")`;
    else fr.classList.add('missing');
  });
  n.querySelectorAll('.proj-acts,.proj-play,.proj-wait,.proj-glare,.proj-badge').forEach(x=>x.remove());

}
function lightFace(idx,side){
  const n=el('div'),sp=S.spreads[idx],baseHue={c:'#8a6f42',g:'rgba(138,111,66,.35)'};
  if(sp&&sp.type==='chapter'){
    const g=sp.game,hue=sp.hue||baseHue,suffix=sp.pagesN>1?` · ${roman(sp.k+1)}`:'';
    glyphmark(n,g.key,hue,(side==='R'?2:1)+sp.k*2);

        if(g.sessions.length)stats.push(`<b>${g.sessions.length}</b> session${g.sessions.length>1?'s':''}`);
        if(g.clips.length)stats.push(`<b>${g.clips.length}</b> clip${g.clips.length>1?'s':''}`);
        const total=(g.sessions.concat(g.clips)).reduce((a,v)=>a+v.size,0);stats.push(`<b>${esc(fmtSize(total))}</b>`);
        ptitle(n,`chapter ${roman(sp.gi+1)} — ${_flightLabel(sp.lItems)}`,g.display,hue,stats.join(' &nbsp;·&nbsp; '),g.key);
      }else ptitle(n,`chapter ${roman(sp.gi+1)} — ${_flightLabel(sp.lItems)}${suffix}`,g.display,hue,null,null);

  if(sp&&sp.type==='set'){

    ptitle(n,side==='L'?'appendix':'',side==='L'?sp.app.title:'',baseHue,side==='L'?esc(sp.app.desc):null);pbody(n);
    folio(n,idx,side==='R'?'r':'l','appendix — '+sp.app.title);return n;
  }
  if(sp&&sp.type==='contents'){

  }
  ptitle(n,'','LORE',baseHue);pbody(n);return n;
}
function flightFace(idx,side){
  const sp=S.spreads[idx];
  if(sp&&sp.type==='chapter')return lightFace(idx,side);  /* cheap card poster, no full DOM clone */
  const c=spreadCache.get(idx);
  if(c){const n=c[side].cloneNode(true);n.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));return simplifyFlightFace(n);}
  return lightFace(idx,side);
}
function faceNode(idx,side){
  let c=spreadCache.get(idx);
  /* Only a non-overlapped deliberate turn may build synchronously. A fast riffle
     must never compile/render a full spread while another sheet is animating. */
  if(!c && flight.length===0){ try{cachedSpread(idx); c=spreadCache.get(idx);}catch(e){} }
  if(c){const n=c[side].cloneNode(true);n.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));return n;}
  return lightFace(idx,side);

/* Move a spread's content DIRECTLY into a .page-inner (leaf face or resting page)
   - never nest a second .page-inner. The nesting double-inset the content so it
   sat centered/small during the turn, then 'popped' to place on landing. */
function placeFace(target,idx,side,flightMode){
  target.innerHTML='';
  const n=flightMode?flightFace(idx,side):faceNode(idx,side);
  while(n.firstChild)target.appendChild(n.firstChild);
  if(flightMode)simplifyFlightFace(target);
  else fillCachedThumbs(target);   /* a spread cached BEFORE its thumb loaded would fly blank
                                      then pop on landing - fill any blank card we already have */

function fillCachedThumbs(scope){
  if(!scope)return;
  scope.querySelectorAll('.proj[data-path]').forEach(card=>{
    const img=card.querySelector('.proj-frame img');
    if(img&&!img.getAttribute('src')&&S.thumbs.has(card.dataset.path)){
      img.src=S.thumbs.get(card.dataset.path);img.classList.add('on','instant');
    }

function invalidateSpreadCache(){spreadCache.clear();_turnWarmed=false;_turnWarmPromise=null;}
/* Build the spreads AROUND the resting one during idle, one per tick, so that
   when the reader riffles, spawnSheet just CLONES a warm spread instead of
   building it - that build burst was the riffle's jank. Never runs mid-turn. */
let _warmTimer=null;
function warmCache(){
  if(document.body.classList.contains('reduced'))return;
  clearTimeout(_warmTimer);
  _warmTimer=setTimeout(async function step(){
    if(S.turning||flight.length||document.body.classList.contains('resizing')||!S.spreads.length)return;
    const lo=Math.max(0,S.idx-6),hi=Math.min(S.spreads.length-1,S.idx+33);  /* warm a big window so fast riffles never fly a title-only placeholder */
    const order=[];
    for(let off=0;off<=33;off++){
      const f=S.idx+off,b=S.idx-off;
      if(f<=hi)order.push(f);
      if(off&&b>=lo)order.push(b);
    }
    for(const i of order){
      if(spreadCache.has(i)){decodeSpread(i);continue;}        /* built already - still make sure its thumbs are DECODED */

      await decodeSpread(i);                                   /* ...decode-settled, so a lifting sheet never decodes mid-flight */
      if(S.turning||flight.length||!S.spreads.length)return;   /* state may have moved during the await */
      cachedSpread(i);                                         /* ...so the built cards are instant, no per-img RPC */
      _warmTimer=setTimeout(step,26); return; }   /* one build, then yield */
  },170);
}
function underLeft(idx){placeFace($('#contentL'),idx,'L');}
function underRight(idx){placeFace($('#contentR'),idx,'R');}

function pagesRect(){if(!_pgRect)_pgRect=$('#pages').getBoundingClientRect();return _pgRect;}
addEventListener('resize',()=>{_pgRect=null;});

/* abandon every sheet at once (the book rests to tray) */
function settleFlightNow(){
  _warmQueue.length=0;   /* a settle makes owed cold-start notches meaningless - never replay them later */
  flight.forEach(r=>{r.dead=true;if(r.anim){try{r.anim.cancel();}catch(e){}}clearTimeout(r.timer);
    try{r.el.remove();}catch(e){}});
  flight=[];frontier=S.idx;S.turning=false;
  try{$('#leafshadow').style.display='none';}catch(e){}
  document.body.classList.remove('turning');
}

/* absolute jump (ribbons, contents rows, Home): abandon any riffle, send ONE
   sheet straight to the target, then a full interactive render on landing */
function requestTurn(target){
  target=cap(target);
  _warmQueue.length=0;          /* an absolute jump supersedes any owed cold-start notches */
  preloadThumbs(target);        /* one-RPC batch of the target's thumbs, in flight during the turn */
  if(document.body.classList.contains('reduced')){renderSpread(target);return;}
  flight.forEach(r=>{r.dead=true;if(r.anim){try{r.anim.cancel();}catch(e){}}clearTimeout(r.timer);
    try{r.el.remove();}catch(e){}});
  flight=[];
  if(target===S.idx){frontier=S.idx;S.turning=false;document.body.classList.remove('turning');
    $('#leafshadow').style.display='none';syncTabActive(S.chapterOf[S.idx]);renderSpread(S.idx);return;}
  frontier=target;
  spawnSheet(S.idx,target,target>S.idx?1:-1);
}
/* one wheel notch -> one sheet, IMMEDIATELY, at the rhythm you scrolled */
function stepTurn(d){
  const dir=d>0?1:-1;
  if(document.body.classList.contains('reduced')){renderSpread(cap(S.idx+dir));return;}
  if(!requireWarmTurn(dir))return;
  const from=frontier,to=cap(frontier+dir);
  if(to===from)return;                 /* at the cover / the very last page */
  frontier=to;
  /* keep at most MAXAIR sheets alive: settle the OLDEST instantly rather than
     drop the notch - during a fast riffle the snap is invisible */
  preloadThumbs(to);
  while(flight.length>=maxAir()&&flight[0]&&flight[0].land)flight[0].land();
  spawnSheet(from,to,dir);
}
function turnTo(target){requestTurn(target);}   /* legacy callers */

/* WHEEL -> notches. Learn the per-notch unit so a MERGED event (several fast
   notches the OS coalesced into one big deltaY under load) expands back into
   that many turns - NOTHING dropped - while a single notch is exactly one turn
   with no added delay. */
let _notchUnit=0;
function onWheelNotches(e){
  const mag=Math.abs(e.deltaY);if(mag<6)return;
  const dir=e.deltaY>0?1:-1;
  let n;
  if(e.deltaMode!==0){n=Math.max(1,Math.round(mag));}       /* lines / pages */
  else{if(mag>=50&&(_notchUnit===0||mag<_notchUnit))_notchUnit=Math.min(240,mag);
    /* only FULL-looking notches teach the unit: one 12px free-spin micro-tick or
       inertia tail used to ratchet the unit down to 40 forever, and every real
       120px notch after that turned 2-3 pages */
    n=_notchUnit?Math.max(1,Math.round(mag/_notchUnit)):1;}
  stepTurn(dir);                                            /* the first one NOW */
  for(let i=1;i<n;i++)setTimeout(()=>stepTurn(dir),i*72);   /* cascade merged extras */
}

/* Spawn ONE turning sheet from spread `from` to spread `to`. The sheet carries
   REAL page content on both faces (cheap clones from the cache) and the same
   soft shadow a resting page has, so nothing changes when it lands. Sheets are
   independent and overlap - a real riffle. */
function spawnSheet(from,to,dir){
  from=cap(from);to=cap(to);
  if(to===from)return;
  S.turning=true;
  document.body.classList.add('turning');
  syncTabActive(S.chapterOf[to]);
  const tpl=$('#leaf');
  const leaf=tpl.cloneNode(true);
  leaf.removeAttribute('id');
  leaf.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
  leaf.className='leafclone';
  tpl.parentNode.appendChild(leaf);
  const F=leaf.querySelector('.leaf-face.front .page-inner'),
        B=leaf.querySelector('.leaf-face.back .page-inner');
  const glow=leaf.querySelector('.leaf-glow');
  F.innerHTML='';B.innerHTML='';
  let anim;
  if(dir>0){
    /* the RIGHT leaf lifts: up-face = the page being turned (from-right); its
       back = destination-left; the right page beneath reveals to dest-right */
    placeFace(F,from,'R',true);
    placeFace(B,to,'L',true);
    underRight(to);
    leaf.style.display='block';
    /* Do not force layout here: the old getBoundingClientRect() paused every
       already-airborne sheet on ultrawide. Prewarm handles cold raster. */
    anim=leaf.animate([{transform:'rotateY(0deg)'},{transform:'rotateY(-180deg)'}],
      {duration:TURN_DUR,easing:SHEET_EASE,fill:'both'});
  }else{
    placeFace(F,to,'R',true);
    placeFace(B,from,'L',true);
    underLeft(to);
    leaf.style.display='block';
    anim=leaf.animate([{transform:'rotateY(-180deg)'},{transform:'rotateY(0deg)'}],
      {duration:TURN_DUR,easing:SHEET_EASE,fill:'both'});
  }
  /* hold the sheet FLAT for two frames: its fresh layer (paper tile + thumb
     posters) must be decoded, painted and composited before any rotation -
     otherwise raster eats the arc's first frames and the sheet pops in mid-air */
  try{anim.pause();}catch(e){}
  const curls=leaf.querySelectorAll('.leaf-curl');
  const rec={el:leaf,anim,dir,to,dead:false,lifted:false};
  rec.lift=()=>{
    if(rec.dead||rec.lifted)return;
    rec.lifted=true;
    try{anim.play();}catch(e){}
    /* depth rides the same clock as the flip - no per-frame JS (see Z_FRAMES) */
    try{leaf.animate(Z_FRAMES,{duration:TURN_DUR,easing:'linear',fill:'forwards'});}catch(e){}
    if(glow)glow.animate([{opacity:0},{opacity:.8,offset:.45},{opacity:0}],{duration:TURN_DUR});
    curls.forEach(cu=>cu.animate([{opacity:0},{opacity:.85,offset:.5},{opacity:0}],{duration:TURN_DUR,easing:'linear'}));
    clearTimeout(rec.timer);
    rec.timer=setTimeout(landAfterFinalPaint,TURN_DUR+34);   /* backstop, clocked from the REAL lift */
  };
  flight.push(rec);
  restack();
  requestAnimationFrame(()=>requestAnimationFrame(rec.lift));
  const pr=pagesRect();
  if(flight.length<=1&&innerWidth*innerHeight<=5500000)spawnSparks(pr.left+pr.width/2,pr.top+pr.height*(0.25+Math.random()*0.5),2);
  const finishLand=()=>{
    if(rec.dead)return;
    rec.dead=true;clearTimeout(rec.timer);
    /* the leaf's hidden face is now the settled page underneath */
    if(dir>0)underLeft(to);else underRight(to);
    const i=flight.indexOf(rec);if(i>=0)flight.splice(i,1);
    S.idx=cap(to);dressSigils(S.idx);   /* cap: the spreads may have been rebuilt smaller while this sheet was airborne */
    if(!flight.length){
      renderSpread(S.idx);          /* render full pages BEHIND the final leaf, then remove it: no landing pop */
      $('#leafshadow').style.display='none';
      S.turning=false;
      document.body.classList.remove('turning');
      frontier=S.idx;
    }
    try{anim.cancel();}catch(e){}
    try{leaf.remove();}catch(e){}
    restack();
  };
  const land=()=>finishLand();               /* MAXAIR cap: settle instantly */
  const landAfterFinalPaint=()=>{
    if(rec.dead||rec.landing)return;rec.landing=true;clearTimeout(rec.timer);
    /* land SYNCHRONOUSLY: the old pin-the-end-pose + double-rAF displayed one
       extra frame of the ROTATED raster, and a rotateY(-180) face never samples
       onto exactly the static page's pixels - his eye caught the ~1px card-edge
       shimmer on every settle. finishLand renders the real spread behind the
       leaf and removes it in this same task, so the next painted frame IS the
       page - no transformed frame in between. */
    finishLand();
  };
  rec.land=land;
  clearTimeout(rec.timer);
  /* hard fallback only: if the lift rAFs never fire (window hidden), lift late
     rather than never; once lifted, rec.lift re-arms the tight +34ms backstop */
  rec.timer=setTimeout(()=>{if(!rec.lifted)rec.lift();else landAfterFinalPaint();},TURN_DUR+400);
  anim.onfinish=landAfterFinalPaint;                        /* let the exact final frame paint once */
}

/* ----------------------------------------------------------------- tabs */
function paintTabs(){
  const cur=S.chapterOf[S.idx]||'';
  const gt=$('#gametabs');gt.innerHTML='';
  /* only games that actually appear under the current media filter get a bookmark */
  const games=sortedGames().filter(g=>mediaItems(g).length>0);   /* SAME order as the chapters - under A-Z/Fewest the ribbons used to keep count-order and even pick a different top-7 than the book showed */
  /* every tab is the SAME recessed leather; identity is its gem. SHORTER
     now (~2/3 the old length) and the gem sits on the INNER edge, next to
     the page. Left column: gem appended (right=inner). Right column: gem
     prepended (left=inner). */
  const GW=Math.round(wing())+23;   /* stretch the plate out toward the book's edge, stopping just before the gold rim line */
  const GEMS=['#09eee6','#7F99E8','#c9b4ff','#96e8de','#a8aed1','#6a70f2','#b79ade'];
  const glowOf=hex=>{const n=parseInt(hex.slice(1),16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},.42)`;};
  const mkTab=(label,gem,active,fn,title,gemInnerRight,key)=>{
    const t=el('div','itab'+(active?' active':''));
    t.style.setProperty('--hue',gem);
    t.style.setProperty('--glow',glowOf(gem));
    const l=el('span','tlabel',esc(label));
    const gm=el('span','gem');
    if(gemInnerRight){t.append(l);t.append(gm);}   /* left column: page is to the right */
    else{t.append(gm);t.append(l);}                /* right column: page is to the left */
    t.style.setProperty('--tw',GW+'px');
    t.dataset.key=key||'';
    t.addEventListener('click',fn);
    t.title=title||label;
    return t;};
  const GOLD='#FFE186';
  /* NO 'All' tab - the right-side 'Library' ribbon is already home/overview,
     so 'All' was redundant. The freed slot shows one more game. The column is
     7 tabs: up to 7 games, or 6 games + a '+N more' that opens the contents. */
  const GMAX=games.length>7?6:7;
  games.slice(0,GMAX).forEach((g,i)=>{
    gt.append(mkTab(g.display,GEMS[i%GEMS.length],cur===g.key,
      ()=>requestTurn(chapterStart(g.key)),g.display,true,g.key));
  });
  if(games.length>GMAX)
    gt.append(mkTab(`+${games.length-GMAX} more`,'#b79ade',false,
      ()=>requestTurn(0),'Every chapter lives in the contents',true,'contents'));
  const at=$('#apptabs');at.innerHTML='';
  at.append(mkTab('Library',GOLD,!cur.startsWith('set:'),()=>requestTurn(0),
    'Back to the book',false,'library'));
  APPENDIX.forEach((a,i)=>{
    at.append(mkTab(a.rlabel,GEMS[i%GEMS.length],cur==='set:'+a.key,
      ()=>requestTurn(S.spreads.findIndex(sp=>sp.type==='set'&&sp.app.key===a.key)),
      a.title,false,'set:'+a.key));
  });
}

const STATE_TXT={
  watching:['WATCHING','the tome lies open','var(--gold)'],
  starting:['WAKING','the quill is warming…','var(--gold-hi)'],
  recording:['WRITING','','var(--ember-hi)'],
  paused:['HELD','the quill hovers — footage kept','var(--warn)'],
  saving:['BINDING','sealing your video into the book…','var(--violet)'],
  stopped:['ASLEEP','the tome rests','#777'],
};
function sealColor(state){
  return {watching:'var(--gold)',starting:'var(--gold-hi)',recording:'var(--ember)',
    paused:'var(--warn)',saving:'var(--violet)',stopped:'#666'}[state]||'var(--gold)';
}
function applyState(st){
  const seal=$('#seal');
  const s=st.status in STATE_TXT?st.status:'watching';
  if(s!==S.lastStatus&&(s==='recording'||s==='saving')){
    const rc=seal.getBoundingClientRect();
    spawnSparks(rc.left+rc.width/2,rc.top+rc.height/2,8,
      s==='recording'?'#ff9a6a':'#c9b4f0');
  }
  seal.dataset.state=s;
  /* PERF: freeze ambient compositing while the backend is doing heavy ffmpeg work */
  document.body.classList.toggle('busy', s==='saving'||s==='recording'||s==='starting'||!!st.converting);
  seal.querySelector('svg').style.setProperty('--sc',sealColor(s));
  seal.title=(s==='recording'||s==='paused')?'Stop & save':(s==='starting'?'Cancel':'Begin recording');
  const [word,subDefault,col]=STATE_TXT[s];
  const sw=$('#stateword');sw.textContent=word;sw.style.color=col;
  const t=$('#timer');
  if(s==='recording'||s==='paused'){t.textContent=fmtClock(st.elapsed);
    t.style.color=s==='recording'?'#ffb59a':'#f0d9a0';}
  else{t.textContent='';}   /* idle: no stray dot hovering over the sub-line */
  let sub=subDefault;
  if(s==='recording')sub=(st.game||'the screen')+(st.size_mb?` — ${st.size_mb>1000?(st.size_mb/1000).toFixed(1)+' GB':Math.round(st.size_mb)+' MB'} so far`:'');
  if(s==='watching'){
    const bits=[];
    if(st.converting)bits.push(`restoring ${st.converting.name.replace(/\.mp4$/,'')}${st.converting.pct?` — ${Math.round(st.converting.pct)}%`:''}`);
    else if(st.queued)bits.push(`${st.queued} restoration${st.queued>1?'s':''} awaiting idle`);
    if(st.hdr)bits.push('HDR eyes open');
    if(bits.length)sub=bits.join(' · ');
  }
  $('#statesub').textContent=sub;
  const bb=$('#sealbtns');
  const want=(s==='recording'||s==='paused')?'rec':'idle';
  if(bb.dataset.mode!==want){
    bb.dataset.mode=want;bb.innerHTML='';
    if(want==='rec'){
      const p=el('button','sbtn',s==='paused'?'Continue':'Hold');
      p.addEventListener('click',()=>api.pause_toggle());
      bb.append(p);
      [15,30,60].forEach(sec=>{const b=el('button','sbtn',`${sec}s`);
        b.title=`Save the last ${sec} seconds`;
        b.addEventListener('click',()=>{api.clip(sec);whisper(`catching the last ${sec} seconds…`);});
        bb.append(b);});
      if(S.hasWebhook){const d=el('button','sbtn discord','➤ Discord');
        d.title='Save a clip and send it to Discord';
        d.addEventListener('click',()=>{api.clip_discord();whisper('catching a clip for the herald…');});
        bb.append(d);}
      bb.classList.add('on');
    }else{bb.classList.remove('on');}
  }else if(want==='rec'){
    const p=bb.querySelector('.sbtn');if(p)p.textContent=s==='paused'?'Continue':'Hold';
  }
  if(st.converting){
    document.querySelectorAll('.proj').forEach(pr=>{
      if(pr.dataset.path&&pr.dataset.path.endsWith(st.converting.name)){
        const bar=pr.querySelector('.proj-badge .bar');
        if(bar&&st.converting.pct!=null)bar.style.width=Math.round(st.converting.pct)+'%';
        const bt=pr.querySelector('.proj-badge .btxt');
        if(bt&&st.converting.pct!=null)bt.textContent=`Restoring true colour — ${Math.round(st.converting.pct)}%`;
      }});
  }
  $('#pages').classList.toggle('writing',s==='recording');
  S.lastStatus=s;
}

async function refreshLibrary(force){
  try{
    const sig=await api.signature();
    if(!force&&sig===S.sig)return;
    const ae=document.activeElement;
    if(S.turning
       ||$('#modal').classList.contains('on')
       ||$('#viewer').classList.contains('on')
       ||(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)))return;
    S.sig=sig;
    const curKey=S.chapterOf[S.idx];
    const chapStartIdx=S.chapterOf.indexOf(curKey);
    const offset=chapStartIdx===-1?0:S.idx-chapStartIdx;
    S.lib=await api.library();
    for(const g of (S.lib.games||[])){
      [...(g.sessions||[]),...(g.clips||[])].forEach(v=>{if(v.dur!=null)S.meta[v.path]=v.dur;});
    }
    const ae2=document.activeElement;
    if(S.turning
       ||$('#modal').classList.contains('on')
       ||$('#viewer').classList.contains('on')
       ||(ae2&&/INPUT|SELECT|TEXTAREA/.test(ae2.tagName))){S.sig='';return;}
    buildSpreads();
    let idx=S.chapterOf.indexOf(curKey);
    if(idx!==-1){
      const count=S.chapterOf.filter(k=>k===curKey).length;
      idx=idx+Math.min(offset,count-1);
    }else idx=clamp(S.idx,0,S.spreads.length-1);
    S.idx=idx;
    if(curKey&&curKey.startsWith('set:')){frontier=S.idx;paintTabs();syncNav();}
    else renderSpread(idx);
  }catch(e){}
}

  if(S.turning||flight.length){setTimeout(pollLibrary,400);return;}   /* not while leaves fly */
  await refreshLibrary(false);setTimeout(pollLibrary,2000);}

/* A live frame-rate / worst-frame readout so 60fps can be verified ON the real
   window (the throttled dev preview lies). Hidden by default; toggle with F8
   or open the app with #fps in the URL. */
function fpsMeter(){
  const box=el('div');box.id='fpsmeter';box.style.display='none';
  document.body.appendChild(box);
  let on=false,frames=0,acc=0,worst=0,plast=0,raf=0;
  function loop(t){if(!on)return;const dt=t-plast;plast=t;if(dt>worst)worst=dt;frames++;acc+=dt;
    if(acc>=400){box.textContent='FPS '+Math.round(frames/acc*1000)+'   worst '+worst.toFixed(0)+'ms';frames=0;acc=0;worst=0;}
    raf=requestAnimationFrame(loop);}
  function set(v){on=v;box.style.display=v?'block':'none';
    if(v){plast=performance.now();frames=0;acc=0;worst=0;raf=requestAnimationFrame(loop);}else cancelAnimationFrame(raf);}
  addEventListener('keydown',e=>{if(e.key==='F8')set(!on);});
  set(location.hash.includes('fps'));
}

/* ------------------------------------------------------------ the scrying */
const V={cur:null,seeking:false,trim:null};
let _viewerReq=0;
function fmtT(s){if(!isFinite(s))return'0:00';s=Math.max(0,Math.floor(s));
  const m=Math.floor(s/60),ss=s%60;return`${m}:${String(ss).padStart(2,'0')}`;}
/* the video that comes after (dir 1) or before (dir -1) the current one, within
   the same game - clips first, then sessions, matching how they're displayed.
   Past a chapter's edge it spills into the neighbouring game (in the book's
   display order), so ⏭ only goes dead at the very end of the whole library. */
function viewerSibling(dir){
  if(!V.cur)return null;
  const games=sortedGames();                  /* the chapters, in the order the book shows them */
  for(let gi=0;gi<games.length;gi++){
    const g=games[gi];
    let list=mediaItems(g);                   /* follow the same clips-first order the pages show */
    let i=list.findIndex(v=>v.path===V.cur.path);
    if(i<0){
      /* current item is outside the active filter -> walk this game's whole set instead */
      const all=[...(g.clips||[]),...(g.sessions||[])];
      const a=all.findIndex(v=>v.path===V.cur.path);
      if(a<0)continue;                        /* not this game - keep looking */
      list=all;i=a;
    }
    const j=i+dir;
    if(j>=0&&j<list.length)return list[j];
    /* off this chapter's edge: hop to the nearest neighbouring game that has
       anything visible under the current filter */
    for(let k=gi+dir;k>=0&&k<games.length;k+=dir){
      const nl=mediaItems(games[k])||[];
      if(nl.length)return dir>0?nl[0]:nl[nl.length-1];
    }
    return null;                              /* the library itself ends here */
  }
  return null;
}
let _vdelBusy=false;
async function viewerDelete(){
  const v=V.cur;if(!v||_vdelBusy)return;
  _vdelBusy=true;                                  /* delete_video can block ~7s on lock retries - a re-armed second press must not double-fire */
  const req=_viewerReq;                            /* staleness token: if the user closes/opens another video while we wait, do NOT yank the viewer around */
  const nxt=viewerSibling(1)||viewerSibling(-1);   /* after a delete, show whatever ⏭ would have gone to next - even the next game - else fall back to the previous */
  const vd=$('#vvideo');
  try{vd.pause();vd.removeAttribute('src');vd.load();}catch(e){}   /* release the localhost range handle before Windows delete */
  delProg(true,'burning memory…',18);
  let res=null;try{res=await api.delete_video(v.path);delProg(true,'cleaning the shelf…',82);}catch(e){}
  setTimeout(()=>delProg(false),500);
  _vdelBusy=false;
  if(res&&res.ok){whisper('the page lets it go…');
    /* prune the dead file from S.lib IN PLACE: refreshLibrary skips while the
       viewer is open, so without this the reopened viewer's ⏭ still "sees" the
       deleted file in the stale lib and can hand a missing path to the player */
    for(const g of (S.lib.games||[])){
      g.clips=(g.clips||[]).filter(x=>x.path!==v.path);
      g.sessions=(g.sessions||[]).filter(x=>x.path!==v.path);
      g.count=g.clips.length+g.sessions.length;
    }
    /* purge the dead file's thumbnail everywhere, or the idb store grows forever */
    try{S.thumbs.delete(v.path);}catch(e){}
    try{_tmeta&&_tmeta.delete&&_tmeta.delete(v.path);}catch(e){}
    try{idbDel(v.path);}catch(e){}
    if(req===_viewerReq){                          /* only steer the viewer if it is still OUR viewing session */
      if(nxt&&nxt.path!==v.path)openViewer(nxt);else closeViewer();
    }
    setTimeout(()=>refreshLibrary(true),400);}
  else{
    if(res&&res.why==='converting')whisper('it is being restored — wait for the ink to dry');
    else if(res&&res.why==='playing')whisper('the video is still open — try again in a moment');
    else if(res&&res.why==='locked')whisper('something is still using it — close what is open and try again');
    else whisper('the tome would not let go of it');
    /* the src was stripped before the attempt - restore playback or the reader
       stares at a dead black stage while being told to wait */
    if(req===_viewerReq&&V.cur&&V.cur.path===v.path)openViewer(v);
  }
}
async function openViewer(vid){
  const vw=$('#viewer'),vd=$('#vvideo');
  const req=++_viewerReq;
  V.cur=vid;edReset();edUI(false);
  $('#vtitle').textContent=`${fmtWhen(vid.mtime)} — ${vid.kind==='clip'?'a caught moment':'a full session'}`;
  $('#vnext').disabled=!viewerSibling(1);   /* ⏭ now only goes dead at the last video of the whole library */
  document.body.classList.add('cinema');   /* ribbons rest; region = book only */
  sendShape();
  vw.classList.add('on');
  sizeViewer();   /* fit before first paint - the editor rows are freshly hidden */
  vd.volume=(+$('#vvol').value)/100;
  let src=null;
  try{if(api.stream_url)src=await api.stream_url(vid.path);}catch(e){}
  if(req!==_viewerReq)return;
  if(!src)src=encodeURI('file:///'+String(vid.path).replace(/\\/g,'/'));
  vd.src=src;
  vd.play().catch(()=>{});
}
/* theater = our own "fullscreen": video fills the window, window maximised. No
   HTML Fullscreen API, so it can never strand a click-blocking overlay. */
async function toggleTheater(){   /* fill the app WINDOW (maximise, spares the taskbar) */
  if(document.body.classList.contains('vfull')){ exitTheater(); return; }
  document.body.classList.add('vfull');
  try{ const ws=await api.window_state(); if(ws&&!ws.maximized){ await api.toggle_maximize(); V.vfullMaxed=true; try{sendShape();}catch(e){} } }catch(e){}
  armIdleHide();
}
async function toggleFullscreenTrue(){   /* TRUE OS fullscreen: the whole monitor, over the taskbar */
  if(document.body.classList.contains('vfull')){ exitTheater(); return; }
  document.body.classList.add('vfull');
  V.vfsTrue=true;                          /* set BEFORE the await: a fast Esc/✕ mid-RPC must still take the restore branch, or the window is stranded borderless-topmost over the taskbar */
  try{ if(api.toggle_fullscreen){ const ok=await api.toggle_fullscreen();
    /* the backend returns False without throwing when it could not enter (no form,
       non-NT). leaving vfsTrue armed then would make the NEXT Esc call an ENTER -
       borderless-topmost from a fullscreen that never happened. only unwind if we
       are still in the un-consumed enter state (a fast Esc mid-RPC already cleared it) */
    if(ok===false&&V.vfsTrue){ V.vfsTrue=false; document.body.classList.remove('vfull'); } } }catch(e){ V.vfsTrue=false; }
  setTimeout(()=>{try{sendShape();}catch(e){}},70);   /* re-silhouette to a full rect once the window resized */
  armIdleHide();
}
function exitTheater(){
  clearIdleHide();
  if(document.body.classList.contains('vfull')){
    document.body.classList.remove('vfull');
    if(V.vfsTrue){ V.vfsTrue=false; try{api.toggle_fullscreen&&api.toggle_fullscreen();}catch(e){} setTimeout(()=>{try{sendShape();}catch(e){}},70); }
    else if(V.vfullMaxed){ V.vfullMaxed=false; try{api.toggle_maximize();}catch(e){} try{sendShape();}catch(e){} }
  }
  /* belt-and-suspenders: if any stray HTML fullscreen ever got set, drop it so it
     can't linger over the page and eat clicks */
  try{ if(document.fullscreenElement)document.exitFullscreen(); }catch(e){}
  sizeViewer();   /* back from theater: refit to the measured bottom group (the resize event catches the un-maximize a beat later) */
}
/* auto-hide the player controls + cursor after the mouse sits still in fullscreen */

function armIdleHide(){
  clearIdleHide();

    _vidleT=setTimeout(function(){ if(document.body.classList.contains('vfull'))document.body.classList.add('vidle'); },2500); };

  _vidleMove();

function clearIdleHide(){
  clearTimeout(_vidleT);
  if(_vidleMove){ try{$('#viewer').removeEventListener('mousemove',_vidleMove);}catch(e){} _vidleMove=null; }
  document.body.classList.remove('vidle');

function closeViewer(){
  const vw=$('#viewer'),vd=$('#vvideo');

/* ---- the editing table: mark pieces, KEEP or REMOVE them, stitch, save ---- */
function edReset(){
  /* tearing down (close/reopen): stop a running backend edit and kill any pending
     poll timer, or a ghost poll would fire on the fresh V.ed and hijack whatever
     the user opened next, and a replace-encode would keep overwriting the original */
  try{ if(V.ed){ if(V.ed.busy){try{api.edit_cancel();}catch(_){}
        whisper('export cancelled — nothing was saved');   /* navigating away silently killed a Save-new; at least SAY so */ }
      if(V.ed._pt)clearTimeout(V.ed._pt); } }catch(_){}
  V.ed={on:false,mode:'keep',segs:[],sel:0,busy:false,confirm:false,preview:false,wasReplace:false,_pt:null};
}
function edDur(){ const d=$('#vvideo').duration; return (d&&isFinite(d))?d:0; }
function edPx(t){ const w=$('#vseekwrap').getBoundingClientRect(); return clamp(t/(edDur()||1),0,1)*(w.width-14)+7; }
function edMerge(list){
  const s=list.map(x=>({a:Math.max(0,x.a),b:Math.min(edDur(),x.b)})).filter(x=>x.b-x.a>=0.2).sort((p,q)=>p.a-q.a);
  const m=[]; for(const x of s){ if(m.length&&x.a<=m[m.length-1].b+0.02)m[m.length-1].b=Math.max(m[m.length-1].b,x.b); else m.push({a:x.a,b:x.b}); }
  return m;
}
function editKeeps(){
  const dur=edDur(),marked=edMerge(V.ed.segs);
  if(V.ed.mode==='keep')return marked;
  const keeps=[]; let cur=0;                                  /* remove mode: keep the gaps */
  for(const s of marked){ if(s.a-cur>=0.2)keeps.push({a:cur,b:s.a}); cur=Math.max(cur,s.b); }
  if(dur-cur>=0.2)keeps.push({a:cur,b:dur});
  return keeps;
}
function edUI(on){
  V.ed.on=!!on;
  $('#vtrim').classList.toggle('on',!!on);
  $('#vsegs').classList.toggle('on',!!on);
  $('#vedrow').classList.toggle('on',!!on && !V.ed.busy && !V.ed.confirm);
  if(!on){ if(V.ed.busy){try{api.edit_cancel();}catch(_){}} clearTimeout(V.ed._pt);V.ed._pt=null;
    V.ed.busy=false;V.ed.confirm=false;V.ed.preview=false;
    $('#vedprog').classList.remove('on');$('#vedconfirm').classList.remove('on'); }
  if(on)layEd();
}
function layEd(){
  const box=$('#vsegs'); if(!box)return; box.innerHTML='';
  if(!edDur())return;
  V.ed.segs.forEach((s,i)=>{
    const b=el('div','edseg '+(V.ed.mode==='keep'?'keep':'cut')+(i===V.ed.sel?' sel':''));
    const x=edPx(s.a),y=edPx(s.b);
    b.style.left=x+'px'; b.style.width=Math.max(2,y-x)+'px';
    b.addEventListener('pointerdown',ev=>{ if(ev.target.classList.contains('edh'))return; V.ed.sel=i; layEd(); });
    box.append(b);
  });
  const sg=V.ed.segs[V.ed.sel];
  if(sg){ ['a','b'].forEach(k=>{ const h=el('div','edh'); h.dataset.k=k; h.style.left=edPx(sg[k])+'px'; box.append(h); }); }
  const keeps=editKeeps(), tot=keeps.reduce((n,s)=>n+(s.b-s.a),0);
  $('#vedsurv').textContent=keeps.length?`keeps ${keeps.length} piece${keeps.length>1?'s':''} · ${fmtT(tot)}`:'nothing kept';
  $('#vedkeep').classList.toggle('on',V.ed.mode==='keep');
  $('#vedcut').classList.toggle('on',V.ed.mode==='remove');
}
/* reposition the EXISTING band + handle nodes during a drag - must NOT rebuild
   #vsegs (innerHTML wipe would delete the handle mid-drag and kill pointermove) */
function edRepos(){
  const box=$('#vsegs'); if(!box)return;
  const bands=box.querySelectorAll('.edseg');
  V.ed.segs.forEach((s,i)=>{ const b=bands[i]; if(b){ const x=edPx(s.a); b.style.left=x+'px'; b.style.width=Math.max(2,edPx(s.b)-x)+'px'; } });
  const hs=box.querySelectorAll('.edh'), sg=V.ed.segs[V.ed.sel];
  if(sg&&hs.length>=2){ hs[0].style.left=edPx(sg.a)+'px'; hs[1].style.left=edPx(sg.b)+'px'; }
  const keeps=editKeeps(), tot=keeps.reduce((n,s)=>n+(s.b-s.a),0);
  $('#vedsurv').textContent=keeps.length?`keeps ${keeps.length} piece${keeps.length>1?'s':''} · ${fmtT(tot)}`:'nothing kept';
}
function edPreviewSeg(){ const vd=$('#vvideo'),s=V.ed.segs[V.ed.sel]; if(!s)return; V.ed.preview=true;
  try{vd.currentTime=s.a;vd.play().catch(()=>{});}catch(e){} }
function edValid(keeps){
  if(!keeps||!keeps.length){ whisper('nothing would be kept — adjust your pieces'); return false; }
  if(keeps.reduce((n,s)=>n+(s.b-s.a),0)<0.25){ whisper('the result would be empty'); return false; }
  return true;
}
function edConfirmReplace(){
  const keeps=editKeeps(); if(!edValid(keeps))return;
  V.ed.confirm=true; $('#vedrow').classList.remove('on');
  const dur=edDur(),tot=keeps.reduce((n,s)=>n+(s.b-s.a),0);
  $('#vedconfirm').querySelector('.msg').innerHTML=
    `This <b>replaces the original</b> with your edit —<br>${keeps.length} piece${keeps.length>1?'s':''}, ${fmtT(tot)} of ${fmtT(dur)}. The rest is gone for good.`;
  $('#vedconfirm').classList.add('on');
}
function edStart(replace,toDiscord){
  const c=V.cur; if(!c)return;
  const keeps=editKeeps(); if(!edValid(keeps))return;
  const segs=keeps.map(s=>[+s.a.toFixed(3),+s.b.toFixed(3)]);
  V.ed.busy=true; V.ed.wasReplace=!!replace;
  $('#vedrow').classList.remove('on'); $('#vedconfirm').classList.remove('on');
  $('#vedphase').textContent='preparing…'; $('#vedbar').firstElementChild.style.width='0%';
  $('#vedprog').classList.add('on');
  if(replace){ try{const vd=$('#vvideo');vd.pause();vd.removeAttribute('src');vd.load();}catch(e){} }
  Promise.resolve(api.edit_video(c.path,segs,!!replace,!!toDiscord)).then(r=>{
    if(!(r&&r.ok)){ edFail((r&&r.why)||'could not start'); return; }
    edPoll();
  }).catch(()=>edFail('could not start'));
}
function edFail(why){ V.ed.busy=false; $('#vedprog').classList.remove('on'); whisper('edit: '+why);
  if(V.ed.wasReplace){const c=V.cur;if(c)openViewer(c);}else{edUI(true);} }
function edPoll(){
  clearTimeout(V.ed._pt);
  const ed=V.ed;   /* generation token: edReset swaps V.ed, and a stale in-flight
                      edit_status continuation must never close/hijack the NEXT
                      viewer session (backend returns the terminal record forever) */
  Promise.resolve(api.edit_status()).then(st=>{
    if(ed!==V.ed)return;
    if(!st){ V.ed._pt=setTimeout(edPoll,500); return; }
    $('#vedbar').firstElementChild.style.width=(st.pct||0)+'%';
    $('#vedphase').textContent=(st.phase||'working')+' · '+(st.pct||0)+'%';
    if(st.done){
      V.ed.busy=false; $('#vedprog').classList.remove('on');
      if(st.ok){ whisper('saved ✓ — '+(st.name||'your edit')); edReset(); closeViewer(); refreshLibrary(true); }
      else{ whisper(st.why==='cancelled'?'edit cancelled — original untouched':'edit failed: '+(st.why||'see lore.log'));
        if(V.ed.wasReplace){const c=V.cur;if(c)openViewer(c);}else{edUI(true);} }
      return;
    }
    V.ed._pt=setTimeout(edPoll,450);
  }).catch(()=>{ if(ed===V.ed)V.ed._pt=setTimeout(edPoll,600); });
}
/* fit the stage to what is REALLY below it. the old hard-coded
   calc(100vh - 150px) guessed at the bottom group's height; open the editor
   and the guess ran short, so flex overflow shoved the video over the gold
   ring, the details line, even toward the ✕. measure, don't guess. */
function sizeViewer(){
  const vw=$('#viewer');
  if(!vw||document.body.classList.contains('vfull'))return;   /* theater has its own fixed geometry */
  const H=s=>{const n=$(s);return n?n.offsetHeight:0;};        /* display:none measures 0, conveniently */
  const rows=H('#vedrow')+H('#vedprog')+H('#vedconfirm');
  const below=H('#vtitle')+H('#vbar')+rows+(rows?8:0);         /* +8: the open row's margin-top - offsetHeight doesn't count margins */
  /* 48 up top for ✕ + the drag pill · 30 under the video (the corner marks
     hang 18px past the frame and there must be air under them) · 8 for the
     details→toolbar gap (vtitle's margin) · 16 bottom padding */
  vw.style.setProperty('--vmaxh',Math.max(140,innerHeight-48-30-8-16-below)+'px');
  vw.style.setProperty('--vmaxw',Math.max(220,innerWidth-90)+'px');   /* ring + corners stay clear of the ✕ */
}
function wireViewer(){
  const vd=$('#vvideo'),seek=$('#vseek'),play=$('#vplay'),time=$('#vtime');
  $('#vclose').addEventListener('click',closeViewer);
  $('#viewer').addEventListener('click',e=>{if(e.target.id==='viewer')closeViewer();});
  $('#vext').addEventListener('click',()=>{const c=V.cur;closeViewer();if(c)api.open_video(c.path);});
  $('#vnext').addEventListener('click',()=>{const n=viewerSibling(1);if(n)openViewer(n);});
  $('#vfs').addEventListener('click',()=>toggleFullscreenTrue());
  let _vdelArm=false,_vdelT=null;
  $('#vdel').addEventListener('click',()=>{const b=$('#vdel');

  play.addEventListener('click',()=>{vd.paused?vd.play().catch(()=>{}):vd.pause();});

    if(V.ed&&V.ed.on&&V.ed.preview&&!vd.paused&&!V.seeking){const s=V.ed.segs[V.ed.sel];if(s&&vd.currentTime>s.b-0.03)vd.currentTime=s.a;}});

  $('#vtrim').addEventListener('click',()=>{

    V.ed.mode='keep'; V.ed.sel=0; V.ed.busy=false; V.ed.confirm=false;
    V.ed.segs=[{a:clamp(t-6,0,Math.max(0,vd.duration-1)),b:clamp(t+6,1,vd.duration)}];
    $('#veddisc').style.display=S.hasWebhook?'':'none';

  $('#vedsave').addEventListener('click',()=>edStart(false,false));

  $('#vedconfno').addEventListener('click',()=>{V.ed.confirm=false;$('#vedconfirm').classList.remove('on');edUI(true);});
  $('#vedconfyes').addEventListener('click',()=>{V.ed.confirm=false;$('#vedconfirm').classList.remove('on');edStart(true,false);});
  $('#vedstop').addEventListener('click',()=>{try{api.edit_cancel();}catch(e){}$('#vedphase').textContent='cancelling…';});
  /* handle dragging (delegated over the segment overlay) */
  $('#vsegs').addEventListener('pointerdown',e=>{

    e.preventDefault();e.stopPropagation();});
